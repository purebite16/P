<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PureBite অ্যাডমিন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0f3d2e;--g2:#165c44;--gold:#c9a24a;--gold2:#e6c675;--bg:#f4f1e8;--card:#fff;--tx:#1d2a24;--mut:#6b776f;--red:#b3261e;--ok:#1b7a4b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button,select,input{font-family:inherit;font-size:15px}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:var(--gold2);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--gold)}
.logo{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);background:var(--g) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font:700 26px Georgia,serif;color:var(--gold2);flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
header h1{font-size:18px;line-height:1.2}header small{color:#cfe3d8;font-size:12px}
header .sp{flex:1}
.hb{background:rgba(255,255,255,.12);color:var(--gold2);border:1px solid var(--gold);border-radius:10px;padding:7px 11px;cursor:pointer}
#login{max-width:380px;margin:12vh auto;padding:28px 22px;background:var(--card);border:2px solid var(--gold);border-radius:18px;text-align:center;box-shadow:0 10px 30px rgba(15,61,46,.15)}
#login .logo{width:92px;height:92px;margin:0 auto 14px;font-size:50px}
#login h2{color:var(--g);margin-bottom:4px}#login p{color:var(--mut);font-size:14px;margin-bottom:16px}
input.t{width:100%;padding:12px;border:1.5px solid #cfd8d2;border-radius:10px;margin-bottom:12px}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--g);font-weight:700;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;width:100%}
#err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
#app{display:none;max-width:760px;margin:0 auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:12px;padding:10px;text-align:center;border-bottom:3px solid var(--gold)}
.stat b{display:block;font-size:20px;color:var(--g)}.stat span{font-size:12px;color:var(--mut)}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input{flex:1;padding:10px 12px;border:1.5px solid #cfd8d2;border-radius:10px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{white-space:nowrap;border:1.5px solid var(--g2);color:var(--g2);background:#fff;border-radius:20px;padding:6px 13px;cursor:pointer;font-size:14px}
.chip.on{background:var(--g);color:var(--gold2);border-color:var(--g)}
.o{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border-left:5px solid var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.o.new{border-left-color:var(--red)}
.oh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}
.ref{font-weight:700;color:var(--g)}.ts{font-size:12px;color:var(--mut)}
.badge{font-size:12px;padding:3px 10px;border-radius:12px;background:#e8f1ec;color:var(--g2);white-space:nowrap;font-weight:600}
.badge.n{background:#fde7e5;color:var(--red)}.badge.d{background:#dff3e7;color:var(--ok)}.badge.c{background:#eee;color:#666}
.nm{font-size:17px;font-weight:600}.ad{color:var(--mut);font-size:14px;margin:2px 0 8px}
.it{font-size:14px;border-top:1px dashed #ddd;padding-top:8px}.it div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.tot{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-top:4px}
.gt{display:flex;justify-content:space-between;font-size:19px;font-weight:700;color:var(--g);margin:6px 0 8px;border-top:2px solid var(--gold);padding-top:6px}
.note{background:#fff8e1;border-radius:8px;padding:6px 9px;font-size:13px;margin-bottom:8px}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.acts a,.acts button,.acts select{border:1.5px solid var(--g2);background:#fff;color:var(--g2);border-radius:9px;padding:8px 11px;cursor:pointer;text-decoration:none;font-size:14px}
.acts .wa{background:#25d366;color:#fff;border-color:#25d366}
.acts .del{border-color:var(--red);color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#more{display:none;margin:6px auto 30px;width:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g);color:var(--gold2);padding:10px 18px;border-radius:20px;display:none;z-index:9}
#tabs{margin-bottom:10px}.u{background:var(--card);border-radius:12px;padding:11px 13px;margin-bottom:9px;border-left:5px solid var(--gold);cursor:pointer}.u b{color:var(--g)}.u small{color:var(--mut);display:block}
.tg{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:10px;background:#e8f1ec;color:var(--g2);margin:3px 3px 0 0}.tg.r{background:#fde7e5;color:var(--red)}.tg.y{background:#fff3cd;color:#8a6500}
.det{background:var(--card);border-radius:14px;padding:14px;border:2px solid var(--gold)}.det h3{color:var(--g);margin-bottom:6px}.det .r{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #ddd;font-size:14px;gap:8px}.det .acts{margin-top:10px}
@media print{header,.bar,.chips,.acts,.stats{display:none}.o{break-inside:avoid;box-shadow:none;border:1px solid #999}}
</style>
</head>
<body>
<div id="login">
  <div class="logo"><img src="logo.jpg" alt="" onerror="this.remove();this.parentNode&&(this.parentNode.textContent='B')"></div>
  <h2>PureBite</h2>
  <p>অ্যাডমিন অর্ডার প্যানেল</p>
  <input class="t" id="key" type="password" placeholder="অ্যাডমিন কী" autocomplete="current-password">
  <button class="btn" id="go">প্রবেশ করুন</button>
  <div id="err"></div>
</div>

<div id="app">
  <div class="chips" id="tabs"><button class="chip on" data-tb="o">🧾 অর্ডার</button><button class="chip" data-tb="c">👥 কাস্টমার</button><button class="chip" data-tb="s">⚙️ কমিশন সেটিংস</button></div>
  <div id="pO">
  <div class="stats">
    <div class="stat"><b id="s1">0</b><span>নতুন অর্ডার</span></div>
    <div class="stat"><b id="s2">0</b><span>আজকের অর্ডার</span></div>
    <div class="stat"><b id="s3">৳0</b><span>আজকের বিক্রি</span></div>
  </div>
  <div class="bar"><input id="q" type="search" placeholder="নাম, ফোন বা অর্ডার নম্বর খুঁজুন"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <button class="btn" id="more">আরও পুরোনো অর্ডার</button>
  </div>
  <div id="pC" style="display:none"><div class="bar"><input id="cq" type="search" placeholder="নাম, ফোন বা ইমেইল খুঁজুন"></div><div id="cl"></div></div>
  <div id="pS" style="display:none"></div>
</div>
<div id="toast"></div>

<script>
const ST=['নতুন','প্যাকিং','পাঠানো হয়েছে','ডেলিভারি হয়েছে','বাতিল'];
const $=s=>document.querySelector(s);
let KEY='',ORD=[],MORE='',FIL='সব',TIMER;
try{KEY=sessionStorage.getItem('pbk')||''}catch(e){}
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const money=n=>'৳'+bn(Number(n).toLocaleString('en-IN'));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}
const SB={new:'নতুন',packing:'প্যাকিং',shipped:'পাঠানো হয়েছে',delivered:'ডেলিভারি হয়েছে',cancelled:'বাতিল'},BS=Object.fromEntries(Object.entries(SB).map(([k,v])=>[v,k]));
async function api(a,x){
  const r=await fetch('/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:KEY,a,...(x||{})})});
  const j=await r.json().catch(()=>({ok:false,m:'সার্ভারের উত্তর বোঝা যায়নি'}));
  if(!j.ok)throw new Error(j.m||'ত্রুটি');return j;
}
async function load(more){
  try{
    const j=await api('orders',more&&MORE?{before:MORE}:{});
    j.orders.forEach(o=>o.st=SB[o.st]||o.st);ORD=more?ORD.concat(j.orders):j.orders;MORE=j.more;
    $('#login').style.display='none';$('#app').style.display='block';
    try{sessionStorage.setItem('pbk',KEY)}catch(e){}
    render();clearInterval(TIMER);TIMER=setInterval(()=>load(false).catch(()=>{}),60000);
  }catch(e){
    if(!$('#app').style.display||$('#app').style.display==='none'){$('#err').textContent=e.message;try{sessionStorage.removeItem('pbk')}catch(_){}}
    else toast(e.message);
    throw e;
  }
}
function badge(s){return '<span class="badge '+(s==='নতুন'?'n':s==='ডেলিভারি হয়েছে'?'d':s==='বাতিল'?'c':'')+'">'+esc(s)+'</span>'}
function render(){
  const today=new Date().toDateString();
  const td=ORD.filter(o=>new Date(o.ts).toDateString()===today&&(o.st||'নতুন')!=='বাতিল');
  $('#s1').textContent=bn(ORD.filter(o=>(o.st||'নতুন')==='নতুন').length);
  $('#s2').textContent=bn(td.length);
  $('#s3').textContent=money(td.reduce((a,o)=>a+o.total,0));
  $('#chips').innerHTML=['সব',...ST].map(c=>'<button class="chip'+(c===FIL?' on':'')+'" data-c="'+c+'">'+c+'</button>').join('');
  const q=$('#q').value.trim().toLowerCase();
  const L=ORD.filter(o=>(FIL==='সব'||(o.st||'নতুন')===FIL)&&(!q||(o.name+o.phone+o.ref).toLowerCase().includes(q)));
  $('#list').innerHTML=L.length?L.map(card).join(''):'<div class="empty">কোনো অর্ডার নেই</div>';
  $('#more').style.display=MORE?'block':'none';
}
function card(o){
  const st=o.st||'নতুন',d=new Date(o.ts);
  const ph=esc(o.phone),wa='https://wa.me/88'+ph;
  const msg=encodeURIComponent('আসসালামু আলাইকুম '+o.name+', PureBite থেকে আপনার অর্ডার '+o.ref+' (মোট '+o.total+' টাকা) সম্পর্কে জানাচ্ছি।');
  return '<div class="o'+(st==='নতুন'?' new':'')+'"><div class="oh"><div><div class="ref">'+esc(o.ref)+'</div><div class="ts">'+d.toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'})+'</div></div>'+badge(st)+'</div>'
  +'<div class="nm">'+esc(o.name)+' · '+bn(ph)+'</div><div class="ad">📍 '+esc(o.addr)+', '+esc(o.thana)+', '+esc(o.dist)+'</div>'
  +'<div class="it">'+o.items.map(i=>'<div><span>'+esc(i.n)+' × '+bn(i.q)+'</span><span>'+money(i.q*i.p)+'</span></div>').join('')+'</div>'
  +'<div class="tot"><span>পণ্য</span><span>'+money(o.sub)+'</span></div>'
  +(o.cd?'<div class="tot"><span>ছাড়</span><span>−'+money(o.cd)+'</span></div>':'')
  +'<div class="tot"><span>ডেলিভারি ('+esc(o.zone)+')</span><span>'+money(o.ship)+'</span></div>'
  +'<div class="gt"><span>মোট</span><span>'+money(o.total)+'</span></div>'
  +'<div class="tot" style="margin-bottom:8px"><span>পেমেন্ট</span><span>'+esc(o.pay)+'</span></div>'
  +(o.note?'<div class="note">📝 '+esc(o.note)+'</div>':'')
  +'<div class="acts"><a href="tel:'+ph+'">📞 কল</a><a class="wa" href="'+wa+'?text='+msg+'" target="_blank" rel="noopener">WhatsApp</a>'
  +'<select data-ref="'+esc(o.ref)+'" class="st">'+ST.map(s=>'<option'+(s===st?' selected':'')+'>'+s+'</option>').join('')+'</select>'
  +'<button class="del" data-del="'+esc(o.ref)+'">🗑 মুছুন</button></div></div>';
}
$('#go').onclick=()=>{KEY=$('#key').value.trim();$('#err').textContent='';if(KEY)load(false).catch(()=>{})};
$('#key').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#q').addEventListener('input',render);
$('#more').onclick=()=>load(true).catch(()=>{});
$('#chips').onclick=e=>{const c=e.target.dataset.c;if(c){FIL=c;render()}};
$('#list').addEventListener('change',async e=>{
  if(!e.target.classList.contains('st'))return;
  const ref=e.target.dataset.ref,st=e.target.value;
  try{await api('ost',{oid:ref,st:BS[st]});ORD.find(o=>o.ref===ref).st=st;render();toast('স্ট্যাটাস বদলানো হয়েছে')}catch(x){toast(x.message);render()}
});
$('#list').addEventListener('click',async e=>{
  const ref=e.target.dataset.del;if(!ref)return;
  if(!confirm('অর্ডার '+ref+' স্থায়ীভাবে মুছে ফেলবেন?'))return;
  try{await api('odel',{ref});ORD=ORD.filter(o=>o.ref!==ref);render();toast('মুছে ফেলা হয়েছে')}catch(x){toast(x.message)}
});

/* ---- ট্যাব, কাস্টমার, কমিশন ---- */
let TAB='o',CUS=[],CFG={};
const CM_BN={none:'',pending:'কমিশন আবেদন',approved:'কমিশন সদস্য',rejected:'কমিশন বাতিল'};
document.getElementById('tabs').onclick=async e=>{const t=e.target.dataset.tb;if(!t)return;TAB=t;
  document.querySelectorAll('#tabs .chip').forEach(c=>c.classList.toggle('on',c.dataset.tb===t));
  $('#pO').style.display=t==='o'?'':'none';$('#pC').style.display=t==='c'?'':'none';$('#pS').style.display=t==='s'?'':'none';
  try{if(t==='c')await loadCus();if(t==='s')await loadCfg()}catch(x){toast(x.message)}};
async function loadCus(){const j=await api('list');CUS=j.list;renderCus()}
function renderCus(){const q=$('#cq').value.trim().toLowerCase();
  const L=CUS.filter(u=>!q||(u.n+u.p+u.e).toLowerCase().includes(q));
  $('#cl').innerHTML=L.length?L.map(u=>'<div class="u" data-u="'+esc(u.id)+'"><b>'+esc(u.n||'(নাম নেই)')+'</b><small>'+esc(u.p||'')+' '+esc(u.e||'')+'</small>'
   +'<span class="tg">'+bn(u.o)+' অর্ডার</span>'+(u.c?'':'<span class="tg y">অ্যাকাউন্ট চালু হয়নি</span>')+(u.q?'<span class="tg r">চালুর আবেদন</span>':'')
   +(u.cm==='pending'?'<span class="tg r">কমিশন আবেদন</span>':u.cm==='approved'?'<span class="tg">💼 কমিশন সদস্য</span>':'')+'</div>').join(''):'<div class="empty">কোনো কাস্টমার নেই</div>'}
$('#cq').addEventListener('input',renderCus);
$('#cl').addEventListener('click',async e=>{const b=e.target.closest('[data-u]');if(!b)return;openU(b.dataset.u)});
async function openU(id){try{const j=await api('get',{id});const u=j.u,c=u.comm;
  const od=u.orders.slice(0,15).map(o=>'<div class="r"><span>#'+esc(o.id)+' · '+esc(SB[o.st]||o.st)+'</span><b>'+money(o.total)+'</b></div>').join('')||'<div class="empty" style="padding:8px">অর্ডার নেই</div>';
  $('#cl').innerHTML='<div class="det"><button class="hb" style="background:var(--g)" id="bk">← ফিরে যান</button><h3 style="margin-top:10px">'+esc(u.name)+'</h3>'
   +'<div class="r"><span>মোবাইল</span><b>'+esc(u.phone||'-')+'</b></div><div class="r"><span>ইমেইল</span><b>'+esc(u.email||'-')+'</b></div><div class="r"><span>ঠিকানা</span><b>'+esc(u.addr||'-')+'</b></div>'
   +'<div class="r"><span>অ্যাকাউন্ট</span><b>'+(u.claimed?'চালু':'চালু হয়নি')+'</b></div><div class="r"><span>ব্লগ পড়েছে</span><b>'+bn(u.reads)+'টি</b></div>'
   +(u.pend?'<div class="note">🔔 অ্যাকাউন্ট চালুর আবেদন — যাচাই কোড: <b>'+esc(u.pend.code)+'</b></div><div class="acts"><button data-x="approve">✅ অনুমোদন</button><button class="del" data-x="reject">❌ বাতিল</button></div>':'')
   +'<h3 style="margin-top:14px">💼 কমিশন: '+(CM_BN[c.st]||'সদস্য নন')+'</h3>'
   +(c.st==='approved'?'<div class="r"><span>কোড</span><b>'+esc(c.code)+'</b></div><div class="r"><span>হার</span><b>'+bn(c.rate)+'%</b></div><div class="r"><span>সফল অর্ডার (পণ্যমূল্য)</span><b>'+money(c.ok)+'</b></div><div class="r"><span>পেন্ডিং</span><b>'+money(c.pend)+'</b></div><div class="r"><span>মোট কমিশন</span><b>'+money(c.earned)+'</b></div><div class="r"><span>পরিশোধ</span><b>'+money(c.paid)+'</b></div><div class="r"><span>বাকি</span><b>'+money(c.due)+'</b></div>':'')
   +'<div class="acts"><button data-x="capprove">✅ কমিশন অনুমোদন / হার বদল</button>'+(c.st==='approved'?'<button data-x="cpay">💸 পরিশোধ লিখুন</button>':'')+'<button class="del" data-x="creject">কমিশন বাতিল</button></div>'
   +'<h3 style="margin-top:14px">🧾 অর্ডার ('+bn(u.orders.length)+')</h3>'+od
   +'<div class="acts" style="margin-top:14px"><button data-x="setpw">🔑 পাসওয়ার্ড সেট</button><button data-x="edit">✏️ তথ্য বদল</button><button class="del" data-x="del">🗑 অ্যাকাউন্ট মুছুন</button></div></div>';
  $('#bk').onclick=()=>loadCus().catch(()=>{});
  $('#cl').querySelector('.det').onclick=async ev=>{const x=ev.target.dataset.x;if(!x)return;
   try{
    if(x==='approve'){await api('approve',{id});toast('অনুমোদিত ✓')}
    else if(x==='reject'){await api('reject',{id});toast('বাতিল')}
    else if(x==='capprove'){const r=prompt('কমিশন হার (%)',c.rate===''?CFG.rate||10:c.rate);if(r===null)return;const cd=prompt('রেফারেল কোড (ফাঁকা রাখলে অটো)',c.code||'');if(cd===null)return;const k=await api('cset',{id,st:'approved',rate:r,code:cd});toast('অনুমোদিত ✓ কোড: '+k.code)}
    else if(x==='creject'){if(!confirm('কমিশন সদস্যপদ বাতিল করবেন?'))return;await api('cset',{id,st:'rejected'});toast('বাতিল')}
    else if(x==='cpay'){const a=prompt('কত টাকা পরিশোধ করেছেন?');if(!a)return;await api('cpay',{id,amount:a});toast('লেখা হয়েছে ✓')}
    else if(x==='setpw'){const pw=prompt('নতুন পাসওয়ার্ড (ছোট+বড় হাতের অক্ষর, সংখ্যা ও চিহ্ন, ৮+)');if(!pw)return;await api('setpw',{id,password:pw});toast('পাসওয়ার্ড সেট ✓')}
    else if(x==='edit'){const n=prompt('নাম',u.name);if(n===null)return;const ph=prompt('মোবাইল',u.phone||'');if(ph===null)return;const em=prompt('ইমেইল',u.email||'');if(em===null)return;const ad=prompt('ঠিকানা',u.addr||'');if(ad===null)return;await api('save',{id,name:n,phone:ph,email:em,addr:ad});toast('সেভ ✓')}
    else if(x==='del'){if(!confirm('অ্যাকাউন্ট স্থায়ীভাবে মুছবেন?'))return;await api('del',{id});toast('মুছে গেছে');return loadCus()}
    openU(id)}catch(err){toast(err.message)}};
 }catch(x){toast(x.message)}}

  +'<label>ডিফল্ট কমিশন (%)</label><input class="t" id="cf1" type="number" value="'+esc(CFG.rate)+'"><label>পাইকারী ছাড় (%)</label><input class="t" id="cf2" type="number" value="'+esc(CFG.wsPct)+'"><label>পাইকারী নোট (ঐচ্ছিক, যেমন ন্যূনতম অর্ডার)</label><input class="t" id="cf3" value="'+esc(CFG.wsNote||'')+'"><button class="btn" id="cfs">সেভ করুন</button></div>';
