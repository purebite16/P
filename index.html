async function encKey(pw,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

/* ---------- SHA-256 (অর্ডার ট্র্যাক কী-এর জন্য) ---------- */
const SHA=(()=>{const K=[],H=[];const fr=x=>((x-Math.floor(x))*4294967296)|0;let n=2,c=0;while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}if(p){if(c<8)H.push(fr(Math.sqrt(n)));K.push(fr(Math.cbrt(n)));c++}n++}return{K,H}})();
function sha256(s){
 const b=unescape(encodeURIComponent(s)),l=b.length,w=[];
 for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<((3-i%4)*8);
 w[l>>2]|=0x80<<((3-l%4)*8);
 const nl=(((l+8)>>6)+1)*16;w[nl-1]=l*8;for(let i=0;i<nl;i++)w[i]=w[i]|0;
 let h=SHA.H.slice();
 for(let j=0;j<nl;j+=16){
  const x=w.slice(j,j+16);
  for(let i=16;i<64;i++){const a=x[i-15],c=x[i-2];const s0=(a>>>7|a<<25)^(a>>>18|a<<14)^(a>>>3),s1=(c>>>17|c<<15)^(c>>>19|c<<13)^(c>>>10);x[i]=(x[i-16]+s0+x[i-7]+s1)|0}
  let [a,b2,c2,d,e,f,g,hh]=h;
  for(let i=0;i<64;i++){
   const S1=(e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7),ch=(e&f)^(~e&g),t1=(hh+S1+ch+SHA.K[i]+x[i])|0;
   const S0=(a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10),mj=(a&b2)^(a&c2)^(b2&c2),t2=(S0+mj)|0;
   hh=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b2;b2=a;a=(t1+t2)|0;
  }
  const r=[a,b2,c2,d,e,f,g,hh];h=h.map((v,i)=>(v+r[i])|0);
 }
 return h.map(v=>('00000000'+(v>>>0).toString(16)).slice(-8)).join('');
}

function genAffCode(){let c;do{c='PB'+String(Math.floor(1000+Math.random()*9000))}while(db.aff.list.some(a=>a.code===c));return c}
function affModal(id){
 const a=id?db.aff.list.find(x=>x.id===id):null;
 openModal(a?'অ্যাফিলিয়েট এডিট':'নতুন অ্যাফিলিয়েট',`<label class="f" style="margin-bottom:12px">নাম<input id="af_n" value="${esc(a?a.name:'')}"></label>
 <div class="grid2" style="margin-bottom:12px"><label class="f">ফোন / WhatsApp<input id="af_p" inputmode="tel" value="${esc(a?a.phone:'')}"></label><label class="f">এলাকা<input id="af_a" value="${esc(a?a.area:'')}"></label></div>
 <label class="f" style="margin-bottom:12px">Facebook / Instagram<input id="af_f" value="${esc(a?a.fb:'')}"></label>
 <div class="grid2" style="margin-bottom:12px"><label class="f">রেফারেল কোড (৩–১২ অক্ষর/সংখ্যা)<input id="af_c" value="${esc(a?a.code:genAffCode())}" style="text-transform:uppercase"></label><label class="f">আলাদা কমিশন % (ফাঁকা = সাধারণ ${bn(db.aff.rate,1)}%)<input id="af_r" type="number" min="0" max="100" step="0.5" value="${a&&a.rate>0?a.rate:''}"></label></div>
 <label class="f">অবস্থা<select id="af_s">${Object.entries(AFST).map(([k,v])=>`<option value="${k}" ${(a?a.st:'active')===k?'selected':''}>${v[0]}</option>`).join('')}</select></label>`,
 `<button class="btn ghost" data-act="close">বাতিল</button><button class="btn" data-act="affSave" data-id="${id||''}">সেভ করুন</button>`);
}
function affSaveOne(id){
 const name=val('af_n');if(!name)return toast('নাম দিন');
 const code=affCode(val('af_c'));if(!/^[A-Z0-9]{3,12}$/.test(code))return toast('কোড ৩–১২টি ইংরেজি অক্ষর/সংখ্যার হতে হবে');
 if(db.aff.list.some(a=>a.code===code&&a.id!==id))return toast('এই কোড আগে থেকেই আছে');
 const r=Math.min(100,Math.max(0,+val('af_r')||0)),f={name,phone:val('af_p'),area:val('af_a'),fb:val('af_f'),code,rate:r,st:val('af_s')};
 if(id){const a=db.aff.list.find(x=>x.id===id);if(a){if(a.code!==code)db.orders.forEach(o=>{if(o.ref===a.code)o.ref=code});Object.assign(a,f)}}
 else db.aff.list.push({id:'a'+uid(),paid:0,d:ymd(new Date()),...f});
 save();closeModal();toast('অ্যাফিলিয়েট সেভ হয়েছে ✓');render();
}

function refVal(){return affCode(val('k_ref'))}
function refBad(){const c=refVal();if(!c)return false;if(CM)return !(db.aff.on&&(db.aff.codes||[]).includes(c));return !db.aff.list.some(a=>a.code===c&&a.st==='active')}

function relHTML(g){
 const all=shopData().filter(x=>x!==g&&x.cat+'|'+x.g!==PG.key&&(!CM||x.items.some(i=>i.avail)));

let PGR=null;
function moreHTML(g){
 const all=shopData().filter(x=>x!==g&&x.cat+'|'+x.g!==PG.key&&(!CM||x.items.some(i=>i.avail)));

'লিচু ফুলের মধু':{h:'লিচু ফুলের মধু: হালকা রং ও ফলের মতো মিষ্টি ঘ্রাণ',s:'লিচু গাছের ফুল থেকে সংগৃহীত হালকা রঙের মধু। মিষ্টি, সুগন্ধি ও মোলায়েম স্বাদের জন্য অনেকের প্রিয়।',i:'বসন্তের শেষে লিচু গাছে ফুল আসে। মৌমাছিরা সেই ফুলের রস থেকে যে মধু তৈরি করে তা হালকা রঙের এবং ফুলের মতো সুগন্ধযুক্ত হয়।',x:[['স্বাদ ও রং','হালকা সোনালি থেকে প্রায় স্বচ্ছ রং, মোলায়েম মিষ্টি স্বাদ এবং ফলের মতো ঘ্রাণ — যারা কড়া স্বাদ পছন্দ করেন না, তাদের জন্য ভালো।'],['কখন সংগ্রহ হয়','সাধারণত মার্চ–এপ্রিল মাসে লিচুর মৌসুমে। সংগ্রহের স্থান ও সময় পণ্যের "বিস্তারিত" অংশে দেখুন।'],['ব্যবহার','সরাসরি চামচে, চায়ে, দইয়ে, ফলের সালাদে বা পানীয়তে মিশিয়ে খাওয়া যায়।']],t:['ঢাকনা আঁটা কাচের জারে রাখুন।','রোদ থেকে দূরে রাখুন।','জমে গেলে হালকা গরম পানিতে তরল করুন।'],f:[['এই মধু কি খুব মিষ্টি?','মিষ্টি, তবে মোলায়েম; তীব্র ঝাঁঝ থাকে না।'],['ফ্রিজে রাখা যাবে?','দরকার নেই; ঠান্ডা ঘরের তাপমাত্রায় রাখলেই চলে। ফ্রিজে রাখলে দ্রুত জমতে পারে।']]},
'কালোজিরা ফুলের মধু':{h:'কালোজিরা ফুলের মধু: গাঢ় রং, ঘন গড়ন ও হালকা ঝাঁজ',s:'কালোজিরা ফুলের মধু সাধারণত গাঢ় বাদামি, ঘন ও সুগন্ধি। মিষ্টির সাথে হালকা ঝাঁজ ও সামান্য তিতকুটে আভা এর বৈশিষ্ট্য।',i:'কালোজিরা বা নাইজেলা গাছের ফুল থেকে সংগৃহীত এই মধু অন্য ফুলের মধু থেকে আলাদা স্বাদের। যারা একটু গাঢ় ও ঝাঁজালো স্বাদ পছন্দ করেন, তাদের কাছে এটি বিশেষ জনপ্রিয়।',x:[['স্বাদ কেমন?','রং গাঢ় বাদামি, ঘনত্ব বেশি। মিষ্টির সাথে হালকা ঝাঁজ থাকে এবং গলায় সামান্য ঝাঁজ লাগতে পারে — এটাই এই মধুর বৈশিষ্ট্য।'],['জমে যাওয়া','শীতে এই মধু সহজে জমে যেতে পারে। এটি প্রাকৃতিক প্রক্রিয়া।'],['ব্যবহার','সকালে সরাসরি এক চা-চামচ, কুসুম গরম পানিতে বা আদা-চায়ে মিশিয়ে নিতে পারেন।']],t:['শুকনো ও পরিষ্কার চামচ ব্যবহার করুন।','জারের মুখ ভালো করে বন্ধ রাখুন।','সরাসরি রোদে রাখবেন না।'],f:[['গলায় ঝাঁজ লাগে কেন?','কালোজিরা ফুলের মধুর স্বাভাবিক বৈশিষ্ট্য এটি।'],['কাদের জন্য ভালো?','যারা গাঢ় ও বৈশিষ্ট্যপূর্ণ স্বাদ পছন্দ করেন। কোনো রোগের চিকিৎসা হিসেবে নয়; স্বাস্থ্য-সমস্যা থাকলে চিকিৎসকের পরামর্শ নিন।']]},
'বরই ফুলের মধু':{h:'বরই (কুল) ফুলের মধু: মিষ্টি ও মৃদু ক্যারামেল স্বাদ',s:'বরই বা কুল গাছের ফুল থেকে সংগৃহীত মধু। মাঝারি রঙের, মিষ্টি ও মৃদু ক্যারামেলের মতো স্বাদ।',i:'বরই গাছ শুষ্ক ও আধা-শুষ্ক এলাকায় ভালো জন্মায়। এর ছোট ফুল মৌমাছির প্রিয়, আর সেই ফুল থেকে পাওয়া মধু সুগন্ধি ও মধ্যম ঘনত্বের হয়।',x:[['স্বাদ ও ঘ্রাণ','মধ্যম সোনালি-বাদামি রং, মিষ্টি স্বাদের সাথে হালকা ক্যারামেল আভা পাওয়া যায়।'],['মৌসুম','বরই গাছে সাধারণত শীতের আগে-পরে ফুল আসে। সঠিক সংগ্রহের সময় প্রতিটি ব্যাচের "বিস্তারিত"-এ দেখুন।'],['ব্যবহার','দুধ, চা, দই বা সরাসরি খাওয়া যায়; ঘরোয়া পানীয়তেও মানায়।']],t:['ঠান্ডা, শুকনো জায়গায় রাখুন।','রোদ ও গরম থেকে দূরে রাখুন।','জারের ঢাকনা সবসময় শক্ত করে বন্ধ রাখুন।'],f:[['বরই মধু জমে কি?','হ্যাঁ, ঠান্ডায় দানা বাঁধতে পারে; হালকা গরম পানিতে আবার তরল হয়।'],['রং এক এক ব্যাচে আলাদা কেন?','ফুল ও মৌসুম ভেদে প্রাকৃতিক মধুর রং পরিবর্তন হয়।']]},
'মিশ্র ফুলের মধু':{h:'মিশ্র ফুলের মধু: নানা ফুলের স্বাদ এক জারে',s:'বিভিন্ন ফুলের রস থেকে মৌমাছির তৈরি মধু। প্রতিটি ব্যাচে স্বাদ ও রং কিছুটা আলাদা হতে পারে।',i:'মিশ্র ফুলের মধু বা মাল্টিফ্লোরাল মধু তৈরি হয় যখন মৌমাছিরা একাধিক ফুল থেকে রস সংগ্রহ করে। তাই এর স্বাদ সময় ও অঞ্চলভেদে বদলায়।',x:[['স্বাদ','সাধারণত সুষম মিষ্টি ও মোলায়েম; কোনো একটি ফুলের ঘ্রাণ আলাদাভাবে প্রকট নাও হতে পারে।'],['কেন ব্যাচ ভেদে আলাদা?','কোন মৌসুমে কোন ফুল ফুটেছে তার ওপর মধুর রং, স্বাদ ও ঘনত্ব নির্ভর করে — এটি প্রাকৃতিক বৈচিত্র্য।'],['ব্যবহার','প্রতিদিনের ব্যবহারের জন্য সাশ্রয়ী ও বহুমুখী; খাবার, পানীয় ও বেকিংয়ে ব্যবহার করা যায়।']],t:['কাচের জারে ঢাকনা এঁটে রাখুন।','ফ্রিজের বাইরে ঠান্ডা স্থানে রাখুন।'],f:[['দাম কি তুলনামূলক কম?','সাধারণত একক ফুলের মধুর চেয়ে কম হয়।'],['কোন মধু আমার জন্য?','দৈনন্দিন ব্যবহারে মিশ্র ফুল, আর নির্দিষ্ট স্বাদ চাইলে একক ফুলের মধু বেছে নিন।']]},
'সুন্দরবনের বুনো চাকের মধু':{h:'সুন্দরবনের বুনো চাকের মধু: মৌয়ালদের সংগ্রহ করা বনের মধু',s:'সুন্দরবনের গাছ থেকে বুনো মৌমাছির খোলা চাক ভেঙে সংগ্রহ করা মধু। স্বাদে হালকা টক-মিষ্টি ও বনের গন্ধ পাওয়া যায়।',i:'সুন্দরবনের মৌয়ালরা প্রতি বছর নির্দিষ্ট সময়ে বনে গিয়ে বুনো মৌমাছির (Apis dorsata) বিশাল খোলা চাক থেকে মধু সংগ্রহ করেন। এটি অত্যন্ত ঝুঁকিপূর্ণ ও ঐতিহ্যবাহী কাজ।',x:[['কীভাবে সংগ্রহ হয়','মৌয়ালরা বনের ভেতর গাছের ডালে ঝোলানো চাক খুঁজে ধোঁয়া দিয়ে মৌমাছিদের সরিয়ে চাক কেটে নেন। তারপর চাক চিপে মধু আলাদা করা হয়।'],['স্বাদ ও গড়ন','সাধারণত একটু পাতলা, হালকা টক-মিষ্টি স্বাদ ও বনের বৈশিষ্ট্যপূর্ণ ঘ্রাণ থাকে। কখনো সামান্য ধোঁয়াটে আভাও থাকতে পারে।'],['কেন বিশেষ','এই মধুর উৎস বন, ফুল ও মৌসুমের ওপর নির্ভরশীল। তাই প্রতিটি ব্যাচ প্রাকৃতিকভাবে কিছুটা আলাদা হয়।']],t:['ঠান্ডা স্থানে, ঢাকনা এঁটে রাখুন।','পাতলা মধু দ্রুত গাঁজতে পারে তাই বেশি দিন খোলা রাখবেন না।','ফ্রিজে না রাখাই ভালো।'],f:[['এই মধু পাতলা কেন?','বুনো চাকের মধুতে আর্দ্রতা তুলনামূলক বেশি থাকতে পারে।'],['কতদিনের মধ্যে খাওয়া ভালো?','প্যাকেটে দেওয়া মেয়াদ দেখুন এবং খোলার পর দ্রুত ব্যবহার করুন।']]},
'সুন্দরবনের খলিশা ফুলের মধু':{h:'খলিশা ফুলের মধু: সুন্দরবনের সোনালি ও মোলায়েম মধু',s:'সুন্দরবনের খলিশা ম্যানগ্রোভ গাছের ফুল থেকে সংগৃহীত মধু। হালকা সোনালি রঙের, মিষ্টি ও মোলায়েম সুগন্ধের।',i:'খলিশা সুন্দরবনের পরিচিত ম্যানগ্রোভ গাছ, সাধারণত এপ্রিল–মে মাসে এতে ফুল ফোটে। এই ফুলের মধু সুন্দরবনের সবচেয়ে পরিচিত মধুগুলোর একটি।',x:[['স্বাদ ও রং','হালকা সোনালি রং, মোলায়েম মিষ্টি স্বাদ ও মনোরম সুগন্ধ। অতিরিক্ত ঝাঁঝ থাকে না।'],['কেন জনপ্রিয়','এর নরম স্বাদ বয়স্ক ও ছোট (এক বছরের উপরে) সবার কাছেই সহজে গ্রহণযোগ্য।'],['ব্যবহার','চা, দুধ, দই, ফলের সাথে কিংবা সরাসরি খাওয়া যায়।']],t:['ঢাকনা আঁটা জারে রাখুন।','সরাসরি রোদ লাগাবেন না।','জমে গেলে হালকা গরম পানিতে জার ভিজিয়ে তরল করুন।'],f:[['সুন্দরবনের অন্য মধুর সাথে পার্থক্য কী?','ফুল ও মৌসুম ভেদে স্বাদ ও রং আলাদা; খলিশা ফুলের মধু সাধারণত মোলায়েম ও হালকা রঙের।'],['সংগ্রহের সময় জানব কীভাবে?','পণ্য পেজের "বিস্তারিত" অংশে দেখুন।']]},
'আজওয়া খেজুর':{h:'আজওয়া খেজুর: মদিনার নরম ও কালচে খেজুরের পরিচয়',s:'মদিনার জনপ্রিয় নরম, কালচে ও কম আঠালো খেজুর। মিষ্টি কম, স্বাদ মোলায়েম ও সামান্য ক্যারামেল-সদৃশ।',i:'আজওয়া সৌদি আরবের মদিনা অঞ্চলের বিখ্যাত খেজুর। এটি ইসলামী ঐতিহ্যে বিশেষভাবে সম্মানিত হিসেবে পরিচিত এবং সারা বিশ্বে জনপ্রিয়।',x:[['স্বাদ ও গড়ন','গাঢ় বাদামি থেকে প্রায় কালো, নরম অথচ কম আঠালো। বিচি ছোট এবং স্বাদ মোলায়েম মিষ্টি।'],['কেন পছন্দ করেন অনেকে','ইফতার, সেহরি বা দৈনন্দিন নাস্তা হিসেবে খেজুর অনেকেরই প্রিয়। আজওয়া উপহার হিসেবেও জনপ্রিয়।'],['কীভাবে খাবেন','সরাসরি, দুধের সাথে, স্মুদিতে, বা মিষ্টান্নের পরিবর্তে ব্যবহার করতে পারেন।']],t:['ঠান্ডা, শুকনো স্থানে রাখুন।','বেশিদিন রাখতে বায়ুরোধী কৌটায় ফ্রিজে রাখুন।','ভেজা হাতে ধরবেন না।'],f:[['আজওয়া খেজুর কি খুব মিষ্টি?','অন্য কিছু জাতের তুলনায় মোলায়েম মিষ্টি।'],['ডায়াবেটিস থাকলে খেতে পারব?','চিকিৎসকের পরামর্শ অনুযায়ী পরিমাণ ঠিক করুন।']]},
'মেডজুল খেজুর':{h:'মেডজুল খেজুর: বড় আকারের রসালো খেজুর',s:'বড় আকারের, নরম ও রসালো খেজুর; মধুর মতো মিষ্টি ও ক্যারামেলের মতো স্বাদের জন্য পরিচিত।',i:'মেডজুল (Medjool) খেজুরকে অনেক সময় "খেজুরের রাজা" বলা হয়। এটি আকারে বড়, মাংসল এবং স্বাদে সমৃদ্ধ।',x:[['স্বাদ ও গড়ন','গাঢ় বাদামি, চামড়া সামান্য কুঁচকানো, ভেতরটা নরম ও মাংসল। মিষ্টি বেশি ও ক্যারামেলের মতো আভা থাকে।'],['ব্যবহার','সরাসরি খাওয়া ছাড়াও বাদাম বা পনির ভরে, স্মুদি, মিষ্টি বা কেকে ব্যবহার করা যায়।'],['কেন একটু দামি','আকার বড় ও ফলন তুলনামূলক কম হওয়ায় এটি সাধারণত অন্য জাতের চেয়ে দামি হয়।']],t:['ফ্রিজে রাখলে নরম থাকে বেশিদিন।','শুকনো, পরিষ্কার হাতে নিন।','দিনে ১–২টি দিয়ে শুরু করুন।'],f:[['চামড়া কুঁচকানো কেন?','স্বাভাবিক; এতে খেজুর খারাপ হয়নি।'],['কীভাবে সবচেয়ে ভালো লাগে?','হালকা ঠান্ডা অবস্থায় বাদাম ভরে খেলে অনেকেই পছন্দ করেন।']]},
'সুক্কারী খেজুর':{h:'সুক্কারী খেজুর: সোনালি মিষ্টি ও মুখে গলে যাওয়া স্বাদ',s:'সোনালি-বাদামি, মিষ্টি ও নরম খেজুর যা মুখে গলে যায়। আরবিতে "সুক্কারী" অর্থ চিনির মতো মিষ্টি।',i:'সুক্কারী সৌদি আরবের কাসিম অঞ্চলের জনপ্রিয় খেজুর। এর মিষ্টি স্বাদ ও নরম গড়ন অনেকের পছন্দ।',x:[['স্বাদ ও গড়ন','সোনালি থেকে হালকা বাদামি রং, মিষ্টি ও মোলায়েম। কিছু সুক্কারী খেজুর কিছুটা ভঙ্গুর বা দানাদার হয়ে থাকে।'],['কীভাবে খাবেন','সরাসরি, চায়ের সাথে বা মিষ্টির বিকল্প হিসেবে।'],['সংরক্ষণ','শুকনো স্থানে রেখে ফ্রিজে বায়ুরোধী পাত্রে রাখলে বেশিদিন ভালো থাকে।']],t:['আর্দ্রতা থেকে দূরে রাখুন।','দীর্ঘ সময়ের জন্য ফ্রিজে রাখুন।'],f:[['এটি কি খুব মিষ্টি?','হ্যাঁ, অনেকের কাছে অন্য জাতের চেয়ে বেশি মিষ্টি মনে হয়।'],['পিঁপড়া ধরতে পারে?','খোলা অবস্থায় রাখলে ধরতে পারে; ঢাকনা এঁটে রাখুন।']]},
'গাওয়া ঘি':{h:'গাওয়া ঘি: খাঁটি ঘির ঘ্রাণ, দানা ও ব্যবহার',s:'গরুর দুধের সর বা মাখন জ্বাল দিয়ে তৈরি ঐতিহ্যবাহী ঘি। স্বাভাবিক সুগন্ধ ও দানাদার গড়ন এর বৈশিষ্ট্য।',i:'গাওয়া ঘি বাংলাদেশের ঐতিহ্যবাহী খাবারের অবিচ্ছেদ্য অংশ। খিচুড়ি, পোলাও, হালুয়া বা ভাতের সাথে এর ঘ্রাণ আলাদা স্বাদ যোগ করে।',x:[['দানা বাঁধে কেন?','ঘিতে নানা ধরনের চর্বি-অণু থাকে। ঠান্ডায় এগুলো আলাদা হয়ে জমে দানা তৈরি করে — এটি স্বাভাবিক, খাঁটি ঘিতেই সাধারণত এটি হয়।'],['রান্নায় ব্যবহার','ভাজা, ভুনা, পোলাও, খিচুড়ি, হালুয়া ও পরোটায় ব্যবহার হয়। গরম ভাতের সাথে সামান্য ঘি অনেকেরই প্রিয়।'],['পরিমাণ','ক্যালরি বেশি, তাই পরিমিত খাওয়াই ভালো; স্বাস্থ্যগত সীমাবদ্ধতা থাকলে চিকিৎসকের পরামর্শ নিন।']],t:['সবসময় শুকনো চামচ ব্যবহার করুন।','ঢাকনা এঁটে ঠান্ডা, অন্ধকার জায়গায় রাখুন।','টকটক গন্ধ বা অস্বাভাবিক রং হলে খাবেন না।'],f:[['ফ্রিজে রাখা কি জরুরি?','না; ঠান্ডা, শুকনো স্থানে ঢাকনা এঁটে রাখলেই চলে।'],['ঘি জমে গেলে কী করব?','হালকা গরম পানিতে জার ভিজিয়ে তরল করে নিন।']]},
'ঘানি ভাঙা সরিষার তেল':{h:'ঘানি ভাঙা সরিষার তেল: ঝাঁঝ, ঘ্রাণ ও ব্যবহার',s:'ঘানিতে ধীরে সরিষা পিষে বের করা তেল। রিফাইন করা হয় না, তাই ঝাঁঝ ও ঘ্রাণ স্বাভাবিকভাবে বেশি।',i:'ঘানি ভাঙা তেল ঐতিহ্যবাহী পদ্ধতিতে কাঠের বা ধাতব ঘানিতে সরিষা পিষে তৈরি হয়। বাঙালির ভর্তা, মাছ-ভাজা ও আচারে এর ঝাঁঝালো স্বাদ অপরিহার্য।',x:[['ঝাঁঝ বেশি কেন?','ঘানিতে ধীরে চাপ দিয়ে তেল বের করা হয় এবং রিফাইন করা হয় না — তাই সরিষার প্রাকৃতিক ঝাঁঝ ও ঘ্রাণ অটুট থাকে।'],['রান্নায় ব্যবহার','রান্নার আগে তেল একটু গরম করে ধোঁয়া উঠলে নামিয়ে ঠান্ডা করে নিলে ঝাঁঝ কমে ও রান্নায় ভালো স্বাদ আসে।'],['কোথায় সবচেয়ে মানায়','ভর্তা, ঝোল, মাছ ভাজা, আচার ও সবজি রান্নায়।']],t:['আলো ও গরম থেকে দূরে রাখুন।','ঢাকনা শক্ত করে আটকান।','শুকনো পাত্র ব্যবহার করুন।'],f:[['তেল গাঢ় রঙের কেন?','অপরিশোধিত তেলের প্রাকৃতিক রং এমনই হয়।'],['ঝাঁঝ কমানোর উপায়?','তেল প্রথমে গরম করে ঠান্ডা করে নিন।']]},
'খাঁটি নারকেল তেল':{h:'খাঁটি নারকেল তেল: জমে যাওয়া, ব্যবহার ও সংরক্ষণ',s:'নারকেল থেকে প্রাকৃতিকভাবে সংগৃহীত তেল। প্রায় ২৪–২৫°C-এর নিচে জমে সাদা হয় এবং গরমে আবার তরল হয়।',i:'নারকেল তেল রান্না, চুল ও ত্বকের যত্নে বহুল ব্যবহৃত। এর হালকা নারকেলের ঘ্রাণ এবং স্থিতিশীল গঠন এটিকে জনপ্রিয় করেছে।',x:[['শীতে জমে কেন?','নারকেল তেলে স্যাচুরেটেড ফ্যাট বেশি, তাই তাপমাত্রা প্রায় ২৪–২৫°C-এর নিচে নামলে তা স্বাভাবিকভাবেই জমে যায়। জমা মানে ভেজাল নয়।'],['রান্নায়','ভাজা, ভুনা ও দক্ষিণ এশীয় নানা পদে ব্যবহার করা যায়। মৃদু নারকেলের ঘ্রাণ রান্নায় আলাদা স্বাদ আনে।'],['চুল ও ত্বকে','অনেকে চুলে তেল হিসেবে বা ত্বক নরম রাখতে ব্যবহার করেন। নতুন কিছু ব্যবহারের আগে সামান্য অংশে পরীক্ষা করে নিন।']],t:['জমে গেলে হালকা গরম পানিতে বোতল ভিজিয়ে রাখুন।','ঢাকনা আঁটা পাত্রে ঠান্ডা স্থানে রাখুন।'],f:[['তেল জমে সাদা হয়ে গেছে, ঠিক আছে?','হ্যাঁ, এটি স্বাভাবিক।'],['কতদিন ভালো থাকে?','প্যাকেটের মেয়াদ দেখুন; সঠিকভাবে রাখলে অনেক মাস ভালো থাকে।']]},
'আপেল সিডার ভিনেগার':{h:'আপেল সিডার ভিনেগার: কীভাবে খাবেন ও কী সতর্কতা',s:'আপেলের রস গাঁজিয়ে তৈরি ভিনেগার। সালাদ ড্রেসিং, রান্না ও পানিতে মিশিয়ে ব্যবহারযোগ্য।',i:'আপেল সিডার ভিনেগার (ACV) আপেলের রস প্রথমে অ্যালকোহল এবং পরে অ্যাসিটিক অ্যাসিডে গাঁজিয়ে তৈরি হয়। অনেকেই এটি সালাদ ও পানীয়তে ব্যবহার করেন।',x:[['ঘোলা "মা" কী?','প্রাকৃতিক, ফিল্টার না করা ভিনেগারের তলায় ঘোলা সুতার মতো যে অংশ জমে তাকে "মা" (mother) বলা হয়। এটি স্বাভাবিক, ক্ষতিকর নয়।'],['কীভাবে খাবেন','সরাসরি নয় — এক গ্লাস পানিতে ১–২ চা-চামচ মিশিয়ে নিন। সালাদে অলিভ অয়েল ও লেবুর সাথে ড্রেসিং বানাতেও পারেন।'],['সতর্কতা','অম্লীয়, তাই সরাসরি খেলে দাঁতের এনামেল ও গলা ক্ষতিগ্রস্ত হতে পারে। গ্যাস্ট্রিক বা অন্য সমস্যা থাকলে চিকিৎসকের পরামর্শ নিন।']],t:['খাওয়ার পর পানি দিয়ে কুলি করুন।','ঢাকনা শক্ত করে বন্ধ রাখুন।','শিশুদের নাগালের বাইরে রাখুন।'],f:[['এটা কি ওজন কমায়?','কোনো ম্যাজিক সমাধান নয়; সুষম খাবার ও ব্যায়ামের সাথে সহায়ক হতে পারে বলে কেউ কেউ মনে করেন। নিশ্চিত হতে চিকিৎসকের পরামর্শ নিন।'],['ফ্রিজে রাখতে হবে?','না, ঠান্ডা, শুকনো স্থানেই চলবে।']]},
'কাজু বাদাম':{h:'কাজু বাদাম: স্বাদ, পুষ্টি ও কীভাবে খাবেন',s:'নরম, ক্রিমি ও হালকা মিষ্টি স্বাদের কাজু বাদাম। সরাসরি, রান্নায় বা মিষ্টান্নে ব্যবহার করা যায়।',i:'কাজু বাদাম গাছের ফলের নিচে ঝুলে থাকা বীজ। এর ক্রিমি গড়ন ও মোলায়েম স্বাদ রান্না ও নাস্তা দুই ক্ষেত্রেই জনপ্রিয়।',x:[['স্বাদ ও গড়ন','হালকা মিষ্টি ও দুধের মতো ক্রিমি স্বাদ। ভাজলে বা হালকা সেঁকলে ঘ্রাণ আরও ফোটে।'],['কীভাবে খাবেন','সরাসরি নাস্তা হিসেবে, পোলাও-বিরিয়ানিতে, কোরমা বা মিষ্টান্নে, কিংবা বেটে গ্রেভির ঘনত্ব বাড়াতে।'],['পরিমাণ','দিনে এক মুঠো (প্রায় ২৫–৩০ গ্রাম) যথেষ্ট। ক্যালরি বেশি, তাই পরিমিত খান।']],t:['বায়ুরোধী কৌটায় ঠান্ডা জায়গায় রাখুন।','বাদামে অ্যালার্জি থাকলে এড়িয়ে চলুন।'],f:[['কাজু কি কাঁচা খাওয়া যায়?','প্যাকেটে লেখা অনুযায়ী খান; প্রক্রিয়াজাত কাজু সাধারণত খাওয়ার জন্য প্রস্তুত থাকে।'],['কতদিন ভালো থাকে?','প্যাকেটের মেয়াদ দেখুন; ভালোভাবে রাখলে কয়েক মাস।']]},
'কাঠবাদাম (আমন্ড)':{h:'কাঠবাদাম (আমন্ড): কীভাবে খাবেন ও কত খাবেন',s:'মচমচে ও হালকা মিষ্টি স্বাদের কাঠবাদাম। ভিজিয়ে, সেঁকে বা সরাসরি খাওয়া যায়।',i:'কাঠবাদাম বা আমন্ড স্বাস্থ্যসচেতন অনেকের নিয়মিত নাস্তা। এটি ভিজিয়ে খাওয়া, দুধে মেশানো, কিংবা মিষ্টান্নে ব্যবহার করা যায়।',x:[['স্বাদ','মচমচে গড়ন ও মৃদু মিষ্টি স্বাদ। ভিজিয়ে খোসা ছাড়ালে নরম হয়।'],['কীভাবে খাবেন','রাতে ভিজিয়ে সকালে খাওয়া অনেকের অভ্যাস। সালাদ, ওটস, দই বা স্মুদিতেও মেশানো যায়।'],['পরিমাণ','দিনে ৫–১০টি অনেকের জন্য যথেষ্ট; কত খাওয়া ঠিক তা নিজের শরীর ও চিকিৎসকের পরামর্শে ঠিক করুন।']],t:['বায়ুরোধী কৌটায় রাখুন।','আর্দ্রতা ও গরম থেকে দূরে রাখুন।'],f:[['ভিজিয়ে খাওয়া কি ভালো?','ভিজিয়ে খেলে নরম হয় ও চিবানো সহজ হয়; এটি ব্যক্তিগত পছন্দ।'],['সবাই কি খেতে পারে?','বাদামে অ্যালার্জি থাকলে একেবারেই নয়।']]},
'মিক্সড বাদাম':{h:'মিক্সড বাদাম: এক প্যাকে নানা স্বাদ',s:'কাজু, আমন্ড ও অন্যান্য বাদামের মিশ্রণ। নাস্তা ও উপহারের জন্য সুবিধাজনক।',i:'মিক্সড বাদাম একসাথে নানা স্বাদ ও গড়ন পাওয়ার সহজ উপায়। অফিস, স্কুল বা ভ্রমণে এটি নেওয়ার জন্য ভালো।',x:[['কী কী থাকে','সাধারণত কাজু, আমন্ড, কিশমিশ ও অন্য বাদামের মিশ্রণ। উপাদানের অনুপাত প্যাক ভেদে সামান্য আলাদা হতে পারে।'],['কখন খাবেন','সকালের নাস্তা, বিকেলের স্ন্যাকস বা ভ্রমণে নিতে পারেন।'],['পরিমাণ','এক মুঠো যথেষ্ট; ক্যালরি বেশি থাকায় পরিমিত খান।']],t:['বায়ুরোধী কৌটায় রাখুন।','আর্দ্রতা থেকে দূরে রাখুন।'],f:[['অ্যালার্জি থাকলে কী করব?','প্যাকের উপাদান তালিকা দেখে নিন; অ্যালার্জি থাকলে এড়ান।'],['উপহার হিসেবে দেওয়া যাবে?','হ্যাঁ, বড় প্যাক উপহারের জন্য জনপ্রিয়।']]},
'হানি নাটস (মধু-বাদাম)':{h:'হানি নাটস: মধুতে ডোবানো বাদামের মজা',s:'বাদাম ও মধুর একসাথে মিশ্রণ; মচমচে ও মিষ্টি স্বাদের একসাথে পাওয়া যায়।',i:'হানি নাটস মধুর ভেতরে বাদাম ডুবিয়ে রাখা হয়। এতে বাদামের মচমচে ভাব ও মধুর মিষ্টি দুই স্বাদ পাওয়া যায়।',x:[['কীভাবে খাবেন','সরাসরি চামচে, রুটি বা টোস্টে মাখিয়ে, দইয়ের সাথে বা ওটসের ওপর ছিটিয়ে।'],['স্বাদ','মধুর মিষ্টি ও বাদামের মচমচে স্বাদের মিলন; সময়ের সাথে বাদাম একটু নরম হতে পারে।'],['সতর্কতা','মধু থাকায় ১ বছরের কম বয়সী শিশুকে দেবেন না। বাদামে অ্যালার্জি থাকলে এড়ান।']],t:['ঢাকনা আঁটা জারে রাখুন।','শুকনো চামচ ব্যবহার করুন।'],f:[['মধু জমে গেলে?','হালকা গরম পানিতে জার ভিজিয়ে নিন।'],['কতদিন ভালো থাকে?','প্যাকেটের মেয়াদ দেখুন।']]},
'হলুদের গুঁড়া':{h:'হলুদের গুঁড়া: রং, ঘ্রাণ ও রান্নায় সঠিক ব্যবহার',s:'রান্নায় রং ও ঘ্রাণ আনতে হলুদের গুঁড়া অপরিহার্য। গাঢ় হলুদ রং ও নিজস্ব সুগন্ধ ভালো হলুদের লক্ষণ।',i:'হলুদ বাঙালির প্রতিদিনের রান্নার মূল উপাদান। ভালো হলুদের রং গাঢ় ও ঘ্রাণ সতেজ হয়।',x:[['ভালো হলুদ চিনবেন কীভাবে','রং গাঢ় সোনালি-হলুদ, ঘ্রাণ তাজা, গুঁড়া মসৃণ — অতিরিক্ত কৃত্রিম উজ্জ্বল রং থাকলে সন্দেহ করুন।'],['রান্নায় কখন দেবেন','মাছ-মাংস মাখানোর সময় ও রান্নার শুরুতে তেলে অল্প ভেজে নিলে ঘ্রাণ ফোটে। বেশি পুড়ে গেলে তেতো হয়।'],['কীভাবে রাখবেন','বায়ুরোধী কৌটায় আলো-আর্দ্রতা থেকে দূরে রাখলে রং ও ঘ্রাণ বেশিদিন থাকে।']],t:['শুকনো চামচ ব্যবহার করুন।','চুলার কাছে রাখবেন না।'],f:[['রং কালচে কেন?','পুরনো হলে বা আর্দ্রতা পেলে রং কমে যায়।'],['কতদিন ব্যবহার করা যায়?','প্যাকেটের মেয়াদ ও সংরক্ষণের ওপর নির্ভর করে।']]},
'মরিচের গুঁড়া':{h:'মরিচের গুঁড়া: ঝাল, রং ও সঠিক সংরক্ষণ',s:'রান্নায় ঝাল ও লাল রং আনার প্রধান মসলা। শুকনো মরিচ পিষে তৈরি।',i:'মরিচের গুঁড়ার ঝাল আসে ক্যাপসাইসিন নামক উপাদান থেকে। জাতের ওপর নির্ভর করে ঝাল ও রঙের তারতম্য হয়।',x:[['ঝাল ও রং','কিছু মরিচের রং গাঢ় কিন্তু ঝাল কম, কিছুতে ঝাল বেশি। তাই পছন্দমতো ব্যবহার করুন।'],['রান্নায়','মাংস, ডাল, ভর্তা ও আচারে ব্যবহার করা হয়। বেশি তেলে পুড়িয়ে ফেললে তেতো হয়।'],['সংরক্ষণ','আর্দ্রতা মরিচের গুঁড়ায় ছত্রাক ধরাতে পারে; তাই বায়ুরোধী, শুকনো কৌটা ব্যবহার করুন।']],t:['শুকনো চামচ ব্যবহার করুন।','অল্প অল্প করে কিনুন।'],f:[['ঝাল কম করতে কী করব?','পরিমাণ কমান বা অল্প টক দই যোগ করুন।'],['চোখে লাগলে?','পরিষ্কার পানি দিয়ে ধুয়ে নিন।']]},
'ধনিয়ার গুঁড়া':{h:'ধনিয়ার গুঁড়া: সুগন্ধ ও রান্নায় সঠিক ব্যবহার',s:'ধনিয়া বীজ পিষে তৈরি মোলায়েম সুগন্ধি মসলা। ঝোল ও ভুনায় মিষ্টি-লেবুর মতো সুবাস দেয়।',i:'ধনিয়ার গুঁড়া অন্য মসলার ঝাঁঝ সামলে রান্নায় ভারসাম্য আনে।',x:[['স্বাদ ও ঘ্রাণ','মৃদু সাইট্রাস-মিষ্টি সুবাস। ঝালের সাথে মিশলে রান্না মোলায়েম হয়।'],['কোথায় ব্যবহার করবেন','মাছ-মাংসের ঝোল, ডাল, সবজি, কোরমা ও ভর্তায়।'],['কীভাবে রাখবেন','বায়ুরোধী কৌটায় আলো থেকে দূরে রাখুন।']],t:['তেলে অল্প নেড়ে দিলে ঘ্রাণ বাড়ে।','ভেজা চামচ ব্যবহার করবেন না।'],f:[['ঘ্রাণ কমে গেছে কেন?','পুরনো হলে বা খোলা রাখলে ঘ্রাণ কমে যায়।'],['ভেজে নেওয়া দরকার?','না; তবে অল্প ভেজে নিলে স্বাদ বাড়ে।']]},
'জিরার গুঁড়া':{h:'জিরার গুঁড়া: উষ্ণ সুবাস ও ব্যবহার',s:'ভাজা বা কাঁচা জিরা পিষে তৈরি উষ্ণ সুবাসের মসলা। ডাল, ভর্তা ও মাংস রান্নায় জনপ্রিয়।',i:'জিরা বাংলাদেশসহ দক্ষিণ এশিয়ার রান্নার প্রাণ। জিরার গুঁড়ার সুবাস রান্নাকে আলাদা মাত্রা দেয়।',x:[['স্বাদ ও ঘ্রাণ','মাটির মতো উষ্ণ ঘ্রাণ ও সামান্য তিতকুটে স্বাদ।'],['কীভাবে ব্যবহার করবেন','ডালে ফোড়ন, দই-ভর্তা, মাংস, সালাদ ও নানা মসলার মিশ্রণে।'],['সংরক্ষণ','বায়ুরোধী কৌটায় আর্দ্রতা থেকে দূরে রাখুন।']],t:['রান্নার একদম শেষে ছিটালে ঘ্রাণ বেশি পাওয়া যায়।','শুকনো চামচ ব্যবহার করুন।'],f:[['ভাজা জিরা আর কাঁচা জিরার পার্থক্য?','ভাজা জিরার ঘ্রাণ আরও গাঢ় হয়।'],['কতটুকু দেব?','অল্প দিয়ে শুরু করুন; বেশি হলে তেতো লাগতে পারে।']]},
'চা':{h:'চা: সঠিকভাবে বানানোর কৌশল ও সংরক্ষণ',s:'সতেজ ঘ্রাণ ও গাঢ় লিকারের চা। সঠিক পানির তাপমাত্রা ও সময় মানলে স্বাদ বেশি ভালো হয়।',i:'চা বাংলাদেশের জনপ্রিয় পানীয়। সঠিক নিয়মে বানালে সুগন্ধ ও স্বাদ পুরো পাওয়া যায়।',x:[['সঠিকভাবে বানানোর নিয়ম','এক কাপ পানিতে এক চা-চামচ পাতা দিন; পানি ফুটিয়ে একটু ঠান্ডা করে (প্রায় ৮০–৯০°C) ঢালুন এবং ২–৩ মিনিট ভিজিয়ে ছেঁকে নিন।'],['দুধ-চিনি','চাইলে দুধ ও চিনি মেশান; তবে দুধ-চিনি ছাড়া খেলে আসল ঘ্রাণ বোঝা যায়।'],['সংরক্ষণ','বায়ুরোধী কৌটায় আলো ও আর্দ্রতা থেকে দূরে রাখুন।']],t:['বেশিক্ষণ ভেজাবেন না, তেতো হবে।','ভেজা চামচ ঢোকাবেন না।'],f:[['লিকার হালকা কেন?','পাতা কম বা সময় কম হলে লিকার হালকা হয়।'],['দিনে কয়বার চা খাওয়া ভালো?','পরিমিত; ক্যাফেইনের প্রতি সংবেদনশীল হলে কম খান।']]},

'ওটস':{h:'ওটস: সহজ ও দ্রুত নাস্তার সেরা বিকল্প',s:'রান্না করা সহজ, পেট ভরা অনুভূতি দেয়। দুধ বা পানিতে ৫–৭ মিনিট জ্বাল দিলেই তৈরি।',i:'ওটস সকালের নাস্তায় জনপ্রিয় একটি শস্য। এটি দুধ বা পানিতে সিদ্ধ করে ফল, বাদাম বা মধু মিশিয়ে খাওয়া যায়।',x:[['কীভাবে রান্না করবেন','এক কাপ ওটসে দুই কাপ দুধ বা পানি দিয়ে ৫–৭ মিনিট জ্বাল দিন; চাইলে সামান্য লবণ বা মিষ্টি দিন।'],['ওভারনাইট ওটস','রাতে দুধ বা দইয়ে ভিজিয়ে ফ্রিজে রাখুন, সকালে ফল দিয়ে ঠান্ডা অবস্থায় খান।'],['স্বাদ বাড়াবেন কীভাবে','ফল, বাদাম, মধু, দারুচিনি, বা অল্প গুড় মেশাতে পারেন।']],t:['সাধারণ ওটস নিন; অতিরিক্ত মিষ্টি মেশানো ওটস এড়ান।','শুকনো, বায়ুরোধী কৌটায় রাখুন।'],f:[['ওটস কি ডায়াবেটিস রোগী খেতে পারেন?','পরিমাণ ও ধরন চিকিৎসকের পরামর্শে ঠিক করুন।'],['ইনস্ট্যান্ট ও রোলড ওটসের পার্থক্য?','ইনস্ট্যান্ট দ্রুত নরম হয়; রোলড ওটস একটু বেশি সময় নেয়।']]}

/* ---------- ব্লগ ---------- */
const BL={c:'',s:'',cache:null};
const slugMap={};
function blogSlug(cat,g){const k=cat+'|'+g;return slugMap[k]||(slugMap[k]=cat+'-'+sha256('pbblog|'+g).slice(0,6))}
function blogPostBase(g,cat){
 const P=BLOGP[g],C=CATB[cat]||CATB.other;
 if(P)return Object.assign({g,cat},P);
 return {g,cat,h:g+': পরিচিতি, ব্যবহার ও কেনার আগে জানুন',s:g+' — '+C.d.split('।')[0]+'।',i:C.d,x:[['কেন বেছে নেবেন','পণ্যের উৎস, মান ও সংরক্ষণ সম্পর্কে স্বচ্ছ তথ্য জানিয়ে আমরা আপনাকে নির্ভরযোগ্য পণ্য দিতে চেষ্টা করি। পণ্য পেজের "বিস্তারিত" অংশে সংগ্রহের তথ্য ও প্যাকিং-মেয়াদ দেখতে পারবেন।'],['কেনার আগে যা দেখবেন','প্যাকেটে তারিখ ও মেয়াদ, সিল ও লেবেল ঠিক আছে কিনা দেখুন এবং কোনো প্রশ্ন থাকলে সরাসরি আমাদের জিজ্ঞাসা করুন।']],t:C.tips,f:[['কীভাবে অর্ডার করব?','পণ্য পেজ থেকে কার্টে যোগ করে চেকআউট করুন, অথবা WhatsApp/Messenger-এ সরাসরি জানান।']]};
}
function blogPostOf(g,cat){const p=blogPostBase(g,cat),X=PX[g]||{};p.q=X.q||[];p.x=p.x.concat(X.x||[],CATM[cat]||CATM.other);return p}
const defDesc=(g,cat)=>(BLOGP[g]?BLOGP[g].s:g+' — '+(CATB[cat]||CATB.other).d.split('।')[0]+'।');
function blogAll(){return shopData().map(x=>Object.assign(blogPostOf(x.g,x.cat),{slug:blogSlug(x.cat,x.g),it:x.items.find(i=>i.avail)||x.items[0],minp:Math.min(...x.items.map(i=>i.price)),n:x.items.length}))}
function readMin(p){const t=[p.i].concat(p.x.map(a=>a[1]),p.t||[],(p.f||[]).map(a=>a[0]+a[1])).join(' ');return Math.max(1,Math.ceil(t.split(/\s+/).length/110))}
function blogCatsHTML(){
 const all=blogAll();
 return CATS.filter(c=>all.some(p=>p.cat===c[0])).map(c=>`<button class="bcat" data-act="blogCat" data-c="${c[0]}"><span class="bci">${c[2]}</span><b>${esc(c[1])}</b><small>${bn(all.filter(p=>p.cat===c[0]).length,0)}টি লেখা</small></button>`).join('');
}
function bpostCard(p){return `<button class="bpost" data-act="blogPost" data-s="${p.slug}"><span class="thumb" style="width:64px;height:64px"><img src="${groupImg(p.it)}" alt=""></span><span class="grow"><b>${esc(p.g)}</b><small>${esc(p.s)}</small><i>⏱ ${bn(readMin(p),0)} মিনিটের পড়া</i></span><em>›</em></button>`}
function blogHTML(){
 const all=blogAll(),post=BL.s?all.find(p=>p.slug===BL.s):null;
 const top=(back,lbl)=>`<div class="cphead"><b>📝 Blog</b><button data-act="${back}">${lbl}</button></div>`;
 if(post){
  const sib=all.filter(p=>p.cat===post.cat&&p.slug!==post.slug),i=all.indexOf(post),nx=all[(i+1)%all.length],pv=all[(i-1+all.length)%all.length];
  const k=esc(post.cat+'|'+post.g),cn=catName(post.cat);
  return `<div class="cpage blogp">${top('blogBack','← '+esc(cn)+' লেখাগুলো')}
  <nav class="bcrumb"><a data-act="sBlog">ব্লগ</a> › <a data-act="blogCat" data-c="${post.cat}">${esc(cn)}</a> › <span>${esc(post.g)}</span></nav>
  <article class="card bart"><h1>${esc(post.h)}</h1><div class="bmeta">${esc(cn)} · ⏱ ${bn(readMin(post),0)} মিনিট · হালনাগাদ: নভেম্বর ২০২৬</div>
  <div class="bhero"><img src="${groupImg(post.it)}" alt="${esc(post.g)}"></div>
  <p class="bsum">${esc(post.s)}</p><p>${esc(post.i)}</p>
  ${(post.q||[]).length?`<div class="bfacts"><b>⚡ এক নজরে</b>${post.q.map(a=>`<div><span>${esc(a[0])}</span><i>${esc(a[1])}</i></div>`).join('')}</div>`:''}
  <div class="boutline"><b>📚 এই লেখায় যা পাবেন</b><ol>${post.x.map(a=>`<li>${esc(a[0])}</li>`).join('')}<li>কাজের টিপস ও সাধারণ প্রশ্ন</li></ol></div>
  ${post.x.map((a,i)=>`<h2>${bn(i+1,0)}. ${esc(a[0])}</h2><p>${esc(a[1])}</p>`).join('')}
  <h2>কাজের টিপস</h2><ul class="tips">${(post.t||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
  ${(post.f||[]).length?`<h2>সাধারণ প্রশ্ন</h2>${post.f.map(f=>`<details class="bfaq"><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join('')}`:''}
  <div class="bwhy"><b>🤝 কেন ${esc(CM?CM.n:db.shop.name)} থেকে কিনবেন?</b><ul>${WHYPB.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>
  <div class="bcta"><div><b>${esc(post.g)}</b><div class="sm muted">${post.n>1?'শুরু ':''}${tk(post.minp)}${post.n>1?' থেকে':''}</div></div><button class="btn" data-act="prodOpen" data-k="${k}">🛒 পণ্য দেখুন</button></div>
  <div class="toolbar" style="margin:10px 0 0"><a class="btn sm wa" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(post.h+'\n'+blogURL(post.slug))}" target="_blank" rel="noopener noreferrer">💬 শেয়ার করুন</a><button class="btn sm ghost" data-act="copyTxt" data-v="${esc(blogURL(post.slug))}">🔗 লিংক কপি</button></div></article>
  ${sib.length?`<div class="sect">${esc(cn)} নিয়ে আরও পড়ুন</div><div class="blist">${sib.slice(0,5).map(bpostCard).join('')}</div>`:''}
  <div class="bnav"><button class="btn ghost sm" data-act="blogPost" data-s="${pv.slug}">‹ ${esc(pv.g)}</button><button class="btn ghost sm" data-act="blogPost" data-s="${nx.slug}">${esc(nx.g)} ›</button></div></div>`;
 }
 if(BL.c&&CATB[BL.c]){
  const L=all.filter(p=>p.cat===BL.c),C=CATB[BL.c];
  return `<div class="cpage blogp">${top('sBlog','← ব্লগ')}<div class="card"><h1 class="bh1">${catEmoji(BL.c)} ${esc(C.h)}</h1><p>${esc(C.d)}</p></div><div class="sect">কোনটি পড়তে চান?</div><div class="blist">${L.map(bpostCard).join('')||'<div class="empty">এই ক্যাটাগরিতে এখনো লেখা নেই</div>'}</div></div>`;
 }
 return `<div class="cpage blogp">${top('sHome','বন্ধ করুন ✕')}<div class="card bintro"><h1 class="bh1">📝 জানুন, তারপর বেছে নিন</h1><p>মধু, খেজুর, ঘি, তেল, বাদাম ও মসলা — প্রতিটি পণ্যের উৎস, স্বাদ, ব্যবহার ও সংরক্ষণের সহজ গাইড। পছন্দের ক্যাটাগরি বেছে নিন।</p></div>

function blogMeta(n,v){let m=document.querySelector('meta[name="'+n+'"]');if(!m){m=document.createElement('meta');m.setAttribute('name',n);document.head.appendChild(m)}m.setAttribute('content',v)}
const BASE_TITLE=document.title;
function blogSEO(on){
 const old=document.getElementById('ldblog');if(old)old.remove();
 if(!on||!CM){if(CM)document.title=CM.n+' — ক্যাটালগ';return}
 const all=blogAll(),post=BL.s?all.find(p=>p.slug===BL.s):null,C=BL.c&&CATB[BL.c];
 const title=post?post.h:C?C.h:'ব্লগ: মধু, খেজুর, ঘি ও মসলা নিয়ে সহজ গাইড',desc=post?post.s:C?C.d:'প্রতিটি পণ্যের উৎস, স্বাদ, ব্যবহার ও সংরক্ষণ নিয়ে সহজ ভাষায় লেখা।';
 document.title=title+' | '+CM.n;blogMeta('description',desc.slice(0,160));
 const ld={'@context':'https://schema.org','@graph':[]};
 if(post){ld['@graph'].push({'@type':'Article',headline:post.h,description:post.s,inLanguage:'bn',author:{'@type':'Organization',name:CM.n},publisher:{'@type':'Organization',name:CM.n}});
  ld['@graph'].push({'@type':'BreadcrumbList',itemListElement:[{'@type':'ListItem',position:1,name:'ব্লগ'},{'@type':'ListItem',position:2,name:catName(post.cat)},{'@type':'ListItem',position:3,name:post.g}]});
  blogMeta('keywords',[post.g,catName(post.cat),'খাঁটি '+catName(post.cat),'অনলাইনে '+post.g+' কিনুন',CM.n,'আড়াইহাজার','নারায়ণগঞ্জ'].join(', '));
  if((post.f||[]).length)ld['@graph'].push({'@type':'FAQPage',mainEntity:post.f.map(f=>({'@type':'Question',name:f[0],acceptedAnswer:{'@type':'Answer',text:f[1]}}))})}
 else ld['@graph'].push({'@type':'Blog',name:title,description:desc,inLanguage:'bn',publisher:{'@type':'Organization',name:CM.n}});
 const s=document.createElement('script');s.type='application/ld+json';s.id='ldblog';s.textContent=JSON.stringify(ld).replace(/</g,'\\u003c');document.head.appendChild(s);
}
function blogGo(c,s,quiet){
 BL.c=c||'';BL.s=s||'';setView('blog');blogSEO(true);
 if(!quiet){try{history.pushState({b:1},'',blogHash())}catch(e){}}
}
function blogRoute(h,quiet){
 const m=String(h||'').match(/^#blog(?:\/([\w-]+))?$/);if(!m)return false;
 const k=m[1]||'';
 if(!k)blogGo('','',quiet);else if(CATB[k])blogGo(k,'',quiet);else{const p=blogAll().find(x=>x.slug===k);if(!p)return false;blogGo(p.cat,p.slug,quiet)}
 return true;
}

/* ---------- WhatsApp সরাসরি খোলা ---------- */
const MOBILE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent||''),INAPP=/; wv\)|FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent||'');
const _wo=window.open.bind(window);
const waBiz=()=>{try{return localStorage.getItem('pb_wab')==='1'}catch(e){return false}};
function openWA(url){
 let ph='',t='';try{const u=new URL(url);ph=u.pathname.replace(/\D/g,'');t=u.searchParams.get('text')||''}catch(e){}
 const q=(ph?'phone='+ph+'&':'')+'text='+encodeURIComponent(t);
 let go='';
 if(/Android/i.test(navigator.userAgent||'')&&waBiz())go='intent://send?'+q+'#Intent;scheme=whatsapp;package=com.whatsapp.w4b;end';
 else if(!INAPP)go='whatsapp://send?'+q;
 if(!go){_wo(url,'_blank','noopener,noreferrer');return}
 let left=false;const onv=()=>{if(document.hidden)left=true};document.addEventListener('visibilitychange',onv);
 const a=document.createElement('a');a.href=go;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>{document.removeEventListener('visibilitychange',onv);if(!left&&!document.hidden)_wo(url,'_blank','noopener,noreferrer')},2200);
}
window.open=function(u,a,b){if(typeof u==='string'&&MOBILE&&/^https:\/\/wa\.me\//.test(u)){openWA(u);return null}return _wo(u,a,b)};
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a||!MOBILE)return;const h=a.getAttribute('href')||'';if(/^https:\/\/wa\.me\//.test(h)){e.preventDefault();openWA(h)}});

dates:[['ভালো খেজুর কেনার সহজ গাইড','তাজা খেজুরের চামড়া সামান্য চকচকে, ভেতরটা নরম ও মাংসল হয়। অতিরিক্ত আঠালো, ভেজা-ভেজা, টক বা গাঁজানো গন্ধ থাকলে সেই খেজুর এড়িয়ে চলুন। প্যাকেটে প্যাকিং তারিখ ও মেয়াদ আছে কিনা দেখুন। পিঁপড়া বা পোকার চিহ্ন, ফাটা ও কালচে দাগ থাকলে ভালোভাবে যাচাই করুন। একই জাতের দানাগুলো কাছাকাছি আকারের হলে সাধারণত মান ভালো বোঝা যায়।'],['খেজুর সংরক্ষণ ও পরিবেশন','কম আর্দ্রতার ঠান্ডা স্থানে বায়ুরোধী কৌটায় রাখুন। দীর্ঘ সময়ের জন্য ফ্রিজে রাখলে নরম ভাব ও স্বাদ বেশিদিন থাকে; খাওয়ার ১৫ মিনিট আগে বের করে নিলে আবার নরম হয়। শুকিয়ে শক্ত হয়ে গেলে কয়েক মিনিট কুসুম গরম পানিতে ভিজিয়ে রাখলে নরম হয়। পরিবেশনে বাদাম বা ক্রিম পনির ভরে সাজালে অতিথি-আপ্যায়নেও চমৎকার মানায়।'],['খেজুর দিয়ে সহজ কয়েকটি আইডিয়া','খেজুর-বাদাম এনার্জি বল (বিচি ফেলে বাটা খেজুরে কাজু-আমন্ড মিশিয়ে), দুধ ও খেজুরের স্মুদি, ওটসের ওপর কুচি খেজুর, সেহরি বা ইফতারে দুধ-খেজুর, কিংবা মিষ্টির বিকল্প হিসেবে কেক-পুডিংয়ে বাটা খেজুর ব্যবহার করতে পারেন। দিনে ২–৩টি অনেকের জন্য পরিমিত; ডায়াবেটিস বা বিশেষ খাদ্যনির্দেশনা থাকলে চিকিৎসকের পরামর্শ নিন।']],
ghee:[['খাঁটি ঘি চেনার সূচক','ভালো গাওয়া ঘির ঘ্রাণ স্বাভাবিক, মিষ্টি-মাখনের মতো; স্বাদে চিটচিটে বা তেলতেলে অনুভূতি থাকে না। ঘরের তাপমাত্রায় এটি নরম দানাদার, গরমে স্বচ্ছ সোনালি তরল। কৃত্রিম রং বা কড়া সুবাস থাকলে সতর্ক হোন। কেনার সময় উৎস, তৈরির তারিখ ও মেয়াদ জানতে চান। সবচেয়ে ভালো পরীক্ষা হলো নিজের স্বাদ ও ঘ্রাণ — ঘি খাওয়ার পর গলায় অস্বাভাবিক টান বা তেতো অনুভূতি হলে ব্যবহার বন্ধ করুন।'],['রান্নায় ঘি: কোথায় সবচেয়ে ভালো','ঘির স্মোক পয়েন্ট বা ধোঁয়া ওঠার তাপমাত্রা তুলনামূলক বেশি, তাই ভাজা ও ভুনা রান্নায় এটি স্থিতিশীল থাকে। পোলাও-বিরিয়ানি, খিচুড়ি, পরোটা, হালুয়া, ডাল-তড়কা এবং সবজির ফোড়নে অল্প ঘি দিলে ঘ্রাণ ও স্বাদ বেড়ে যায়। গরম ভাতের সাথে এক চা-চামচ ঘি অনেক পরিবারের প্রিয় অভ্যাস। পরিমাণ সীমিত রাখুন, কারণ ঘি ক্যালরিসমৃদ্ধ।'],['ঘি সংরক্ষণের নিয়ম','পরিষ্কার, শুকনো কাচের জারে রাখুন এবং শুকনো চামচ ব্যবহার করুন — সামান্য আর্দ্রতাও ঘি নষ্ট করতে পারে। সরাসরি আলো ও চুলার তাপ থেকে দূরে রাখুন। ঘিয়ের জারে বারবার হাত বা ভেজা চামচ ঢোকাবেন না। সঠিকভাবে রাখলে ঘি অনেক মাস ভালো থাকে; তবে টকটক গন্ধ, ছত্রাক বা অস্বাভাবিক রঙ দেখলে ফেলে দিন।']],
oil:[['ঘানি ভাঙা বনাম রিফাইনড তেল','ঘানি ভাঙা তেলে সরিষা বা নারকেল ধীরে চাপ দিয়ে তেল বের করা হয় এবং তা ব্লিচ বা অতিরিক্ত রাসায়নিক প্রক্রিয়ায় পরিশোধিত হয় না। ফলে ঘ্রাণ, রং ও স্বাদ প্রাকৃতিকভাবে বেশি থাকে। রিফাইনড তেল সাধারণত হালকা রঙের, গন্ধহীন ও দীর্ঘস্থায়ী। কোনটি ভালো তা নির্ভর করে আপনার রান্না ও স্বাদের পছন্দের ওপর; ঐতিহ্যবাহী বাঙালি রান্নায় ঘানির তেলের জুড়ি নেই।'],['প্রতিদিনের রান্নায় তেল ব্যবহারের টিপস','তেল অতিরিক্ত গরম করে ধোঁয়া তুলবেন না, এতে স্বাদ তেতো হয় ও পুষ্টিগুণ কমে। একই তেল বারবার গরম করে ব্যবহার করা এড়িয়ে চলুন। পরিমিত তেলে রান্না করুন এবং সালাদ বা ভর্তায় কাঁচা তেল ব্যবহার করলে অল্প পরিমাণই যথেষ্ট। কোনো স্বাস্থ্যগত সীমাবদ্ধতা থাকলে চিকিৎসক বা পুষ্টিবিদের পরামর্শ নিন।'],['তেল সংরক্ষণ ও মেয়াদ','আলো ও তাপ তেলকে দ্রুত পুরনো করে ফেলে। তাই ঢাকনা শক্ত করে এঁটে ঠান্ডা, অন্ধকার জায়গায় রাখুন। ব্যবহারের আগে ঘ্রাণ দেখে নিন; টকটক বা রান্সিড (পুরনো) গন্ধ থাকলে ব্যবহার করবেন না। বড় বোতল থেকে অল্প অল্প করে ছোট বোতলে ঢেলে রাখলে বাকি তেল দীর্ঘ সময় ভালো থাকে।']],
vinegar:[['ভিনেগার ব্যবহারের ঘরোয়া আইডিয়া','সালাদ ড্রেসিংয়ে অলিভ অয়েল, লেবু ও লবণের সাথে, আচার ও পিকলে, মাংস নরম করতে মেরিনেডে, কিংবা এক গ্লাস পানিতে ১–২ চা-চামচ মিশিয়ে হালকা পানীয় হিসেবে ব্যবহার করা যায়। ঘর পরিষ্কারেও অনেকে সাদা বা আপেল সিডার ভিনেগার ব্যবহার করেন, তবে খাওয়ার জন্য কেনা ভিনেগার আলাদা রাখাই ভালো।'],['কারা সতর্ক থাকবেন','ভিনেগার অম্লীয়। গ্যাস্ট্রিক, আলসার, দাঁতের স্পর্শকাতরতা বা কিডনি সংক্রান্ত সমস্যা থাকলে এটি খাওয়ার আগে চিকিৎসকের পরামর্শ নিন। অন্য ওষুধ খেলে ভিনেগারের সাথে মিথস্ক্রিয়ার সম্ভাবনা আছে কিনা জেনে নিন। কখনোই খালি পেটে বেশি পরিমাণে বা অমিশ্রিত ভিনেগার খাবেন না।'],['ভালো ভিনেগার কেনার সময় কী দেখবেন','লেবেলে "আপেল সিডার ভিনেগার", উপাদান তালিকা, অ্যাসিডিটির শতাংশ (সাধারণত ৫%) ও মেয়াদ দেখুন। ফিল্টার না করা ভিনেগারে "মা" থাকতে পারে, যা স্বাভাবিক। ঢাকনা ঠিকমতো সিল করা আছে কিনা এবং বোতল আলো থেকে দূরে রাখা হয়েছে কিনা দেখে নিন।']],
nuts:[['সতেজ বাদাম কেনার গাইড','সতেজ বাদামে সামান্য মিষ্টি ঘ্রাণ থাকে এবং কামড়ালে মচমচে লাগে। তেল-তেল, তেতো বা টক গন্ধ হলে সেটি পুরনো হয়ে গেছে। প্যাকেটে প্যাকিং তারিখ, মেয়াদ ও সিল দেখে নিন। অপ্রয়োজনে একসাথে বেশি না কিনে ছোট প্যাকে কিনলে সবসময় সতেজ বাদাম পাওয়া যায়।'],['বাদাম দিয়ে ১০ মিনিটের স্বাস্থ্যকর নাস্তা','ওটসের ওপর কাটা বাদাম ও মধু, দইয়ের সাথে আমন্ড-কাজু, বাদাম-খেজুরের বল, সালাদে কুচি বাদাম অথবা শুকনো কড়াইতে হালকা সেঁকে অল্প লবণ ছিটিয়ে চায়ের সাথে — সবই সহজ ও সুস্বাদু আইডিয়া। এক মুঠো (২৫–৩০ গ্রাম) পরিমাণ ঠিক আছে।'],['অ্যালার্জি ও সতর্কতা','বাদামের অ্যালার্জি কখনো গুরুতর হতে পারে। পরিবারে কারও এমন সমস্যা থাকলে বাদাম বা বাদামজাত পণ্য আলাদা রাখুন। ছোট শিশুদের গোটা বাদাম দিলে গলায় আটকে যাওয়ার ঝুঁকি থাকে, তাই কুচি বা গুঁড়া করে দিন। অ্যালার্জির উপসর্গ দেখা দিলে দ্রুত চিকিৎসকের কাছে যান।']],
spice:[['ভালো গুঁড়া মসলা চেনার উপায়','তাজা গুঁড়া মসলার রং প্রাকৃতিক ও ঘ্রাণ তীব্র হয়। রং অস্বাভাবিক উজ্জ্বল, ঘ্রাণ ফ্যাকাশে বা গুঁড়ায় দানা-দানা ভেজা ভাব থাকলে সন্দেহ করুন। ঘরে সহজ পরীক্ষা: সামান্য গুঁড়া হাতের তালুতে ঘষে ঘ্রাণ নিন — ভালো মসলার ঘ্রাণ কয়েক সেকেন্ডেই ফুটে ওঠে। বিশ্বাসযোগ্য উৎস ও প্যাকিং তারিখই সবচেয়ে বড় ভরসা।'],['মসলা সংরক্ষণ ও মেয়াদ','গুঁড়া মসলার শত্রু আলো, তাপ, বাতাস ও আর্দ্রতা। বায়ুরোধী কাচের বা স্টিলের কৌটায়, চুলা ও জানালা থেকে দূরে রাখুন। শুকনো চামচ ব্যবহার করুন এবং অল্প অল্প করে কিনুন — এতে ঘ্রাণ ও রং বেশিদিন ঠিক থাকে। সাধারণত ৬–১২ মাসের মধ্যে ব্যবহার করা ভালো।'],['রান্নায় মসলা ব্যবহারের কৌশল','মসলা তেলে অল্প আঁচে নেড়ে নিলে ঘ্রাণ ফোটে, তবে পুড়ে গেলে তেতো হয়। ভেজা মসলা (পানিতে গুলে) দিলে রং ভালো আসে এবং পোড়ার ঝুঁকি কমে। পরিমাণ অল্প দিয়ে শুরু করে স্বাদ দেখে বাড়ান। বিভিন্ন মসলার মিশ্রণ রান্নায় ভারসাম্য আনে।']],
tea:[['ভালো চা চেনার উপায়','ভালো চায়ের পাতা সমান আকারের, শুকনো ও সুগন্ধি হয়। বেশি গুঁড়া, ধুলো বা ভেজা-ভেজা ভাব থাকলে মান কম হতে পারে। চা বানালে লিকারের রং পরিষ্কার ও গাঢ় হবে এবং স্বাদে সামান্য কষ ও মিষ্টি ভাব থাকবে। প্যাকেটে প্যাকিং তারিখ ও মেয়াদ দেখে নিন।'],['লিকার, দুধ চা ও আলাদা স্টাইলের পার্থক্য','লিকার চা পানি ও পাতায় তৈরি, তাই আসল স্বাদ বোঝা যায়। দুধ চায়ে পাতা একটু বেশি সময় ফুটিয়ে দুধ মেশালে ঘন ও ক্রিমি স্বাদ আসে। গরম বা ঠান্ডা — আপনার পছন্দমতো লেবু, আদা, এলাচ বা সামান্য মধু মিশিয়ে নতুন স্বাদ বানাতে পারেন।'],['চা সংরক্ষণের নিয়ম','চায়ের পাতা গন্ধ শোষণ করে, তাই মসলা বা অন্য উগ্র গন্ধের পণ্যের পাশে রাখবেন না। বায়ুরোধী কৌটায় আলো ও আর্দ্রতা থেকে দূরে রাখুন। ফ্রিজে রাখার দরকার নেই; বরং ফ্রিজের ভেজা পরিবেশ চায়ের ক্ষতি করতে পারে।']],
sweet:[['গুড় ও চিনির জাত চেনার টিপস','ভালো আখের গুড়ের রং গাঢ় সোনালি-বাদামি, স্বাদ মাটির মতো মিষ্টি ও সামান্য ক্যারামেল। অতিরিক্ত সাদা বা চকচকে রং কখনো কৃত্রিম প্রক্রিয়ার ইঙ্গিত হতে পারে। প্যাকেটে উৎস ও তৈরির মৌসুম জানতে চান। শীতকালে (খেজুর ও আখের মৌসুমে) গুড়ের স্বাদ সাধারণত বেশি ভালো হয়।'],['চিনি কমানোর সহজ অভ্যাস','চা-কফিতে চিনির পরিমাণ ধাপে ধাপে কমান, প্যাকেটজাত মিষ্টি পানীয়ের বদলে ফল ও বাড়িতে বানানো পানীয় বেছে নিন। গুড় বা ব্রাউন সুগার ব্যবহার করলেও মোট মিষ্টির পরিমাণ সীমিত রাখুন, কারণ ক্যালরি প্রায় একই থাকে। ডায়াবেটিস থাকলে চিকিৎসকের পরামর্শ অনুযায়ী চলুন।'],['সংরক্ষণ ও ব্যবহার','গুড় আর্দ্রতা টানে, তাই ঢাকনা আঁটা পাত্রে রাখুন। শক্ত হয়ে গেলে ছুরি দিয়ে কেটে বা গুঁড়া করে ব্যবহার করুন। ব্রাউন সুগার শক্ত হলে ভেজা কাপড়ে মুড়ে কয়েক ঘণ্টা রাখলে নরম হয়। পায়েস, পিঠা, চা, বেকিং — সবখানেই ব্যবহার করা যায়।']],
grain:[['ওটসের ধরন ও কোনটি কখন','রোলড ওটস সাধারণ পরিজ ও বেকিংয়ের জন্য ভালো; স্টিল-কাট ওটস বেশি সময় নেয় কিন্তু গড়ন চিবানোর মতো; ইনস্ট্যান্ট ওটস দ্রুত তৈরি হয়। প্যাকেটে "প্লেইন" বা "সাধারণ" লেখা ওটস বেছে নিন, কারণ ফ্লেভারযুক্ত ওটসে চিনি বেশি থাকতে পারে।'],['ওটস দিয়ে ৫টি সহজ রেসিপি আইডিয়া','১) দুধ-মধু-কলা দিয়ে গরম পরিজ। ২) রাতে দইয়ে ভিজিয়ে সকালে ঠান্ডা ওভারনাইট ওটস। ৩) ডিম ও সবজি মিশিয়ে সুস্বাদু ওটস চিলা। ৪) ওটস-খেজুর-বাদামের এনার্জি বল। ৫) ওটস গুঁড়ো করে পরোটা বা কুকিজে আটা-ময়দার সাথে মিশিয়ে ব্যবহার।'],['সংরক্ষণ ও সতর্কতা','বায়ুরোধী কৌটায় শুকনো জায়গায় রাখুন। আর্দ্রতা লাগলে ওটসে পোকা বা ছত্রাক ধরতে পারে। গ্লুটেন সংবেদনশীলতা থাকলে প্যাকেটে "গ্লুটেন-ফ্রি" লেখা আছে কিনা দেখে নিন। নতুন করে খাওয়া শুরু করলে অল্প পরিমাণ দিয়ে শুরু করুন।']],
other:[['কেনার আগে জেনে নিন','প্যাকেটের লেবেল, তারিখ ও মেয়াদ দেখুন এবং কোনো প্রশ্ন থাকলে সরাসরি আমাদের জিজ্ঞাসা করুন। উৎস ও সংগ্রহের তথ্য জানা থাকলে পণ্য নিয়ে সবচেয়ে বেশি আস্থা পাওয়া যায়।']]

'আম্বার খেজুর':{h:'আম্বার খেজুর: গাঢ় রঙের নরম ও রসালো খেজুর',s:'গাঢ় বাদামি থেকে প্রায় কালো রঙের, নরম ও রসালো খেজুর। মিষ্টি বেশ ঘন, স্বাদে ক্যারামেলের আভা।',i:'আম্বার (Ambar) নামে পরিচিত এই খেজুর মদিনা অঞ্চলের পরিচিত নরম জাতগুলোর একটি হিসেবে বাজারে পাওয়া যায়। গাঢ় রং আর নরম গড়নের জন্য অনেকে একে শীতের নাস্তা ও মিষ্টির বিকল্প হিসেবে বেছে নেন।',x:[['স্বাদ ও গড়ন','ত্বক পাতলা, ভেতর নরম ও রসালো। মিষ্টি ঘন ও ক্যারামেলের মতো; বিচি তুলনামূলক বড় হতে পারে।'],['ঘরোয়া ব্যবহার','খেজুরের পায়েস, শেক, কেক বা বাদামের লাড্ডুতে বিচি ছাড়িয়ে ব্লেন্ড করে ব্যবহার করা যায়।'],['সংরক্ষণ','নরম ও রসালো বলে ঘরের তাপমাত্রায় বেশি দিন রাখলে ভ্যাপসা হতে পারে; ফ্রিজ সবচেয়ে নিরাপদ।']],t:['ফ্রিজে বায়ুরোধী কৌটায় রাখুন।','ভেজা হাতে ধরবেন না।','ব্যবহারের আগে হালকা ঠান্ডা অবস্থায় বিচি আলাদা করা সহজ।'],f:[['আম্বার খেজুর কি আজওয়ার মতো?','দুটোই গাঢ় ও নরম, তবে আজওয়া তুলনামূলক কম আঠালো ও মোলায়েম মিষ্টি।'],['খুব নরম হলে কি নষ্ট?','নরম হওয়াটাই স্বাভাবিক; টক গন্ধ বা ছত্রাক দেখলে খাবেন না।']]},
'কালমী খেজুর':{h:'কালমী খেজুর: গাঢ় কালচে রঙের আধা-শুকনো ও শক্ত গড়নের খেজুর',s:'গাঢ় বাদামি-কালচে, আধা-শুকনো ও ঘন গড়নের খেজুর; মিষ্টি মাঝারি এবং সংরক্ষণে তুলনামূলক সহজ।',i:'কালমী (Kalmi) খেজুর সাধারণত কালচে রঙ ও আধা-শুকনো গড়নের জন্য পরিচিত। যারা খুব রসালো বা আঠালো খেজুর পছন্দ করেন না, তাদের কাছে এটি ভালো বিকল্প।',x:[['স্বাদ ও গড়ন','ত্বক পুরু ও কালচে, ভেতরটা ঘন ও চিবানোর মতো। মিষ্টি মাঝারি; ক্যারামেল ও হালকা শুকনো ফলের মতো স্বাদ।'],['কার জন্য ভালো','যারা ভিজে-নরম খেজুর কম পছন্দ করেন, কিংবা ব্যাগে বা অফিসে শুকনো নাস্তা হিসেবে নিতে চান।'],['রান্নায় ব্যবহার','গুড়ের বিকল্প হিসেবে ছোট টুকরো করে পায়েস, সেমাই বা হালুয়ায় ব্যবহার করা যায়।']],t:['ঢাকনা এঁটে ঠান্ডা, শুকনো জায়গায় রাখুন।','অনেকদিন রাখতে ফ্রিজ বেছে নিন।','খাওয়ার আগে ধুয়ে শুকিয়ে নিলে ভালো।'],f:[['কালমী খেজুর কি শক্ত?','আজওয়া বা আম্বারের তুলনায় শক্ত ও চিবানো; সামান্য ভিজিয়ে নিলে নরম হয়।'],['কত দিন রাখা যায়?','আধা-শুকনো বলে সঠিকভাবে রাখলে অন্য নরম জাতের চেয়ে বেশিদিন ভালো থাকে।']]},
'বারহি খেজুর':{h:'বারহি খেজুর: সোনালি, মধুর মতো মিষ্টি ও মুখে গলে যাওয়া খেজুর',s:'হালকা সোনালি-অ্যাম্বার রঙের, অত্যন্ত নরম ও মধুর মতো মিষ্টি খেজুর; মুখে দিলে প্রায় গলে যায়।',i:'বারহি (Barhi) খেজুর ইরাক ও সৌদি আরবের একটি জনপ্রিয় জাত। পাকা অবস্থায় এটি নরম, মিষ্টি ও ক্রিমি স্বাদের বলে পরিচিত।',x:[['স্বাদ ও গড়ন','রং সোনালি থেকে অ্যাম্বার, ত্বক পাতলা ও চকচকে। ভেতরটা মাখনের মতো নরম, মধু ও ক্যারামেলের মিশ্র স্বাদ।'],['কীভাবে খাবেন','ঠান্ডা অবস্থায় খেলে সবচেয়ে ভালো লাগে। দুধ বা আইসক্রিমের সাথেও অনেকে খেতে পছন্দ করেন।'],['সতর্কতা','খুব নরম ও মিষ্টি হওয়ায় আঙুলে লেগে যেতে পারে এবং দাঁতে লেগে থাকে; খাওয়ার পর কুলকুচি করা ভালো।']],t:['ফ্রিজে রাখলে নরম ও সতেজ থাকে।','ঘরের গরমে বেশিক্ষণ বাইরে রাখবেন না।','পরিষ্কার চামচে নিন।'],f:[['বারহি কি খুব মিষ্টি?','হ্যাঁ, মিষ্টি মাত্রা অন্য অনেক জাতের চেয়ে বেশি মনে হতে পারে।'],['কীভাবে রাখব?','বায়ুরোধী কৌটায় ফ্রিজে রাখুন; প্যাকেটের তারিখ দেখে নিন।']]},
'কালোজিরার তেল':{h:'কালোজিরার তেল: ঘ্রাণ, ব্যবহারের নিয়ম ও কেনার আগে জানুন',s:'কালোজিরার বীজ থেকে চাপ দিয়ে সংগৃহীত গাঢ় বাদামি তেল; ঝাঁজালো ঘ্রাণ ও তিতকুটে স্বাদ।',i:'কালোজিরা (Nigella sativa) আমাদের রান্নাঘর ও ঘরোয়া চিকিৎসার ঐতিহ্যে পরিচিত বীজ। এর তেল গাঢ় রঙের, ঘ্রাণ ঝাঁজালো এবং স্বাদ তিতকুটে।',x:[['তেলের বৈশিষ্ট্য','ঠান্ডা-চাপে (কোল্ড-প্রেসড) তেল সাধারণত গাঢ় বাদামি, ঘন ও তীব্র ঘ্রাণের হয়। তিতকুটে স্বাদ স্বাভাবিক; বেশি মিষ্টি বা হালকা গন্ধ হলে মিশ্রণের সম্ভাবনা থাকতে পারে।'],['কীভাবে ব্যবহার করবেন','অনেকে আধা চা-চামচ তেল এক চামচ মধুর সাথে মিশিয়ে বা কুসুম গরম পানিতে খান। ত্বক ও চুলে ম্যাসাজে অন্য তেলের সাথে মিশিয়ে ব্যবহারের প্রচলন আছে। প্রথমবার ব্যবহারের আগে হাতের সামান্য জায়গায় পরীক্ষা করে নিন।'],['কারা সতর্ক থাকবেন','গর্ভবতী বা স্তন্যদানকারী মা, নিয়মিত ওষুধ খান এমন ব্যক্তি (বিশেষত ডায়াবেটিস ও রক্তচাপ) এবং শিশুরা ব্যবহারের আগে চিকিৎসকের পরামর্শ নিন।']],t:['ছোট কাচের গাঢ় রঙের বোতলে আলো থেকে দূরে রাখুন।','খোলার পর ঢাকনা শক্ত করে এঁটে ৬ মাসের মধ্যে শেষ করার চেষ্টা করুন।','গরমে বা রোদে রাখবেন না।'],f:[['কালোজিরার তেল কি রান্নায় চলে?','এটি মূলত সম্পূরক বা ম্যাসাজের জন্য; রান্নায় সরিষা বা অন্য ভোজ্যতেলই বেশি প্রচলিত।'],['তেল কেন তিতা?','কালোজিরার প্রাকৃতিক উপাদানের কারণে তিতকুটে স্বাদ স্বাভাবিক।']]},
'জয়তুনের তেল':{h:'জয়তুনের তেল (অলিভ অয়েল): কোন তেল কীসে ব্যবহার করবেন',s:'জয়তুন ফলের চাপ-তেল; সবুজাভ-সোনালি রং, ফলের মতো ঘ্রাণ ও সামান্য ঝাঁজ। সালাদ ও হালকা রান্নায় জনপ্রিয়।',i:'অলিভ অয়েলকে বাংলায় জয়তুনের তেল বলা হয়। এক্সট্রা ভার্জিন মানের তেল সাধারণত সবুজাভ সোনালি, ফলের মতো সুগন্ধি এবং গলায় সামান্য ঝাঁজ থাকে।',x:[['সালাদ ও হালকা রান্না','সালাদের ড্রেসিং, রুটির সাথে ডুবিয়ে খাওয়া, সেদ্ধ সবজি বা পাস্তায় মেশানো — এসব ব্যবহারে তেলের নিজস্ব স্বাদ ভালো ফুটে ওঠে। মাঝারি আঁচে ভাজাভুজির জন্যও অনেকে ব্যবহার করেন।'],['গভীর ভাজায় কেন নয়','এক্সট্রা ভার্জিন তেল বেশি তাপে ঘ্রাণ ও গুণ হারাতে পারে এবং তুলনামূলক দামি; তাই ডুবো তেলে বারবার ভাজার জন্য এটি সাশ্রয়ী নয়।'],['ত্বক ও চুলে','অনেকে ত্বক ও চুলে হালকা ম্যাসাজে ব্যবহার করেন। নতুন কিছু প্রয়োগের আগে ছোট জায়গায় পরীক্ষা করে নিন।']],t:['কাচের গাঢ় বোতল ও আলো থেকে দূরে রাখুন।','খোলার পর কয়েক মাসের মধ্যে ব্যবহার শেষ করুন।','খুব ঠান্ডায় জমাট বাঁধলে ঘরের তাপে এলে আবার তরল হবে — এটি স্বাভাবিক।'],f:[['এক্সট্রা ভার্জিন মানে কী?','প্রথমবার, তাপ বা রাসায়নিক ছাড়া যান্ত্রিকভাবে চাপে বের করা উন্নত মানের তেল।'],['ফ্রিজে রাখলে জমে যায় কেন?','কম তাপমাত্রায় তেলের কিছু অংশ জমাট বাঁধে; এতে মান নষ্ট হয় না।']]},
'আমলকীর তেল':{h:'আমলকীর তেল: চুলের যত্নে ব্যবহারের নিয়ম ও সতর্কতা',s:'শুকনো আমলকীর নির্যাস মেশানো ভেষজ কেশ তেল; হালকা ভেষজ ঘ্রাণ ও চুলে ম্যাসাজের জন্য উপযোগী।',i:'আমলকী উপমহাদেশের চুলের যত্নের ঐতিহ্যবাহী উপাদান। আমলকীর তেল সাধারণত নারকেল বা তিলের মতো বেস তেলে আমলকী মিশিয়ে তৈরি করা হয় এবং চুল ও মাথার ত্বকে ম্যাসাজে ব্যবহার হয়।',x:[['কীভাবে ব্যবহার করবেন','সামান্য তেল হালকা গরম করে আঙুলের ডগায় মাথার ত্বকে ৫–১০ মিনিট ম্যাসাজ করুন। কমপক্ষে ৩০ মিনিট থেকে ২–৩ ঘণ্টা রেখে হালকা শ্যাম্পুতে ধুয়ে ফেলুন। সপ্তাহে ২–৩ দিন ব্যবহার করা যায়।'],['কী আশা করবেন','নিয়মিত তেল ম্যাসাজ চুলকে নরম ও চকচকে করতে ও শুষ্কতা কমাতে সাহায্য করে বলে অনেকে অভিজ্ঞতা জানান। তবে চুল গজানো বা পড়া বন্ধ হওয়ার নিশ্চয়তা কোনো তেলই দিতে পারে না; খাদ্যাভ্যাস, ঘুম, স্বাস্থ্য ও বংশগত কারণও বড় ভূমিকা রাখে।'],['সতর্কতা','এটি খাওয়ার জন্য নয়। ব্যবহারের আগে কানের পাশে বা হাতে ছোট জায়গায় পরীক্ষা করুন; চুলকানি বা লালচে ভাব হলে ব্যবহার বন্ধ করুন। সমস্যা বেশি হলে চর্মরোগ বিশেষজ্ঞ দেখান।']],t:['ঢাকনা এঁটে ঠান্ডা ও শুকনো স্থানে রাখুন।','তেল পুরো রাত রাখলে বালিশে পুরনো কাপড় বা তোয়ালে বিছিয়ে নিন।','শিশুদের নাগালের বাইরে রাখুন।'],f:[['আমলকীর তেল কি চুল লম্বা করে?','চুলের বৃদ্ধি অনেক কারণে নির্ভরশীল; তেল মাথার ত্বকের যত্নে সাহায্য করে, কিন্তু নির্দিষ্ট ফলের নিশ্চয়তা দেয় না।'],['প্রতিদিন ব্যবহার করা যাবে?','চুলের ধরন বুঝে সপ্তাহে ২–৩ দিন ভালো; তৈলাক্ত ত্বকে কম ব্যবহার করুন।']]},
'ভৃঙ্গরাজ কেশ তেল':{h:'ভৃঙ্গরাজ কেশ তেল: চুল লম্বা করার জনপ্রিয় ভেষজ তেল সম্পর্কে যা জানা দরকার',s:'ভৃঙ্গরাজ (কেশরাজ) পাতার নির্যাস মেশানো কেশ তেল; চুলের গোড়া ও মাথার ত্বকের যত্নে ঐতিহ্যগতভাবে ব্যবহৃত।',i:'ভৃঙ্গরাজ বা কেশরাজ (Eclipta alba) আয়ুর্বেদিক চুলের যত্নে সবচেয়ে পরিচিত উপাদানগুলোর একটি; একে অনেক সময় "চুলের রাজা" বলা হয়। চুল লম্বা ও ঘন করতে অনেকেই ভৃঙ্গরাজ তেল ব্যবহার করেন।',x:[['কেন এই নামই জনপ্রিয়','ইন্টারনেট ও ঘরোয়া পরামর্শে চুলের বৃদ্ধির জন্য সবচেয়ে বেশি আলোচিত ভেষজ নামগুলোর মধ্যে ভৃঙ্গরাজ, আমলকী ও নারকেল তেল শীর্ষে থাকে। এই তেলে সাধারণত ভৃঙ্গরাজ পাতার নির্যাস নারকেল বা তিল তেলে মেশানো থাকে।'],['ব্যবহারের নিয়ম','সপ্তাহে ২–৩ দিন সামান্য গরম করা তেল আঙুলের ডগায় মাথার ত্বকে ৫–১০ মিনিট ম্যাসাজ করুন। ১–৩ ঘণ্টা বা সারারাত রেখে হালকা শ্যাম্পুতে ধুয়ে ফেলুন। ধৈর্য ধরুন — ফল দেখতে সাধারণত কয়েক মাস নিয়মিত ব্যবহার লাগে।'],['সততার সাথে জানা ভালো','কোনো তেলই নিশ্চিতভাবে চুল লম্বা করে দেওয়ার প্রতিশ্রুতি দিতে পারে না। মাথার ত্বক সুস্থ রাখা, ম্যাসাজ, পর্যাপ্ত প্রোটিন, আয়রন ও ঘুম চুলের বৃদ্ধিতে সহায়ক। হঠাৎ বেশি চুল পড়লে চিকিৎসকের পরামর্শ নিন।']],t:['প্রথমবার ব্যবহারের আগে ছোট জায়গায় প্যাচ টেস্ট করুন।','চোখে লাগলে পরিষ্কার পানিতে ধুয়ে ফেলুন।','ঢাকনা এঁটে ছায়াযুক্ত স্থানে রাখুন।'],f:[['ভৃঙ্গরাজ তেল কি সবার জন্য?','বেশিরভাগ মানুষের জন্য নিরাপদ ধরা হয়; অ্যালার্জি বা ত্বকের সমস্যা থাকলে আগে পরীক্ষা বা পরামর্শ নিন।'],['কতদিনে ফল পাওয়া যায়?','চুলের বৃদ্ধি ধীর; ২–৩ মাস নিয়মিত ব্যবহার ও সুষম খাবার একসাথে রাখলে ভালো ধারণা পাওয়া যায়।']]},
'হালুয়া':{h:'হালুয়া: ঘরোয়া স্বাদের মিষ্টি, সংরক্ষণ ও পরিবেশনের গাইড',s:'ঘি, চিনি বা গুড় ও আটা বা সুজি দিয়ে ঘরোয়া পদ্ধতিতে তৈরি নরম ও সুগন্ধি মিষ্টি।',i:'হালুয়া আমাদের উৎসব, অতিথি আপ্যায়ন ও শীতের সন্ধ্যার প্রিয় মিষ্টি। ঘি আর মসলার ঘ্রাণে ভরা নরম হালুয়া একবার খেলে বারবার মনে পড়ে।',x:[['স্বাদ ও গড়ন','হালুয়া সাধারণত ঘন, নরম ও সামান্য দানাদার হয়। ঘি ও এলাচের সুগন্ধ, মিষ্টি মাঝারি থেকে বেশি। কাজু-কিশমিশ বা বাদাম থাকলে মচমচে স্বাদ যোগ হয়।'],['কীভাবে পরিবেশন করবেন','গরম করে হালকা ঘি ছিটিয়ে খেলে সুগন্ধ আরও বাড়ে। রুটি, পরোটা বা সকালের নাস্তার সাথেও অনেকে খান। আলাদা বাটিতে অল্প করে নিন।'],['কখন এটি উপহার হিসেবে ভালো','ঈদ, বিয়ে-বাড়ি, শুভ অনুষ্ঠান বা অতিথির জন্য ছোট কৌটায় দেওয়া হালুয়া সুন্দর উপহার হতে পারে।']],t:['প্যাকেটের তারিখ দেখে নিন এবং দ্রুত শেষ করুন।','গরমে বা ভ্যাপসা আবহাওয়ায় ফ্রিজে রাখুন।','পরিষ্কার শুকনো চামচ ব্যবহার করুন।'],f:[['হালুয়া কতদিন ভালো থাকে?','তৈরির ধরন ও আবহাওয়ার ওপর নির্ভর করে; সাধারণত ফ্রিজে রাখলে বেশি সময় ভালো থাকে। প্যাকেটের তারিখ মেনে চলুন।'],['ডায়াবেটিস থাকলে খাওয়া যাবে?','চিনি ও ঘি বেশি থাকে; চিকিৎসকের পরামর্শ ছাড়া নিয়মিত খাবেন না।']]},
'ইসবগুলের ভুসি':{h:'ইসবগুলের ভুসি: সঠিকভাবে কীভাবে খাবেন ও কী সতর্কতা',s:'ইসবগুল গাছের বীজের খোসা (ভুসি); পানিতে ফুলে জেলির মতো হয়। আঁশ বাড়াতে ও নিয়মিত হজমে সহায়ক হিসেবে পরিচিত।',i:'ইসবগুলের ভুসি Plantago ovata গাছের বীজের খোসা থেকে তৈরি। এতে দ্রবণীয় আঁশ থাকে; পানিতে মিশলে ফুলে জেলির মতো হয়, তাই খাওয়ার নিয়ম জানা জরুরি।',x:[['খাওয়ার সঠিক নিয়ম','১–২ চা-চামচ (প্রায় ৫–১০ গ্রাম) ভুসি এক গ্লাস (২৫০ মিলি বা বেশি) পানিতে মিশিয়ে সঙ্গে সঙ্গে পান করুন, ফুলে ঘন হওয়ার আগেই। এরপর আরও এক গ্লাস পানি খান। অল্প মাত্রায় শুরু করে ধীরে বাড়ান। দিনে একবার বা দুইবার খাওয়ার প্রচলন আছে।'],['কীসের সাথে মেশাবেন','সাধারণ পানি, লেবুর শরবত, দই বা দুধের সাথে মিশিয়ে অনেকে খান। গরম পানি এড়িয়ে চলুন, কারণ তাতে তাড়াতাড়ি ঘন হয়ে যায়।'],['কারা সতর্ক থাকবেন','গিলতে অসুবিধা, অন্ত্রে বাধা, অ্যালার্জি বা নিয়মিত ওষুধ খান এমন ব্যক্তিরা চিকিৎসকের পরামর্শ নিন। অন্য ওষুধ খাওয়ার অন্তত ১–২ ঘণ্টা আগে বা পরে খান। কখনোই শুকনো অবস্থায় বা কম পানিতে খাবেন না।']],t:['বায়ুরোধী কৌটায় শুকনো স্থানে রাখুন।','শুকনো চামচ ব্যবহার করুন; আর্দ্রতা লাগলে জমে যেতে পারে।','প্রচুর পানি পান করুন।'],f:[['ইসবগুলের ভুসির সঠিক বানান কী?','প্রচলিত ও প্রামাণিক বানান হলো ইসবগুলের ভুসি (কখনো ইসবগুল বা ইসপগুল লেখাও দেখা যায়)।'],['রাতে খাওয়া যাবে?','অনেকে রাতে বা সকালে খান। সময় নয়, বেশি পানি ও নিয়মিততাই গুরুত্বপূর্ণ।']]},

CATM.hair=[['চুলের যত্নে বাস্তব প্রত্যাশা','কেশ তেল ম্যাসাজ মাথার ত্বক সতেজ রাখে, শুষ্কতা কমায় ও চুল নরম করে বলে অনেকে অভিজ্ঞতা জানান। কিন্তু চুল লম্বা বা ঘন হওয়ার নিশ্চয়তা কোনো তেলেই নেই; বংশগতি, হরমোন, খাদ্য, ঘুম ও স্বাস্থ্য বড় ভূমিকা রাখে। হঠাৎ বেশি চুল পড়লে চর্মরোগ বিশেষজ্ঞ বা চিকিৎসকের পরামর্শ নিন।'],['ম্যাসাজের সহজ নিয়ম','তেল সামান্য হালকা গরম করে আঙুলের ডগায় মাথার ত্বকে গোলাকারভাবে ৫–১০ মিনিট ম্যাসাজ করুন, তারপর ১–৩ ঘণ্টা রেখে হালকা শ্যাম্পুতে ধুয়ে ফেলুন। সপ্তাহে ২–৩ দিন যথেষ্ট। গরম তেল সরাসরি ত্বকে ঢালবেন না।']];

Object.assign(BLOGP,{
'আখরোট':{h:'আখরোট: খোসা ছাড়ানো মগজের স্বাদ, পুষ্টি ও কীভাবে খাবেন',s:'মগজের মতো ভাঁজওয়ালা, হালকা মিষ্টি ও সামান্য তেতো আভার বাদাম; ওমেগা-৩ জাতীয় চর্বি ও আঁশে ভরপুর। সকালের নাস্তা, সালাদ ও মিষ্টিতে মানায়।',i:'আখরোট (Walnut) শীতপ্রধান অঞ্চলের গাছের ফল। ভেতরের দুই ভাঁজের শাঁসটাই আমরা খাই। দেখতে মগজের মতো বলে এটি অনেক দেশেই পরিচিত "ব্রেন ফুড" নামে, যদিও কোনো একটি খাবারই বুদ্ধি বাড়িয়ে দেয় না; সুষম খাবারের অংশ হিসেবেই এর মূল্য।',x:[['কী আছে আখরোটে','আখরোটে উদ্ভিজ্জ ওমেগা-৩ (আলফা-লিনোলেনিক অ্যাসিড), আঁশ, প্রোটিন, ম্যাগনেসিয়াম ও ভিটামিন ই আছে। ক্যালরি বেশি, তাই অল্প পরিমাণই যথেষ্ট; দিনে মুঠো খানেক (প্রায় ২৫–৩০ গ্রাম) সাধারণ একটি মাপ।'],['স্বাদ ও গড়ন','খোসা ছাড়ানো আখরোট হালকা মিষ্টি, মাখনের মতো তেলতেলে ও শেষে সামান্য তেতো আভা দেয়। ভেতরের বাদামি পাতলা আবরণে এই তেতো ভাব থাকে; চাইলে ১–২ মিনিট গরম পানিতে ভিজিয়ে আবরণ তুলে নিতে পারেন।'],['কীভাবে খাবেন','সরাসরি খাওয়া যায়। ওটস, দই, সালাদ বা কলার সাথে মিশিয়ে নিন। হালকা ভেজে নিলে সুগন্ধ বাড়ে। রাতে পানিতে ৪–৮ ঘণ্টা ভিজিয়ে সকালে খেলে নরম হয় এবং কিছু মানুষের হজমে সুবিধা হয়।'],['ঘরোয়া রান্নায়','কুচি করে কেক, ব্রাউনি, হালুয়া ও পায়েসে দিলে স্বাদ ও গড়ন দুটোই বাড়ে। কুচানো আখরোট দিয়ে খেজুরের লাড্ডুও বানানো যায়।']],t:['আখরোটে তেল বেশি, তাই বায়ুরোধী কৌটায় ঠান্ডা জায়গায় (সম্ভব হলে ফ্রিজে) রাখুন।','তেতো বা বাসি গন্ধ হলে খাবেন না।','বাদাম থেকে অ্যালার্জি থাকলে আখরোট এড়িয়ে চলুন।'],f:[['আখরোট কি রোজ খাওয়া যায়?','সুস্থ মানুষ অল্প পরিমাণ রোজ খেতে পারেন। নির্দিষ্ট অসুখ থাকলে চিকিৎসকের পরামর্শ নিন।'],['ভিজিয়ে খাওয়া কি জরুরি?','না, জরুরি নয়। এটি পছন্দ ও হজমের অভ্যাসের ব্যাপার।'],['কতদিন ভালো থাকে?','ঠান্ডা ও শুকনো জায়গায় বায়ুরোধী কৌটায় কয়েক মাস ভালো থাকে। প্যাকেটের মেয়াদ দেখে নিন।']]},
'চিয়াসিড':{h:'চিয়া সিড: কীভাবে ভেজাবেন, কত খাবেন ও কী বানাবেন',s:'ছোট্ট কালচে-ধূসর বীজ; পানিতে ভিজলে জেলির মতো ফুলে ওঠে। আঁশ ও উদ্ভিজ্জ ওমেগা-৩ আছে। পুডিং, শরবত, দই ও স্মুদিতে মেশানো যায়।',i:'চিয়া সিড (Chia seed) মধ্য ও দক্ষিণ আমেরিকার একটি গাছের বীজ। আকারে তিলের চেয়েও ছোট, নিজের স্বাদ প্রায় নেই বলে যেকোনো পানীয় বা খাবারে সহজে মিশে যায়। বাংলাদেশে সাধারণত শরবত, স্মুদি ও পুডিংয়ে ব্যবহার হয়।',x:[['কেন ভিজিয়ে খাবেন','শুকনো চিয়া সিড পানি শুষে নিজের ওজনের কয়েক গুণ ফুলে যায়। তাই ১০–১৫ মিনিট (বা রাতভর) পানি বা দুধে ভিজিয়ে নিন। শুকনো অবস্থায় বেশি পরিমাণ খেয়ে পরে পানি পান করলে গলায় আটকানোর ঝুঁকি থাকে, তাই এটি এড়ান।'],['কতটা খাবেন','শুরুতে ১ চা-চামচ (প্রায় ৫ গ্রাম) থেকে শুরু করুন; অভ্যস্ত হলে দিনে ১–২ টেবিল-চামচ। আঁশ বেশি, তাই হঠাৎ বেশি খেলে পেট ফাঁপা বা অস্বস্তি হতে পারে। সাথে পর্যাপ্ত পানি পান করুন।'],['সহজ রেসিপি','১ কাপ দুধ বা নারকেলের দুধে ২–৩ টেবিল-চামচ চিয়া মিশিয়ে ফ্রিজে ৪ ঘণ্টা রাখলে চিয়া পুডিং তৈরি। ওপরে ফল, মধু বা কুচানো বাদাম দিন। লেবুর শরবত বা বেলের শরবতেও মেশানো যায়।'],['স্বাদ ও গড়ন','ভেজা চিয়ার ওপর পিচ্ছিল জেলির আবরণ থাকে, ভেতরে সামান্য কুড়মুড়ে ভাব। তাই সাবুদানার মতো গড়ন পছন্দ করলে আপনার ভালো লাগবে।']],t:['বায়ুরোধী কৌটায় শুকনো জায়গায় রাখুন।','ভেজানো চিয়া ফ্রিজে ৩–৫ দিনের মধ্যে খেয়ে ফেলুন।','গিলতে সমস্যা আছে বা রক্ত পাতলা করার ওষুধ খেলে আগে চিকিৎসকের পরামর্শ নিন।'],f:[['চিয়া সিড কি ওজন কমায়?','কোনো একক খাবার ওজন কমায় না। আঁশ পেট ভরা অনুভূতি দিতে পারে, তবে সুষম খাবার ও শরীরচর্চাই মূল।'],['সব বয়সীরা কি খেতে পারে?','ছোট শিশুদের দেওয়ার আগে অবশ্যই ভিজিয়ে নরম করে এবং চিকিৎসকের পরামর্শ নিয়ে দিন।'],['তুকমা ও চিয়া কি এক?','না; দুটোই ভিজে জেলি হয়, কিন্তু আলাদা গাছের বীজ। তুকমা কালো ও বড়, চিয়া ছোট ও ধূসর।']]},
'কুমড়ার বীজ':{h:'কুমড়ার বীজ: ম্যাগনেসিয়াম-জিংকে ভরা কুড়মুড়ে স্ন্যাকস',s:'সবুজাভ, চ্যাপ্টা ও কুড়মুড়ে বীজ; ম্যাগনেসিয়াম, জিংক ও আঁশ আছে। ভেজে নাস্তা হিসেবে, সালাদে বা ওটসের ওপরে ছিটিয়ে খাওয়া যায়।',i:'মিষ্টি কুমড়ার ভেতরের বীজ শুকিয়ে খোসা ছাড়ালে যে সবুজ রঙের শাঁস পাওয়া যায়, তাই আমরা "কুমড়ার বীজ" (Pumpkin seed / পেপিটা) বলি। কুড়মুড়ে স্বাদ ও হালকা বাদামের মতো গন্ধের জন্য এটি স্বাস্থ্য-সচেতনদের পছন্দ।',x:[['পুষ্টি পরিচয়','কুমড়ার বীজে প্রোটিন, ম্যাগনেসিয়াম, জিংক, আয়রন ও আঁশ আছে। ক্যালরি বেশি, তাই মুঠো খানেক (প্রায় ২০–৩০ গ্রাম) পরিমাণ একটি সাধারণ মাপ।'],['ভাজার সহজ উপায়','নন-স্টিক প্যানে তেল ছাড়াই ২–৩ মিনিট মৃদু আঁচে নাড়তে থাকুন; ফুলে উঠে হালকা সোনালি হলে নামান। চাইলে সামান্য লবণ বা গোলমরিচের গুঁড়া ছিটান।'],['কীভাবে খাবেন','সালাদ, স্যুপ, ওটস, দই ও স্মুদি বোলের ওপরে ছিটিয়ে দিন। ঘরে বানানো গ্রানোলা বা বাদাম-বীজের মিক্সেও চমৎকার।'],['স্বাদ ও গড়ন','ভাজলে বাদামের মতো গন্ধ আসে, কামড়ে হালকা কুড়মুড়ে লাগে। কাঁচা অবস্থাতেও খাওয়া যায়, তবে ভাজলে স্বাদ বেশি খোলে।']],t:['বায়ুরোধী কৌটায় ঠান্ডা, শুকনো জায়গায় রাখুন।','তেতো বা বাসি গন্ধ হলে ফেলে দিন।','অতিরিক্ত লবণ দিয়ে ভাজা বীজ বেশি না খাওয়াই ভালো।'],f:[['খোসাসহ নাকি খোসা ছাড়ানো?','এই পণ্যের বীজ খোসা ছাড়ানো সবুজ শাঁস, সরাসরি খাওয়া যায়।'],['প্রতিদিন কতটা?','অল্প পরিমাণ (মুঠো খানেক) যথেষ্ট; বেশি খেলে ক্যালরি বেড়ে যায়।'],['কাঁচা না ভাজা ভালো?','দুটোই খাওয়া যায়; স্বাদের জন্য হালকা ভেজে নিন।']]},
'তরমুজের বীজ':{h:'তরমুজের বীজ: শুকনো, ভাজা ও সহজ স্ন্যাকস হিসেবে খাওয়ার নিয়ম',s:'শুকনো তরমুজ বীজের মিষ্টি-বাদামি শাঁস; হালকা ভেজে চিবিয়ে খাওয়ার মতো নাস্তা। প্রোটিন, ম্যাগনেসিয়াম ও ভালো চর্বি পাওয়া যায়।',i:'তরমুজ খাওয়ার পর যে বীজ আমরা ফেলে দিই, শুকিয়ে ও পরিষ্কার করে সেটিই বিশেষ নাস্তা হিসেবে বিক্রি হয়। এশিয়া ও মধ্যপ্রাচ্যের অনেক দেশে এটি ঐতিহ্যবাহী বীজ-স্ন্যাকস, বিশেষ করে উৎসবে ও অতিথি আপ্যায়নে।',x:[['স্বাদ ও গড়ন','কালচে-বাদামি বা সাদাটে খোসার ভেতরে ছোট শাঁস থাকে। ভাজলে হালকা বাদামি, মিষ্টি-বাদামের মতো স্বাদ ও কুড়মুড়ে ভাব পাওয়া যায়।'],['কীভাবে খাবেন','হালকা আঁচে শুকনো প্যানে ২–৩ মিনিট ভেজে নিন, ঠান্ডা হলে খান। কুমড়ার বীজ বা বাদামের সাথে মিক্স করে নাস্তার বাটিতে রাখলে মজা বাড়ে।'],['কেন জনপ্রিয়','ছোট দানা, তাই আড্ডা বা টিভি দেখার সময় ধীরে ধীরে খাওয়ার অভ্যাসে উপযোগী; চিপসের বিকল্প হিসেবেও অনেকে বেছে নেন।'],['পুষ্টি পরিচয়','এতে প্রোটিন, ম্যাগনেসিয়াম, আয়রন ও উদ্ভিজ্জ চর্বি থাকে। তবে ক্যালরি বেশি, তাই অল্প পরিমাণ খাওয়াই ভালো।']],t:['শুকনো ও বায়ুরোধী কৌটায় রাখুন; স্যাঁতসেঁতে হলে কুড়মুড়ে ভাব চলে যায়।','অতিরিক্ত লবণ দিয়ে ভাজা নাস্তা বেশি না খাওয়াই ভালো।','ছোট শিশুদের গলায় আটকে যাওয়ার ঝুঁকি আছে, তাদের দেওয়ার সময় সতর্ক থাকুন।'],f:[['বীজ কি সরাসরি খাওয়া যায়?','হ্যাঁ, তবে ভাজলে স্বাদ ভালো হয়।'],['খোসা সহ খাব?','প্রচলিত নিয়মে খোসা ভেঙে ভেতরের শাঁস খাওয়া হয়; খোসা শক্ত বলে সবাই গিলে খান না।'],['কতদিন ভালো থাকে?','শুকনো ও বায়ুরোধী অবস্থায় কয়েক মাস; মেয়াদ প্যাকেটে দেখুন।']]},
'গ্রিন টি':{h:'গ্রিন টি: সঠিক তাপমাত্রা, সময় ও নিয়মে কীভাবে বানাবেন',s:'ফারমেন্ট না করা তাজা সবুজ চা-পাতা; হালকা ঘাসের মতো ঘ্রাণ ও কম তেতো স্বাদ। ৭০–৮০° সেলসিয়াস গরম পানিতে ২–৩ মিনিট ভিজিয়ে খান।',i:'গ্রিন টি এবং ব্ল্যাক টি একই চা গাছ (Camellia sinensis) থেকে আসে; পার্থক্য হলো প্রক্রিয়ায়। গ্রিন টিতে পাতা খুব অল্প জারণ হয়, তাই রং সবুজ থাকে ও স্বাদ হালকা ও তাজা হয়। অনেকেই দুধ-চিনি ছাড়া পান করেন।',x:[['কীভাবে বানাবেন','১ কাপ পানি ফুটিয়ে ১–২ মিনিট ঠান্ডা করে নিন (প্রায় ৭০–৮০° সে.)। প্রতি কাপে ১ চা-চামচ (প্রায় ২ গ্রাম) পাতা দিয়ে ২–৩ মিনিট ঢেকে রাখুন, তারপর ছেঁকে নিন। ফুটন্ত পানি বা বেশি সময় ভেজালে তেতো হয়ে যায়।'],['স্বাদ বাড়াতে','লেবুর রস, পুদিনা পাতা বা সামান্য মধু মেশাতে পারেন। দুধ মিশিয়ে সাধারণত খাওয়া হয় না। ঠান্ডা গ্রিন টি বানাতে গরম চা ঠান্ডা করে বরফ দিন।'],['কখন কতটা','দিনে ২–৩ কাপ অনেকের জন্য ঠিক। এতে ক্যাফেইন আছে, তাই ঘুমের কয়েক ঘণ্টা আগে এড়িয়ে চলা ভালো। খালি পেটে কড়া চা কারও কারও অম্বল বাড়ায়।'],['কী দেখে কিনবেন','পাতার রং হালকা সবুজ থেকে অলিভ হলে ভালো; পুরোপুরি বাদামি বা ধুলোর মতো হলে পুরনো। প্যাকেট শক্তভাবে বন্ধ আছে কি না দেখুন।']],t:['আলো, আর্দ্রতা ও গন্ধ থেকে দূরে বায়ুরোধী কৌটায় রাখুন।','খোলা প্যাকেট ২–৩ মাসের মধ্যে ব্যবহার করুন।','একই পাতা ২য় বার ভেজানো যায়, তবে স্বাদ হালকা হবে।'],f:[['গ্রিন টি কি ওজন কমায়?','কোনো পানীয়ই একা ওজন কমায় না। চিনি-দুধ ছাড়া হওয়ায় ক্যালরি কম, এটুকুই সুবিধা।'],['গর্ভাবস্থায় খাওয়া যাবে?','ক্যাফেইনের কারণে পরিমাণ সীমিত রাখুন এবং চিকিৎসকের পরামর্শ নিন।'],['গ্রিন টি আর ব্ল্যাক টির পার্থক্য কী?','একই গাছ; প্রক্রিয়া আলাদা। গ্রিন টি হালকা ও তাজা, ব্ল্যাক টি গাঢ় ও কড়া।']]},
'ব্ল্যাক টি':{h:'ব্ল্যাক টি: কড়া লিকার, দুধ চা ও লেবু চা বানানোর সঠিক নিয়ম',s:'পুরোপুরি জারিত গাঢ় চা-পাতা; কড়া রং ও গাঢ় স্বাদ। দুধ চা, লিকার চা বা লেবু চা — সবভাবেই মানানসই।',i:'ব্ল্যাক টি আমাদের সবচেয়ে চেনা চা। পাতা শুকানো, মোচড়ানো ও পুরোপুরি জারিত করার ফলে গাঢ় বাদামি-কালচে রং, কড়া ঘ্রাণ ও পূর্ণ স্বাদ পাওয়া যায়। সকালের নাস্তা বা বিকেলের আড্ডা — দুই সময়েই এটি জনপ্রিয়।',x:[['লিকার চা','প্রতি কাপে ১ চা-চামচ পাতা, ফুটন্ত পানি (প্রায় ৯৫–১০০° সে.) ঢেলে ৩–৪ মিনিট ঢেকে রাখুন; ছেঁকে চিনি বা মধু মেশাতে পারেন। বেশি সময় ভেজালে তেতো হয়।'],['দুধ চা','পানিতে পাতা দিয়ে ২–৩ মিনিট ফোটান, এরপর গরম দুধ ও চিনি মিশিয়ে আরও ১ মিনিট রেখে ছেঁকে নিন। কড়া স্বাদ চাইলে পাতার পরিমাণ একটু বাড়ান।'],['লেবু ও মশলা চা','লিকার চায়ে লেবুর রস ও সামান্য মধু দিন। শীতে আদা, এলাচ বা দারুচিনি মিশিয়ে মশলা চা বানানো যায়।'],['কী দেখে কিনবেন','পাতা সমান আকারের, গাঢ় রঙের ও শুকনো মচমচে হলে ভালো। অতিরিক্ত গুঁড়া বা ধুলো বেশি হলে লিকার ঘোলা ও তেতো হয়।']],t:['শুকনো, বায়ুরোধী কৌটায় রাখুন; ভেজা চামচ ঢোকাবেন না।','ঝাঁঝালো গন্ধের মসলা বা সাবানের পাশে রাখবেন না; চা গন্ধ টেনে নেয়।','রাতে ঘুমের সমস্যা থাকলে সন্ধ্যার পর কম খান।'],f:[['দিনে কয় কাপ ঠিক আছে?','সুস্থ মানুষ সাধারণত ২–৪ কাপ পান করেন। ক্যাফেইনে সংবেদনশীল হলে কম খান।'],['দুধ চায়ে কেন তেতো লাগে?','বেশি সময় ফোটালে বা পাতা বেশি দিলে এমন হয়; সময় ও পরিমাণ কমান।'],['কতদিন ভালো থাকে?','সঠিকভাবে রাখলে খোলার পর ২–৩ মাস স্বাদ ভালো থাকে।']]},
'তুলসী পাতার চা':{h:'তুলসী পাতার চা: ভেষজ ঘ্রাণ, বানানোর নিয়ম ও সতর্কতা',s:'শুকনো তুলসী পাতার ক্যাফেইনমুক্ত ভেষজ চা; ঝাঁঝালো মিষ্টি ঘ্রাণ ও হালকা স্বাদ। ঋতু বদলের সময় গরম গরম পান করতে অনেকে ভালোবাসেন।',i:'তুলসী ভারতীয় উপমহাদেশে ঘরোয়া ভেষজ হিসেবে বহুদিন ধরে পরিচিত। শুকনো তুলসী পাতার চা (Tulsi / Holy basil tea) চা-গাছের পাতা নয়, তাই সাধারণত ক্যাফেইনমুক্ত। এর ঘ্রাণ লবঙ্গ ও পুদিনার মাঝামাঝি, স্বাদে হালকা ঝাঁজ থাকে।',x:[['কীভাবে বানাবেন','১ কাপ ফুটন্ত পানিতে ১ চা-চামচ শুকনো তুলসী পাতা দিন, ঢেকে ৫–৭ মিনিট ভিজিয়ে ছেঁকে নিন। আদা বা মধু মিশিয়ে পান করা যায়। ঢেকে রাখলে সুগন্ধ ধরে থাকে।'],['কখন পান করবেন','সকাল-বিকেল বা ঠান্ডা ও আবহাওয়া বদলের দিনে গরম পানীয় হিসেবে। যেহেতু এতে ক্যাফেইন নেই, রাতেও অনেকে পান করেন।'],['স্বাদ বাড়াতে','লেবুর রস, আদা, মধু বা অল্প দারুচিনি মেশান। ঠান্ডা করে বরফ দিয়ে খেলেও ভালো লাগে।'],['ঐতিহ্য ও বৈজ্ঞানিক সীমা','তুলসী নিয়ে ঐতিহ্যবাহী ব্যবহার অনেক, কিন্তু রোগ সারানোর পাকা প্রমাণ সীমিত। তাই এটিকে ঘরোয়া আরামদায়ক পানীয় হিসেবে দেখাই ঠিক, ওষুধের বিকল্প নয়।']],t:['রোদ ও আর্দ্রতা থেকে দূরে বায়ুরোধী কৌটায় রাখুন।','গর্ভাবস্থা, স্তন্যদান বা নিয়মিত ওষুধ চললে আগে চিকিৎসকের পরামর্শ নিন।','দিনে ২–৩ কাপের বেশি না খাওয়াই ভালো।'],f:[['তুলসী চায়ে কি ক্যাফেইন আছে?','না, এটি চা-গাছের পাতা নয়; সাধারণত ক্যাফেইনমুক্ত।'],['সর্দি-কাশিতে কি কাজ করে?','গরম পানীয় গলা আরাম দিতে পারে; তবে রোগের চিকিৎসা নয়। সমস্যা বাড়লে ডাক্তার দেখান।'],['কতদিন ভালো থাকে?','শুকনো ও বায়ুরোধী অবস্থায় কয়েক মাস।']]},
'আদা চা পাতা':{h:'আদা চা পাতা: আদা-মেশানো চা বানানোর সহজ নিয়ম ও টিপস',s:'চা-পাতার সাথে আদার ঝাঁজ মেশানো মিক্স; এক কাপেই চা ও আদার স্বাদ পাওয়া যায়। শীতে ও বৃষ্টির দিনে গরম গরম আরামদায়ক।',i:'আদা চা বাংলাদেশের ঘরে ঘরে জনপ্রিয়। প্রতিবার আদা ছেঁচে চা বানানোর ঝামেলা এড়াতে আদা-মেশানো চা-পাতার মিক্স অনেকে বেছে নেন। এতে চা-পাতার গাঢ় স্বাদের সাথে আদার ঝাঁজ ও ঘ্রাণ একসাথে পাওয়া যায়।',x:[['কীভাবে বানাবেন','১ কাপ পানিতে ১–১½ চা-চামচ মিক্স দিয়ে ২–৩ মিনিট ফোটান, তারপর ছেঁকে নিন। দুধ চা চাইলে ফোটানো শেষে গরম দুধ ও চিনি মিশিয়ে আরও ১ মিনিট রাখুন।'],['ঝাঁজ কমানো বা বাড়ানো','ঝাঁজ বেশি লাগলে পাতা কমান ও দুধ বেশি দিন। আরও ঝাঁজ চাইলে সামান্য টাটকা আদা কুচি যোগ করুন।'],['কখন ভালো লাগে','ঠান্ডা, বৃষ্টির দিনে বা গলা খুসখুস করলে গরম আদা চা আরাম দেয়। অতিথি আপ্যায়নেও দ্রুত বানানো যায়।'],['সতর্কতা','আদা বেশি খেলে কারও অম্বল হতে পারে। পিত্তথলির পাথর, রক্তপাতজনিত সমস্যা বা রক্ত পাতলা করার ওষুধ চললে চিকিৎসকের পরামর্শ নিন।']],t:['বায়ুরোধী কৌটায় শুকনো জায়গায় রাখুন।','ভেজা চামচ ঢোকাবেন না।','মিক্স একবার খুলে গেলে ২–৩ মাসের মধ্যে ব্যবহার করুন।'],f:[['এতে ক্যাফেইন আছে?','চা-পাতা থাকলে সামান্য ক্যাফেইন থাকে; প্যাকেটের উপাদানের তালিকা দেখে নিন।'],['দুধ ছাড়া খাওয়া যায়?','হ্যাঁ; লিকার আদা চা মধু ও লেবু দিয়েও ভালো লাগে।'],['খালি পেটে খাওয়া ঠিক?','কারও অম্বল হতে পারে; অস্বস্তি হলে খাবারের পরে খান।']]},

function playIntro(){
 const force=/[?&]intro=1/.test(location.search);
 try{if(navigator.webdriver&&!force)return}catch(e){}
 try{if(!force&&sessionStorage.getItem('pb_intro')==='1')return;sessionStorage.setItem('pb_intro','1')}catch(e){}
 const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,T=reduce?1100:3000;
 const el=document.createElement('div');el.id='intro';
 el.innerHTML='<canvas id="ic"></canvas><div class="ig"></div><div class="iscan"></div><div class="ihub"><i class="ir r1"></i><i class="ir r2"></i><i class="ir r3"></i><div class="ilw"><img class="ilogo" src="'+LOGO+'" alt=""><i class="ibeam"></i></div></div><div class="itx"><div class="iname">'+'PureBite'.split('').map((c,i)=>'<span style="animation-delay:'+(1.05+i*.07).toFixed(2)+'s">'+c+'</span>').join('')+'</div><div class="itag"><span style="animation-delay:1.85s">খাঁটি পণ্য,</span> <span style="animation-delay:2.05s">বিশ্বাসের স্বাদ</span></div></div><button class="iskip" type="button">স্কিপ ›</button><i class="ibar"></i>';
 if(reduce)el.classList.add('rm');
 document.body.appendChild(el);
 let done=false,raf=0;
 const end=()=>{if(done)return;done=true;cancelAnimationFrame(raf);el.classList.add('out');setTimeout(()=>el.remove(),500)};
 el.addEventListener('click',end);
 setTimeout(end,T);
 if(reduce)return;
 const cv=el.querySelector('#ic'),cx=cv.getContext('2d');if(!cx)return;
 let W=0,H=0,D=Math.min(2,window.devicePixelRatio||1);
 const size=()=>{W=window.innerWidth;H=window.innerHeight;cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(D,0,0,D,0,0)};size();
 const HU=[190,215,265,300,48,150],N=64,ps=[];
 for(let i=0;i<N;i++)ps.push({a:Math.random()*6.283,r:.28+Math.random()*.62,v:(Math.random()<.5?-1:1)*(.5+Math.random()*1.1),s:1+Math.random()*2.2,h:HU[i%HU.length],p:Math.random()*6.283});
 const hx=[];for(let i=0;i<9;i++)hx.push({x:Math.random(),y:Math.random(),s:10+Math.random()*22,v:.03+Math.random()*.06,p:Math.random()*6.283});
 const t0=performance.now();
 const hex=(x,y,r,rot)=>{cx.beginPath();for(let k=0;k<6;k++){const a=rot+k*Math.PI/3;cx[k?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r)}cx.closePath()};
 const frame=now=>{
  const t=now-t0;if(done)return;
  cx.clearRect(0,0,W,H);
  const X=W/2,Y=H*.42,U=Math.min(W,H)/390,e=Math.min(1,t/900),ee=1-Math.pow(1-e,3);
  hx.forEach(h=>{const yy=((h.y-t/1000*h.v*2+10)%1)*H,al=.16+.1*Math.sin(t/400+h.p);cx.strokeStyle='rgba(253,230,138,'+al+')';cx.lineWidth=1;hex(h.x*W,yy,h.s*U,t/2000*(h.v*8));cx.stroke()});
  const pts=ps.map(p=>{const r=p.r*210*U*(1+(1-ee)*2.4),a=p.a+p.v*t/1000;return{x:X+Math.cos(a)*r,y:Y+Math.sin(a)*r*.62,p}});
  cx.lineWidth=.6;
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=dx*dx+dy*dy;if(d<3600*U*U){cx.strokeStyle='rgba(110,231,255,'+(.22*(1-d/(3600*U*U))*ee)+')';cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.stroke()}}
  pts.forEach(q=>{const al=ee*(.55+.45*Math.sin(t/260+q.p.p));cx.fillStyle='hsla('+q.p.h+',95%,72%,'+al+')';cx.shadowColor='hsla('+q.p.h+',100%,65%,.9)';cx.shadowBlur=10;cx.beginPath();cx.arc(q.x,q.y,q.p.s*U,0,6.283);cx.fill()});
  cx.shadowBlur=0;
  if(t>2300&&t<3000){const k=(t-2300)/700;cx.strokeStyle='rgba(167,139,250,'+(.7*(1-k))+')';cx.lineWidth=2;cx.beginPath();cx.arc(X,Y,(70+k*Math.max(W,H)*.6)*1,0,6.283);cx.stroke()}
  raf=requestAnimationFrame(frame);
 };
 raf=requestAnimationFrame(frame);
 window.addEventListener('resize',size,{once:true});
}

 sendWA:()=>{
  const ev=window.event;if(ev&&ev.isTrusted===false)return;
  if(SUBMITTING)return;
  const hp=document.getElementById('k_web');
  if(hp&&hp.value){SUBMITTING=true;return showOrderDone()}
  if(Date.now()-FORMT<2500)return toast('ফর্মটি পূরণ করে আবার চাপুন');
  const f=orderFields();if(!f)return;
  if(refBad())return toast('রেফারেল কোডটি সঠিক নয়');
  const to=intl(CM?CM.w:db.shop.phone);
  if(!to&&!CM)return toast('আগে সেটিংসে আপনার WhatsApp নম্বর দিন');
  const g=orderLimit(f.phone);if(g)return toast(g);
  SUBMITTING=true;
  const url='https://wa.me/'+to+'?text='+encodeURIComponent(cartMsg());
  orderRecord(f.phone);LASTMSG=url;try{notifyHook(f)}catch(e){}
  window.open(url,'_blank','noopener,noreferrer');
  CART={};try{render()}catch(e){}
  showOrderDone();
 },
 waAgain:()=>{if(LASTMSG)window.open(LASTMSG,'_blank','noopener,noreferrer')},
 doneOrder:()=>{LASTMSG='';SUBMITTING=false;closeModal();try{render()}catch(e){}},
 saveCartOrder:()=>{
  if(SUBMITTING)return;
  const f=orderFields();if(!f)return;
  if(refBad())return toast('রেফারেল কোডটি সঠিক নয়');
  const items=cartLines().map(i=>({pid:i.id,qty:i.qty,price:i.price}));
  const sig=cartLines().map(i=>i.id+'x'+i.qty).sort().join('|'),now0=Date.now();
  if(db.orders.some(o=>o.custPhone===f.phone&&now0-new Date(o.date).getTime()<36e5*24&&o.items.map(x=>x.pid+'x'+x.qty).sort().join('|')===sig)&&!confirm('এই নম্বরে আজ একই অর্ডার আগেই সেভ করা আছে। তবুও আবার সেভ করবেন?'))return;
  SUBMITTING=true;
  const o=makeOrder({custName:f.name,custPhone:f.phone,custAddr:f.addr,dist:val('k_dist'),note:f.note,status:'new',method:val('k_pay'),ref:refVal()},items);
  CART={};SUBMITTING=false;closeModal();toast('অর্ডার '+o.no+' সেভ হয়েছে ✓');go('orders');
 },
 saveSettings:()=>{const hk=val('s_hook');if(hk&&!/^https:\/\/[^\s"'<>]{4,180}$/.test(hk))return toast('নোটিফিকেশন লিংক https:// দিয়ে শুরু হতে হবে');db.shop={name:val('s_name')||'PureBite',phone:val('s_phone'),email:val('s_email'),addr:val('s_addr'),fu1:val('s_fu1')||'40',fu2:val('s_fu2')||'45',fulink:val('s_fulink'),fumsg:val('s_fumsg'),fb:val('s_fb'),mm:val('s_mm'),ig:val('s_ig'),note:val('s_note'),bkash:val('s_bkash'),nagad:val('s_nagad'),bank:val('s_bank'),acc:val('s_acc'),hook:val('s_hook'),dchg:val('s_dchg'),hrs:val('s_hrs')};save();toast('সেটিংস সেভ হয়েছে ✓');render()},
 exportData:()=>{const cp=JSON.parse(JSON.stringify(db));delete cp.lock;delete cp.cpw;const b=new Blob([JSON.stringify(cp,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='purebite-backup-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();toast('ব্যাকআপ ডাউনলোড হচ্ছে')},
 importData:()=>$('#impfile').click(),
 delSample:()=>{if(!confirm('নমুনা অর্ডার, পণ্য ও কাস্টমার মুছে যাবে। চালিয়ে যাবেন?'))return;db.orders=db.orders.filter(o=>!o.s);db.products=db.products.filter(p=>!p.s);db.customers=db.customers.filter(c=>!c.s);save();toast('নমুনা তথ্য মুছে গেছে');render()},
 resetAll:()=>{if(!confirm('সব অর্ডার, পণ্য ও কাস্টমার মুছে যাবে!'))return;if(!confirm('নিশ্চিত? এটি আর ফেরানো যাবে না।'))return;const shop=db.shop,lk=db.lock;db={v:3,shop,products:[],customers:[],orders:[],seq:1000,photos:{},details:{},slides:[null,null,null,null,null]};if(lk)db.lock=lk;save();toast('নতুন করে শুরু করুন');render()}
};

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const fn=ACT[t.dataset.act];if(fn){if(t.tagName!=='A')e.preventDefault();fn(t.dataset,t)}
});
function resizePhoto(file,cb,mx,q){mx=mx||640;q=q||.82;
 const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{const k=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',q))};
 img.onerror=()=>{URL.revokeObjectURL(url);toast('ছবিটি পড়া যায়নি — JPG বা PNG ছবি দিন')};img.src=url;
}
document.addEventListener('change',e=>{
 const fi=e.target;
 if(fi.dataset&&fi.dataset.sid){setStatus(fi.dataset.sid,fi.value);return}
 if(fi.dataset&&fi.dataset.slide!==undefined&&fi.files[0]){const i=+fi.dataset.slide;resizePhoto(fi.files[0],d=>{db.slides[i]=d;save();toast('স্লাইডে ছবি বসেছে ✓');redrawSlides()},1000,.8);fi.value='';return}
 if(fi.id==='pr_photo'&&fi.files[0]){resizePhoto(fi.files[0],d=>{PH=d;const p=$('#pr_prev');if(p)p.src=d;toast('ছবি বসানো হয়েছে — "সেভ করুন" চাপুন')});fi.value='';return}
 if(fi.dataset&&fi.dataset.gslot!==undefined&&fi.files[0]){const g=galGroup(),sl=+fi.dataset.gslot;if(g){resizePhoto(fi.files[0],d=>{const a=(db.gallery[g.g]||[]).slice();while(a.length<GMAX)a.push(null);a[sl]=d;db.gallery[g.g]=a;save();openGallery(GALK);toast('ছবি যোগ হয়েছে ✓');redrawShop()},560,.72)}fi.value='';return}
 if(fi.dataset&&fi.dataset.pid!==undefined&&fi.files[0]){const g=fi.dataset.pid;resizePhoto(fi.files[0],d=>{db.photos[g]=d;save();toast('ছবি সেভ হয়েছে ✓');redrawShop(1)});fi.value='';return}
 if(e.target.id==='impfile'&&e.target.files[0]){
  const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x||!Array.isArray(x.products)||!Array.isArray(x.orders))throw 0;const lk=db.lock,cpw0=db.cpw;db=sanitizeDb(x);if(lk)db.lock=lk;else delete db.lock;if(cpw0)db.cpw=cpw0;else delete db.cpw;fixDb();save();toast('ব্যাকআপ রিস্টোর হয়েছে ✓');render()}catch(err){toast('ফাইলটি সঠিক ব্যাকআপ নয়')}};
  rd.readAsText(e.target.files[0]);
 }
});
function boot(){BOOTED=true;shell();render();setTimeout(autoFollow,900)}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='s_alk'){db.alk=+e.target.value;save();toast('অটো-লক '+bn(db.alk,0)+' মিনিটে সেট হয়েছে ✓')}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='cp_in')ACT.catUnlock();if(e.key==='Enter'&&e.target&&e.target.id==='lk_pin')tryUnlock();else if(e.key==='Enter'&&e.target&&e.target.id==='sq2'){ACT.srAll()}else if(e.key==='Enter'&&e.target&&e.target.id==='shq'){const g=$('#glist');e.target.blur();if(g)g.scrollIntoView({behavior:'smooth',block:'start'})}});
let LASTACT=Date.now();
['pointerdown','keydown','touchstart','scroll','click'].forEach(ev=>document.addEventListener(ev,()=>{LASTACT=Date.now()},{passive:true,capture:true}));
setInterval(()=>{if(!db||db.pub||PUBMODE||!db.lock||!BOOTED)return;const lk=$('#lock');if(lk&&lk.style.display==='flex')return;const m=db.alk||15;if(Date.now()-LASTACT>m*60000)showLock()},15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){HID=Date.now()}else if(db&&db.lock&&!PUBMODE&&BOOTED&&HID&&Date.now()-HID>120000){showLock()}});
document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('#slider'))SL.x=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(!(e.target.closest&&e.target.closest('#slider'))||SL.n<2)return;const dx=e.changedTouches[0].clientX-SL.x;if(Math.abs(dx)>40){slideTo((SL.k+(dx<0?1:SL.n-1))%SL.n);startSlider()}},{passive:true});
window.addEventListener('DOMContentLoaded',()=>{
 dlg().addEventListener('click',e=>{if(e.target===dlg())closeModal()});
 window.addEventListener('popstate',()=>{if(!$('#pg-shop'))return;if(!blogRoute(location.hash,true)&&SV==='blog')setView('home',1)});
 dlg().addEventListener('close',()=>{if(SV==='prod'&&$('#pg-shop'))redrawProd()});
 try{playIntro()}catch(e){}
 if(PUBMODE&&PUBD){db=PUBD;sanitizeDb(db);fixDb();CM=pubCM();try{initBot()}catch(e){}}
 if(CM){
  document.body.classList.add('cust');
  $$('img[data-logo]').forEach(i=>i.src=LOGO);$('#favicon').href=LOGO;
  $('#ptitle').textContent=CM.n;$('#pdate').textContent='';document.title=CM.n+' — ক্যাটালগ';
  mountShop();initHQ();try{blogRoute(location.hash,true)}catch(e){}return;
 }
 if(ENC){let loc=null;try{loc=JSON.parse(localStorage.getItem(KEY))}catch(e){}const okl=loc&&Array.isArray(loc.products)&&Array.isArray(loc.orders);if(!okl||(loc.ts||0)<(ENC.ts||0)){return encGate()}}
 load();
 if(db.lock)showLock();else boot();
});
