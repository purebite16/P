 }
 return `<div id="slwrap">${slidesHTML()}</div><div id="catwrap">${catsHTML()}</div><div class="sect" style="margin:4px 0 8px">পণ্যসমূহ</div><div id="filtwrap">${filtHTML()}</div><div class="glist" id="glist">${listHTML()}</div><div id="cartwrap">${cartHTML()}</div>${footerHTML()}`;
}

/* --- কার্ট পেজ --- */
function cartRowHTML(i){
 return `<div class="cprow"><span class="thumb" style="width:58px;height:58px"><img src="${groupImg(i)}" alt=""></span><div class="grow"><div class="cpn">${esc(i.name)}</div><div class="cpq"><div class="step"><button data-act="cartAdd" data-id="${i.id}" data-d="-1">−</button><span>${bn(i.qty)}</span><button data-act="cartAdd" data-id="${i.id}" data-d="1">+</button></div><span class="sm">× ${tk(i.price)} = <b>${tk(i.qty*i.price)}</b></span></div></div><button class="cpx" data-act="cartDel" data-id="${i.id}" aria-label="সরান">✕</button></div>`;
}
const cpItemsHTML=()=>{const cl=cartLines();return cl.length?cl.map(cartRowHTML).join(''):`<div class="empty">কার্ট খালি আছে।<br><button class="btn" style="margin-top:12px" data-act="sHome">পণ্য দেখুন</button></div>`};
function cpFootHTML(){const cl=cartLines(),tot=cl.reduce((a,i)=>a+i.qty*i.price,0);return `<div class="cptot"><span>মোট:</span><b>${tk(tot)}</b></div><button class="btn big" data-act="checkout" ${cl.length?'':'disabled'}>চেকআউট →</button>`}
function recHTML(){
 const inCart=new Set(cartLines().map(i=>i.cat+'|'+i.group));
 const cards=shopData().filter(g=>!inCart.has(g.cat+'|'+g.g)&&(!CM||g.items.some(i=>i.avail))).slice(0,12).map(g=>{
  const it=g.items.find(i=>i.avail)||g.items[0];
  return `<div class="reccard"><span class="thumb" style="width:62px;height:62px"><img src="${groupImg(it)}" alt=""></span><div class="grow"><div class="recn">${esc(g.g)}</div><div class="sm muted">${esc(it.size||'')}</div><div class="recp">${tk(it.price)}</div><button class="btn sm" data-act="cartAdd" data-id="${it.id}" data-d="1">+ যোগ</button></div></div>`;
 }).join('');
 if(!cards)return '';
 return `<section class="recsec"><div class="rechd"><b>আপনার পছন্দ হতে পারে</b><span class="recar"><button class="carr" data-act="recScroll" data-d="-1" aria-label="আগের">‹</button><button class="carr" data-act="recScroll" data-d="1" aria-label="পরের">›</button></span></div><div class="rectrack" id="rectrack">${cards}</div></section>`;
}
function cartPageHTML(){
 return `<div class="cpage"><div class="cphead"><b>🛒 শপিং কার্ট</b><button data-act="sHome">বন্ধ করুন ✕</button></div><div id="cpitems">${cpItemsHTML()}</div><div id="cprec">${recHTML()}</div><div class="cpfoot" id="cpfoot">${cpFootHTML()}</div></div>`;
}

function acctHTML(){
 const s=shopContact(),P=PAY(),wa=intl(s.w),fb=socialURL(CM?CM.fb:db.shop.fb,'fb'),ig=socialURL(CM?CM.ig:db.shop.ig,'ig'),note=CM?CM.nt:db.shop.note;
 const line=(ico,lbl,val,href)=>val?`<div class="acl"><span class="ai">${ico}</span><div class="grow"><small>${lbl}</small>${href?`<a href="${esc(href)}"${/^https?:/.test(href)?' target="_blank" rel="noopener noreferrer"':''}>${esc(val)}</a>`:`<b>${esc(val)}</b>`}</div></div>`:'';

 <div class="card"><h3>🌐 সোশ্যাল মিডিয়া</h3><div class="socs">${soc('fb','Facebook পেজ','📘',fb)}${soc('ig','Instagram','📸',ig)}</div></div>
 <div class="card"><h3>💳 পেমেন্ট</h3>${pay('ক্যাশ অন ডেলিভারি (COD)','পণ্য হাতে পেয়ে টাকা দিন','')}${P.bkash?pay('বিকাশ (পার্সোনাল)',P.bkash,P.bkash):''}${P.nagad?pay('নগদ (পার্সোনাল)',P.nagad,P.nagad):''}${P.acc?pay((P.bank||'ব্যাংক'),'A/c '+P.acc,P.acc):''}</div>

function openDrawer(){closeSearch();const d=$('#drawer');if(!d)return;d.innerHTML=drawerHTML();d.className='open anim'}

/* --- সার্চ (নিচের সার্চ বাটন) --- */
function sresHTML(q){
 q=q.trim().toLowerCase();const all=shopData();
 if(!q)return `<div class="muted sm" style="padding:10px 2px">পণ্যের নাম লিখুন, অথবা ক্যাটাগরি বেছে নিন:</div><div class="tags">${CATS.filter(c=>all.some(x=>x.cat===c[0])).map(c=>`<button data-act="srTag" data-c="${c[0]}">${c[2]} ${esc(c[1])}</button>`).join('')}</div>`;
 const gs=all.filter(x=>(x.g+' '+catName(x.cat)+' '+x.items.map(i=>i.size).join(' ')).toLowerCase().includes(q));
 if(!gs.length)return `<div class="empty">"${esc(q)}" নামে কিছু পাওয়া যায়নি</div>`;
 return gs.slice(0,12).map(g=>`<button class="srow" data-act="srPick" data-c="${g.cat}" data-g="${esc(g.g)}"><span class="thumb" style="width:46px;height:46px"><img src="${groupImg(g.items[0])}" alt=""></span><span class="grow"><b>${esc(g.g)}</b><small>${esc(catName(g.cat))}</small></span><b class="pr">${tk(Math.min(...g.items.map(i=>i.price)))}${g.items.length>1?'~':''}</b></button>`).join('')+`<button class="btn wide" data-act="srAll">সব ফলাফল দেখুন (${bn(gs.length,0)})</button>`;
}
function srchHTML(){return `<div class="sb" data-act="srClose"></div><div class="sp"><div class="sbar"><span>🔍</span><input id="sq2" type="search" placeholder="পণ্য খুঁজুন (যেমন: লিচু, ঘি, চা)" autocomplete="off" oninput="sqType(this.value)" value="${esc(SQV)}"><button data-act="srClose" aria-label="বন্ধ">✕</button></div><div id="sres">${sresHTML(SQV)}</div></div>`}

/* ---------- SHA-256 (অর্ডার ট্র্যাক কী-এর জন্য) ---------- */
const SHA=(()=>{const K=[],H=[];const fr=x=>((x-Math.floor(x))*4294967296)|0;let n=2,c=0;while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}if(p){if(c<8)H.push(fr(Math.sqrt(n)));K.push(fr(Math.cbrt(n)));c++}n++}return{K,H}})();
function sha256(s){
 const b=unescape(encodeURIComponent(s)),l=b.length,w=[];
 for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<((3-i%4)*8);
 w[l>>2]|=0x80<<((3-l%4)*8);
 const nl=(((l+8)>>6)+1)*16;w[nl-1]=l*8;for(let i=0;i<nl;i++)w[i]=w[i]|0;
 let h=SHA.H.slice();
 for(let j=0;j<nl;j+=16){
  const x=w.slice(j,j+16);
  for(let i=16;i<64;i++){const a=x[i-15],c=x[i-2];const s0=(a>>>7|a<<25)^(a>>>18|a<<14)^(a>>>3),s1=(c>>>17|c<<15)^(c>>>19|c<<13)^(c>>>10);x[i]=(x[i-16]+s0+x[i-7]+s1)|0}
  let [a,b2,c2,d,e,f,g,hh]=h;
  for(let i=0;i<64;i++){
   const S1=(e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7),ch=(e&f)^(~e&g),t1=(hh+S1+ch+SHA.K[i]+x[i])|0;
   const S0=(a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10),mj=(a&b2)^(a&c2)^(b2&c2),t2=(S0+mj)|0;
   hh=g;g=f;f=e;e=(d+t1)|0;d=c2;c2=b2;b2=a;a=(t1+t2)|0;
  }
  const r=[a,b2,c2,d,e,f,g,hh];h=h.map((v,i)=>(v+r[i])|0);
 }
 return h.map(v=>('00000000'+(v>>>0).toString(16)).slice(-8)).join('');
}

'সুন্দরবনের মধু':{h:'সুন্দরবনের মধু: বনের ঘ্রাণ ও খাঁটি স্বাদের পরিচয়',s:'সুন্দরবনের বিভিন্ন ম্যানগ্রোভ গাছের ফুল থেকে মৌমাছির সংগ্রহ করা মধু। স্বাদে মোলায়েম মিষ্টি ও হালকা বনজ ঘ্রাণ থাকে।',i:'সুন্দরবন বিশ্বের বৃহত্তম ম্যানগ্রোভ বন। এখানকার খলিশা, গেওয়া, কেওড়া, বাইন ও গোলপাতার মতো গাছের ফুলে মৌমাছিরা মধু সংগ্রহ করে। মৌসুম ও ফুলের ওপর নির্ভর করে মধুর রং ও স্বাদ বদলায়।',x:[['স্বাদ ও ঘ্রাণ','সাধারণত স্বাদে নরম মিষ্টি, সামান্য নোনতা-বনজ আভা এবং সুগন্ধ থাকে। সংগ্রহের সময়ের ওপর নির্ভর করে রং হালকা সোনালি থেকে গাঢ় অ্যাম্বার হতে পারে।'],['সংগ্রহের সময়','সুন্দরবনের মধু সাধারণত বসন্তের শেষ থেকে গ্রীষ্মের শুরুর দিকে (প্রায় এপ্রিল–মে) সংগ্রহ হয়, যখন ম্যানগ্রোভ গাছে ফুল আসে। প্রতিটি ব্যাচের সংগ্রহের স্থান ও সময় "বিস্তারিত" অংশে দেখে নিন।'],['কীভাবে ব্যবহার করবেন','সকালে এক চা-চামচ সরাসরি, কুসুম গরম পানি বা লেবুর সাথে, রুটি-পরোটায় কিংবা দুধ-চায়ে চিনির বিকল্প হিসেবে ব্যবহার করতে পারেন।']],t:['জার ঠান্ডা, শুকনো জায়গায় রাখুন।','ভেজা চামচ ঢোকাবেন না।','জমে গেলে হালকা গরম পানিতে জার রেখে তরল করুন।'],f:[['এই মধু কি জমে যায়?','কম গ্লুকোজের মধু ধীরে জমে। তবে ঠান্ডা আবহাওয়ায় দানা বাঁধতে পারে — এটি প্রাকৃতিক, ভেজাল নয়।'],['শিশুরা কি খেতে পারে?','১২ মাসের কম বয়সী শিশুকে মধু দেওয়া যাবে না।']]},
'সরিষা ফুলের মধু':{h:'সরিষা ফুলের মধু: শীতের জনপ্রিয় ও দ্রুত জমে যাওয়া মধু',s:'শীত মৌসুমে সরিষার ফুল থেকে সংগ্রহ করা হালকা রঙের মধু। দানা বেঁধে নরম ক্রিমের মতো জমে যাওয়া এর পরিচিত বৈশিষ্ট্য।',i:'বাংলাদেশে শীতকালে সরিষা খেতে হলুদ ফুলের সমারোহ দেখা যায়। এই ফুল থেকে সংগ্রহ করা মধু হালকা সোনালি রঙের, স্বাদে মিষ্টি ও মোলায়েম।',x:[['কেন এই মধু জমে যায়?','সরিষা ফুলের মধুতে গ্লুকোজের পরিমাণ তুলনামূলক বেশি। তাই ঠান্ডায় এটি দ্রুত দানা বেঁধে নরম, সাদাটে ক্রিম-জাতীয় রূপ নেয়। এটি মধুর প্রাকৃতিক ধর্ম, জমলেই ভেজাল নয়।'],['স্বাদ','মৃদু মিষ্টি, সামান্য ঝাঁঝালো আভা থাকতে পারে। ক্রিমি গড়ন অনেকেই রুটিতে মাখিয়ে খেতে পছন্দ করেন।'],['ব্যবহার','রুটি, পরোটা বা টোস্টে মাখিয়ে, দুধে মিশিয়ে অথবা কুসুম গরম পানির সাথে নিতে পারেন।']],t:['জমে গেলে ৪০°C-এর নিচের হালকা গরম পানিতে জার ভিজিয়ে রাখুন।','রোদে বা সরাসরি আগুনে গরম করবেন না।','শুকনো চামচ ব্যবহার করুন।'],f:[['জমে গেলে কি নষ্ট হয়েছে?','না, এটি স্বাভাবিক ক্রিস্টালাইজেশন।'],['কতদিন ভালো থাকে?','সঠিকভাবে রাখলে অনেক মাস ভালো থাকে; প্যাকেটে দেওয়া মেয়াদ দেখুন।']]},
'লিচু ফুলের মধু':{h:'লিচু ফুলের মধু: হালকা রং ও ফলের মতো মিষ্টি ঘ্রাণ',s:'লিচু গাছের ফুল থেকে সংগৃহীত হালকা রঙের মধু। মিষ্টি, সুগন্ধি ও মোলায়েম স্বাদের জন্য অনেকের প্রিয়।',i:'বসন্তের শেষে লিচু গাছে ফুল আসে। মৌমাছিরা সেই ফুলের রস থেকে যে মধু তৈরি করে তা হালকা রঙের এবং ফুলের মতো সুগন্ধযুক্ত হয়।',x:[['স্বাদ ও রং','হালকা সোনালি থেকে প্রায় স্বচ্ছ রং, মোলায়েম মিষ্টি স্বাদ এবং ফলের মতো ঘ্রাণ — যারা কড়া স্বাদ পছন্দ করেন না, তাদের জন্য ভালো।'],['কখন সংগ্রহ হয়','সাধারণত মার্চ–এপ্রিল মাসে লিচুর মৌসুমে। সংগ্রহের স্থান ও সময় পণ্যের "বিস্তারিত" অংশে দেখুন।'],['ব্যবহার','সরাসরি চামচে, চায়ে, দইয়ে, ফলের সালাদে বা পানীয়তে মিশিয়ে খাওয়া যায়।']],t:['ঢাকনা আঁটা কাচের জারে রাখুন।','রোদ থেকে দূরে রাখুন।','জমে গেলে হালকা গরম পানিতে তরল করুন।'],f:[['এই মধু কি খুব মিষ্টি?','মিষ্টি, তবে মোলায়েম; তীব্র ঝাঁঝ থাকে না।'],['ফ্রিজে রাখা যাবে?','দরকার নেই; ঠান্ডা ঘরের তাপমাত্রায় রাখলেই চলে। ফ্রিজে রাখলে দ্রুত জমতে পারে।']]},
'কালোজিরা ফুলের মধু':{h:'কালোজিরা ফুলের মধু: গাঢ় রং, ঘন গড়ন ও হালকা ঝাঁজ',s:'কালোজিরা ফুলের মধু সাধারণত গাঢ় বাদামি, ঘন ও সুগন্ধি। মিষ্টির সাথে হালকা ঝাঁজ ও সামান্য তিতকুটে আভা এর বৈশিষ্ট্য।',i:'কালোজিরা বা নাইজেলা গাছের ফুল থেকে সংগৃহীত এই মধু অন্য ফুলের মধু থেকে আলাদা স্বাদের। যারা একটু গাঢ় ও ঝাঁজালো স্বাদ পছন্দ করেন, তাদের কাছে এটি বিশেষ জনপ্রিয়।',x:[['স্বাদ কেমন?','রং গাঢ় বাদামি, ঘনত্ব বেশি। মিষ্টির সাথে হালকা ঝাঁজ থাকে এবং গলায় সামান্য ঝাঁজ লাগতে পারে — এটাই এই মধুর বৈশিষ্ট্য।'],['জমে যাওয়া','শীতে এই মধু সহজে জমে যেতে পারে। এটি প্রাকৃতিক প্রক্রিয়া।'],['ব্যবহার','সকালে সরাসরি এক চা-চামচ, কুসুম গরম পানিতে বা আদা-চায়ে মিশিয়ে নিতে পারেন।']],t:['শুকনো ও পরিষ্কার চামচ ব্যবহার করুন।','জারের মুখ ভালো করে বন্ধ রাখুন।','সরাসরি রোদে রাখবেন না।'],f:[['গলায় ঝাঁজ লাগে কেন?','কালোজিরা ফুলের মধুর স্বাভাবিক বৈশিষ্ট্য এটি।'],['কাদের জন্য ভালো?','যারা গাঢ় ও বৈশিষ্ট্যপূর্ণ স্বাদ পছন্দ করেন। কোনো রোগের চিকিৎসা হিসেবে নয়; স্বাস্থ্য-সমস্যা থাকলে চিকিৎসকের পরামর্শ নিন।']]},
'বরই ফুলের মধু':{h:'বরই (কুল) ফুলের মধু: মিষ্টি ও মৃদু ক্যারামেল স্বাদ',s:'বরই বা কুল গাছের ফুল থেকে সংগৃহীত মধু। মাঝারি রঙের, মিষ্টি ও মৃদু ক্যারামেলের মতো স্বাদ।',i:'বরই গাছ শুষ্ক ও আধা-শুষ্ক এলাকায় ভালো জন্মায়। এর ছোট ফুল মৌমাছির প্রিয়, আর সেই ফুল থেকে পাওয়া মধু সুগন্ধি ও মধ্যম ঘনত্বের হয়।',x:[['স্বাদ ও ঘ্রাণ','মধ্যম সোনালি-বাদামি রং, মিষ্টি স্বাদের সাথে হালকা ক্যারামেল আভা পাওয়া যায়।'],['মৌসুম','বরই গাছে সাধারণত শীতের আগে-পরে ফুল আসে। সঠিক সংগ্রহের সময় প্রতিটি ব্যাচের "বিস্তারিত"-এ দেখুন।'],['ব্যবহার','দুধ, চা, দই বা সরাসরি খাওয়া যায়; ঘরোয়া পানীয়তেও মানায়।']],t:['ঠান্ডা, শুকনো জায়গায় রাখুন।','রোদ ও গরম থেকে দূরে রাখুন।','জারের ঢাকনা সবসময় শক্ত করে বন্ধ রাখুন।'],f:[['বরই মধু জমে কি?','হ্যাঁ, ঠান্ডায় দানা বাঁধতে পারে; হালকা গরম পানিতে আবার তরল হয়।'],['রং এক এক ব্যাচে আলাদা কেন?','ফুল ও মৌসুম ভেদে প্রাকৃতিক মধুর রং পরিবর্তন হয়।']]},
'মিশ্র ফুলের মধু':{h:'মিশ্র ফুলের মধু: নানা ফুলের স্বাদ এক জারে',s:'বিভিন্ন ফুলের রস থেকে মৌমাছির তৈরি মধু। প্রতিটি ব্যাচে স্বাদ ও রং কিছুটা আলাদা হতে পারে।',i:'মিশ্র ফুলের মধু বা মাল্টিফ্লোরাল মধু তৈরি হয় যখন মৌমাছিরা একাধিক ফুল থেকে রস সংগ্রহ করে। তাই এর স্বাদ সময় ও অঞ্চলভেদে বদলায়।',x:[['স্বাদ','সাধারণত সুষম মিষ্টি ও মোলায়েম; কোনো একটি ফুলের ঘ্রাণ আলাদাভাবে প্রকট নাও হতে পারে।'],['কেন ব্যাচ ভেদে আলাদা?','কোন মৌসুমে কোন ফুল ফুটেছে তার ওপর মধুর রং, স্বাদ ও ঘনত্ব নির্ভর করে — এটি প্রাকৃতিক বৈচিত্র্য।'],['ব্যবহার','প্রতিদিনের ব্যবহারের জন্য সাশ্রয়ী ও বহুমুখী; খাবার, পানীয় ও বেকিংয়ে ব্যবহার করা যায়।']],t:['কাচের জারে ঢাকনা এঁটে রাখুন।','ফ্রিজের বাইরে ঠান্ডা স্থানে রাখুন।'],f:[['দাম কি তুলনামূলক কম?','সাধারণত একক ফুলের মধুর চেয়ে কম হয়।'],['কোন মধু আমার জন্য?','দৈনন্দিন ব্যবহারে মিশ্র ফুল, আর নির্দিষ্ট স্বাদ চাইলে একক ফুলের মধু বেছে নিন।']]},
'সুন্দরবনের বুনো চাকের মধু':{h:'সুন্দরবনের বুনো চাকের মধু: মৌয়ালদের সংগ্রহ করা বনের মধু',s:'সুন্দরবনের গাছ থেকে বুনো মৌমাছির খোলা চাক ভেঙে সংগ্রহ করা মধু। স্বাদে হালকা টক-মিষ্টি ও বনের গন্ধ পাওয়া যায়।',i:'সুন্দরবনের মৌয়ালরা প্রতি বছর নির্দিষ্ট সময়ে বনে গিয়ে বুনো মৌমাছির (Apis dorsata) বিশাল খোলা চাক থেকে মধু সংগ্রহ করেন। এটি অত্যন্ত ঝুঁকিপূর্ণ ও ঐতিহ্যবাহী কাজ।',x:[['কীভাবে সংগ্রহ হয়','মৌয়ালরা বনের ভেতর গাছের ডালে ঝোলানো চাক খুঁজে ধোঁয়া দিয়ে মৌমাছিদের সরিয়ে চাক কেটে নেন। তারপর চাক চিপে মধু আলাদা করা হয়।'],['স্বাদ ও গড়ন','সাধারণত একটু পাতলা, হালকা টক-মিষ্টি স্বাদ ও বনের বৈশিষ্ট্যপূর্ণ ঘ্রাণ থাকে। কখনো সামান্য ধোঁয়াটে আভাও থাকতে পারে।'],['কেন বিশেষ','এই মধুর উৎস বন, ফুল ও মৌসুমের ওপর নির্ভরশীল। তাই প্রতিটি ব্যাচ প্রাকৃতিকভাবে কিছুটা আলাদা হয়।']],t:['ঠান্ডা স্থানে, ঢাকনা এঁটে রাখুন।','পাতলা মধু দ্রুত গাঁজতে পারে তাই বেশি দিন খোলা রাখবেন না।','ফ্রিজে না রাখাই ভালো।'],f:[['এই মধু পাতলা কেন?','বুনো চাকের মধুতে আর্দ্রতা তুলনামূলক বেশি থাকতে পারে।'],['কতদিনের মধ্যে খাওয়া ভালো?','প্যাকেটে দেওয়া মেয়াদ দেখুন এবং খোলার পর দ্রুত ব্যবহার করুন।']]},
'সুন্দরবনের খলিশা ফুলের মধু':{h:'খলিশা ফুলের মধু: সুন্দরবনের সোনালি ও মোলায়েম মধু',s:'সুন্দরবনের খলিশা ম্যানগ্রোভ গাছের ফুল থেকে সংগৃহীত মধু। হালকা সোনালি রঙের, মিষ্টি ও মোলায়েম সুগন্ধের।',i:'খলিশা সুন্দরবনের পরিচিত ম্যানগ্রোভ গাছ, সাধারণত এপ্রিল–মে মাসে এতে ফুল ফোটে। এই ফুলের মধু সুন্দরবনের সবচেয়ে পরিচিত মধুগুলোর একটি।',x:[['স্বাদ ও রং','হালকা সোনালি রং, মোলায়েম মিষ্টি স্বাদ ও মনোরম সুগন্ধ। অতিরিক্ত ঝাঁঝ থাকে না।'],['কেন জনপ্রিয়','এর নরম স্বাদ বয়স্ক ও ছোট (এক বছরের উপরে) সবার কাছেই সহজে গ্রহণযোগ্য।'],['ব্যবহার','চা, দুধ, দই, ফলের সাথে কিংবা সরাসরি খাওয়া যায়।']],t:['ঢাকনা আঁটা জারে রাখুন।','সরাসরি রোদ লাগাবেন না।','জমে গেলে হালকা গরম পানিতে জার ভিজিয়ে তরল করুন।'],f:[['সুন্দরবনের অন্য মধুর সাথে পার্থক্য কী?','ফুল ও মৌসুম ভেদে স্বাদ ও রং আলাদা; খলিশা ফুলের মধু সাধারণত মোলায়েম ও হালকা রঙের।'],['সংগ্রহের সময় জানব কীভাবে?','পণ্য পেজের "বিস্তারিত" অংশে দেখুন।']]},
'আজওয়া খেজুর':{h:'আজওয়া খেজুর: মদিনার নরম ও কালচে খেজুরের পরিচয়',s:'মদিনার জনপ্রিয় নরম, কালচে ও কম আঠালো খেজুর। মিষ্টি কম, স্বাদ মোলায়েম ও সামান্য ক্যারামেল-সদৃশ।',i:'আজওয়া সৌদি আরবের মদিনা অঞ্চলের বিখ্যাত খেজুর। এটি ইসলামী ঐতিহ্যে বিশেষভাবে সম্মানিত হিসেবে পরিচিত এবং সারা বিশ্বে জনপ্রিয়।',x:[['স্বাদ ও গড়ন','গাঢ় বাদামি থেকে প্রায় কালো, নরম অথচ কম আঠালো। বিচি ছোট এবং স্বাদ মোলায়েম মিষ্টি।'],['কেন পছন্দ করেন অনেকে','ইফতার, সেহরি বা দৈনন্দিন নাস্তা হিসেবে খেজুর অনেকেরই প্রিয়। আজওয়া উপহার হিসেবেও জনপ্রিয়।'],['কীভাবে খাবেন','সরাসরি, দুধের সাথে, স্মুদিতে, বা মিষ্টান্নের পরিবর্তে ব্যবহার করতে পারেন।']],t:['ঠান্ডা, শুকনো স্থানে রাখুন।','বেশিদিন রাখতে বায়ুরোধী কৌটায় ফ্রিজে রাখুন।','ভেজা হাতে ধরবেন না।'],f:[['আজওয়া খেজুর কি খুব মিষ্টি?','অন্য কিছু জাতের তুলনায় মোলায়েম মিষ্টি।'],['ডায়াবেটিস থাকলে খেতে পারব?','চিকিৎসকের পরামর্শ অনুযায়ী পরিমাণ ঠিক করুন।']]},
'মেডজুল খেজুর':{h:'মেডজুল খেজুর: বড় আকারের রসালো খেজুর',s:'বড় আকারের, নরম ও রসালো খেজুর; মধুর মতো মিষ্টি ও ক্যারামেলের মতো স্বাদের জন্য পরিচিত।',i:'মেডজুল (Medjool) খেজুরকে অনেক সময় "খেজুরের রাজা" বলা হয়। এটি আকারে বড়, মাংসল এবং স্বাদে সমৃদ্ধ।',x:[['স্বাদ ও গড়ন','গাঢ় বাদামি, চামড়া সামান্য কুঁচকানো, ভেতরটা নরম ও মাংসল। মিষ্টি বেশি ও ক্যারামেলের মতো আভা থাকে।'],['ব্যবহার','সরাসরি খাওয়া ছাড়াও বাদাম বা পনির ভরে, স্মুদি, মিষ্টি বা কেকে ব্যবহার করা যায়।'],['কেন একটু দামি','আকার বড় ও ফলন তুলনামূলক কম হওয়ায় এটি সাধারণত অন্য জাতের চেয়ে দামি হয়।']],t:['ফ্রিজে রাখলে নরম থাকে বেশিদিন।','শুকনো, পরিষ্কার হাতে নিন।','দিনে ১–২টি দিয়ে শুরু করুন।'],f:[['চামড়া কুঁচকানো কেন?','স্বাভাবিক; এতে খেজুর খারাপ হয়নি।'],['কীভাবে সবচেয়ে ভালো লাগে?','হালকা ঠান্ডা অবস্থায় বাদাম ভরে খেলে অনেকেই পছন্দ করেন।']]},
'সুক্কারী খেজুর':{h:'সুক্কারী খেজুর: সোনালি মিষ্টি ও মুখে গলে যাওয়া স্বাদ',s:'সোনালি-বাদামি, মিষ্টি ও নরম খেজুর যা মুখে গলে যায়। আরবিতে "সুক্কারী" অর্থ চিনির মতো মিষ্টি।',i:'সুক্কারী সৌদি আরবের কাসিম অঞ্চলের জনপ্রিয় খেজুর। এর মিষ্টি স্বাদ ও নরম গড়ন অনেকের পছন্দ।',x:[['স্বাদ ও গড়ন','সোনালি থেকে হালকা বাদামি রং, মিষ্টি ও মোলায়েম। কিছু সুক্কারী খেজুর কিছুটা ভঙ্গুর বা দানাদার হয়ে থাকে।'],['কীভাবে খাবেন','সরাসরি, চায়ের সাথে বা মিষ্টির বিকল্প হিসেবে।'],['সংরক্ষণ','শুকনো স্থানে রেখে ফ্রিজে বায়ুরোধী পাত্রে রাখলে বেশিদিন ভালো থাকে।']],t:['আর্দ্রতা থেকে দূরে রাখুন।','দীর্ঘ সময়ের জন্য ফ্রিজে রাখুন।'],f:[['এটি কি খুব মিষ্টি?','হ্যাঁ, অনেকের কাছে অন্য জাতের চেয়ে বেশি মিষ্টি মনে হয়।'],['পিঁপড়া ধরতে পারে?','খোলা অবস্থায় রাখলে ধরতে পারে; ঢাকনা এঁটে রাখুন।']]},
'গাওয়া ঘি':{h:'গাওয়া ঘি: খাঁটি ঘির ঘ্রাণ, দানা ও ব্যবহার',s:'গরুর দুধের সর বা মাখন জ্বাল দিয়ে তৈরি ঐতিহ্যবাহী ঘি। স্বাভাবিক সুগন্ধ ও দানাদার গড়ন এর বৈশিষ্ট্য।',i:'গাওয়া ঘি বাংলাদেশের ঐতিহ্যবাহী খাবারের অবিচ্ছেদ্য অংশ। খিচুড়ি, পোলাও, হালুয়া বা ভাতের সাথে এর ঘ্রাণ আলাদা স্বাদ যোগ করে।',x:[['দানা বাঁধে কেন?','ঘিতে নানা ধরনের চর্বি-অণু থাকে। ঠান্ডায় এগুলো আলাদা হয়ে জমে দানা তৈরি করে — এটি স্বাভাবিক, খাঁটি ঘিতেই সাধারণত এটি হয়।'],['রান্নায় ব্যবহার','ভাজা, ভুনা, পোলাও, খিচুড়ি, হালুয়া ও পরোটায় ব্যবহার হয়। গরম ভাতের সাথে সামান্য ঘি অনেকেরই প্রিয়।'],['পরিমাণ','ক্যালরি বেশি, তাই পরিমিত খাওয়াই ভালো; স্বাস্থ্যগত সীমাবদ্ধতা থাকলে চিকিৎসকের পরামর্শ নিন।']],t:['সবসময় শুকনো চামচ ব্যবহার করুন।','ঢাকনা এঁটে ঠান্ডা, অন্ধকার জায়গায় রাখুন।','টকটক গন্ধ বা অস্বাভাবিক রং হলে খাবেন না।'],f:[['ফ্রিজে রাখা কি জরুরি?','না; ঠান্ডা, শুকনো স্থানে ঢাকনা এঁটে রাখলেই চলে।'],['ঘি জমে গেলে কী করব?','হালকা গরম পানিতে জার ভিজিয়ে তরল করে নিন।']]},
'ঘানি ভাঙা সরিষার তেল':{h:'ঘানি ভাঙা সরিষার তেল: ঝাঁঝ, ঘ্রাণ ও ব্যবহার',s:'ঘানিতে ধীরে সরিষা পিষে বের করা তেল। রিফাইন করা হয় না, তাই ঝাঁঝ ও ঘ্রাণ স্বাভাবিকভাবে বেশি।',i:'ঘানি ভাঙা তেল ঐতিহ্যবাহী পদ্ধতিতে কাঠের বা ধাতব ঘানিতে সরিষা পিষে তৈরি হয়। বাঙালির ভর্তা, মাছ-ভাজা ও আচারে এর ঝাঁঝালো স্বাদ অপরিহার্য।',x:[['ঝাঁঝ বেশি কেন?','ঘানিতে ধীরে চাপ দিয়ে তেল বের করা হয় এবং রিফাইন করা হয় না — তাই সরিষার প্রাকৃতিক ঝাঁঝ ও ঘ্রাণ অটুট থাকে।'],['রান্নায় ব্যবহার','রান্নার আগে তেল একটু গরম করে ধোঁয়া উঠলে নামিয়ে ঠান্ডা করে নিলে ঝাঁঝ কমে ও রান্নায় ভালো স্বাদ আসে।'],['কোথায় সবচেয়ে মানায়','ভর্তা, ঝোল, মাছ ভাজা, আচার ও সবজি রান্নায়।']],t:['আলো ও গরম থেকে দূরে রাখুন।','ঢাকনা শক্ত করে আটকান।','শুকনো পাত্র ব্যবহার করুন।'],f:[['তেল গাঢ় রঙের কেন?','অপরিশোধিত তেলের প্রাকৃতিক রং এমনই হয়।'],['ঝাঁঝ কমানোর উপায়?','তেল প্রথমে গরম করে ঠান্ডা করে নিন।']]},
'খাঁটি নারকেল তেল':{h:'খাঁটি নারকেল তেল: জমে যাওয়া, ব্যবহার ও সংরক্ষণ',s:'নারকেল থেকে প্রাকৃতিকভাবে সংগৃহীত তেল। প্রায় ২৪–২৫°C-এর নিচে জমে সাদা হয় এবং গরমে আবার তরল হয়।',i:'নারকেল তেল রান্না, চুল ও ত্বকের যত্নে বহুল ব্যবহৃত। এর হালকা নারকেলের ঘ্রাণ এবং স্থিতিশীল গঠন এটিকে জনপ্রিয় করেছে।',x:[['শীতে জমে কেন?','নারকেল তেলে স্যাচুরেটেড ফ্যাট বেশি, তাই তাপমাত্রা প্রায় ২৪–২৫°C-এর নিচে নামলে তা স্বাভাবিকভাবেই জমে যায়। জমা মানে ভেজাল নয়।'],['রান্নায়','ভাজা, ভুনা ও দক্ষিণ এশীয় নানা পদে ব্যবহার করা যায়। মৃদু নারকেলের ঘ্রাণ রান্নায় আলাদা স্বাদ আনে।'],['চুল ও ত্বকে','অনেকে চুলে তেল হিসেবে বা ত্বক নরম রাখতে ব্যবহার করেন। নতুন কিছু ব্যবহারের আগে সামান্য অংশে পরীক্ষা করে নিন।']],t:['জমে গেলে হালকা গরম পানিতে বোতল ভিজিয়ে রাখুন।','ঢাকনা আঁটা পাত্রে ঠান্ডা স্থানে রাখুন।'],f:[['তেল জমে সাদা হয়ে গেছে, ঠিক আছে?','হ্যাঁ, এটি স্বাভাবিক।'],['কতদিন ভালো থাকে?','প্যাকেটের মেয়াদ দেখুন; সঠিকভাবে রাখলে অনেক মাস ভালো থাকে।']]},
'আপেল সিডার ভিনেগার':{h:'আপেল সিডার ভিনেগার: কীভাবে খাবেন ও কী সতর্কতা',s:'আপেলের রস গাঁজিয়ে তৈরি ভিনেগার। সালাদ ড্রেসিং, রান্না ও পানিতে মিশিয়ে ব্যবহারযোগ্য।',i:'আপেল সিডার ভিনেগার (ACV) আপেলের রস প্রথমে অ্যালকোহল এবং পরে অ্যাসিটিক অ্যাসিডে গাঁজিয়ে তৈরি হয়। অনেকেই এটি সালাদ ও পানীয়তে ব্যবহার করেন।',x:[['ঘোলা "মা" কী?','প্রাকৃতিক, ফিল্টার না করা ভিনেগারের তলায় ঘোলা সুতার মতো যে অংশ জমে তাকে "মা" (mother) বলা হয়। এটি স্বাভাবিক, ক্ষতিকর নয়।'],['কীভাবে খাবেন','সরাসরি নয় — এক গ্লাস পানিতে ১–২ চা-চামচ মিশিয়ে নিন। সালাদে অলিভ অয়েল ও লেবুর সাথে ড্রেসিং বানাতেও পারেন।'],['সতর্কতা','অম্লীয়, তাই সরাসরি খেলে দাঁতের এনামেল ও গলা ক্ষতিগ্রস্ত হতে পারে। গ্যাস্ট্রিক বা অন্য সমস্যা থাকলে চিকিৎসকের পরামর্শ নিন।']],t:['খাওয়ার পর পানি দিয়ে কুলি করুন।','ঢাকনা শক্ত করে বন্ধ রাখুন।','শিশুদের নাগালের বাইরে রাখুন।'],f:[['এটা কি ওজন কমায়?','কোনো ম্যাজিক সমাধান নয়; সুষম খাবার ও ব্যায়ামের সাথে সহায়ক হতে পারে বলে কেউ কেউ মনে করেন। নিশ্চিত হতে চিকিৎসকের পরামর্শ নিন।'],['ফ্রিজে রাখতে হবে?','না, ঠান্ডা, শুকনো স্থানেই চলবে।']]},
'কাজু বাদাম':{h:'কাজু বাদাম: স্বাদ, পুষ্টি ও কীভাবে খাবেন',s:'নরম, ক্রিমি ও হালকা মিষ্টি স্বাদের কাজু বাদাম। সরাসরি, রান্নায় বা মিষ্টান্নে ব্যবহার করা যায়।',i:'কাজু বাদাম গাছের ফলের নিচে ঝুলে থাকা বীজ। এর ক্রিমি গড়ন ও মোলায়েম স্বাদ রান্না ও নাস্তা দুই ক্ষেত্রেই জনপ্রিয়।',x:[['স্বাদ ও গড়ন','হালকা মিষ্টি ও দুধের মতো ক্রিমি স্বাদ। ভাজলে বা হালকা সেঁকলে ঘ্রাণ আরও ফোটে।'],['কীভাবে খাবেন','সরাসরি নাস্তা হিসেবে, পোলাও-বিরিয়ানিতে, কোরমা বা মিষ্টান্নে, কিংবা বেটে গ্রেভির ঘনত্ব বাড়াতে।'],['পরিমাণ','দিনে এক মুঠো (প্রায় ২৫–৩০ গ্রাম) যথেষ্ট। ক্যালরি বেশি, তাই পরিমিত খান।']],t:['বায়ুরোধী কৌটায় ঠান্ডা জায়গায় রাখুন।','বাদামে অ্যালার্জি থাকলে এড়িয়ে চলুন।'],f:[['কাজু কি কাঁচা খাওয়া যায়?','প্যাকেটে লেখা অনুযায়ী খান; প্রক্রিয়াজাত কাজু সাধারণত খাওয়ার জন্য প্রস্তুত থাকে।'],['কতদিন ভালো থাকে?','প্যাকেটের মেয়াদ দেখুন; ভালোভাবে রাখলে কয়েক মাস।']]},
'কাঠবাদাম (আমন্ড)':{h:'কাঠবাদাম (আমন্ড): কীভাবে খাবেন ও কত খাবেন',s:'মচমচে ও হালকা মিষ্টি স্বাদের কাঠবাদাম। ভিজিয়ে, সেঁকে বা সরাসরি খাওয়া যায়।',i:'কাঠবাদাম বা আমন্ড স্বাস্থ্যসচেতন অনেকের নিয়মিত নাস্তা। এটি ভিজিয়ে খাওয়া, দুধে মেশানো, কিংবা মিষ্টান্নে ব্যবহার করা যায়।',x:[['স্বাদ','মচমচে গড়ন ও মৃদু মিষ্টি স্বাদ। ভিজিয়ে খোসা ছাড়ালে নরম হয়।'],['কীভাবে খাবেন','রাতে ভিজিয়ে সকালে খাওয়া অনেকের অভ্যাস। সালাদ, ওটস, দই বা স্মুদিতেও মেশানো যায়।'],['পরিমাণ','দিনে ৫–১০টি অনেকের জন্য যথেষ্ট; কত খাওয়া ঠিক তা নিজের শরীর ও চিকিৎসকের পরামর্শে ঠিক করুন।']],t:['বায়ুরোধী কৌটায় রাখুন।','আর্দ্রতা ও গরম থেকে দূরে রাখুন।'],f:[['ভিজিয়ে খাওয়া কি ভালো?','ভিজিয়ে খেলে নরম হয় ও চিবানো সহজ হয়; এটি ব্যক্তিগত পছন্দ।'],['সবাই কি খেতে পারে?','বাদামে অ্যালার্জি থাকলে একেবারেই নয়।']]},
'মিক্সড বাদাম':{h:'মিক্সড বাদাম: এক প্যাকে নানা স্বাদ',s:'কাজু, আমন্ড ও অন্যান্য বাদামের মিশ্রণ। নাস্তা ও উপহারের জন্য সুবিধাজনক।',i:'মিক্সড বাদাম একসাথে নানা স্বাদ ও গড়ন পাওয়ার সহজ উপায়। অফিস, স্কুল বা ভ্রমণে এটি নেওয়ার জন্য ভালো।',x:[['কী কী থাকে','সাধারণত কাজু, আমন্ড, কিশমিশ ও অন্য বাদামের মিশ্রণ। উপাদানের অনুপাত প্যাক ভেদে সামান্য আলাদা হতে পারে।'],['কখন খাবেন','সকালের নাস্তা, বিকেলের স্ন্যাকস বা ভ্রমণে নিতে পারেন।'],['পরিমাণ','এক মুঠো যথেষ্ট; ক্যালরি বেশি থাকায় পরিমিত খান।']],t:['বায়ুরোধী কৌটায় রাখুন।','আর্দ্রতা থেকে দূরে রাখুন।'],f:[['অ্যালার্জি থাকলে কী করব?','প্যাকের উপাদান তালিকা দেখে নিন; অ্যালার্জি থাকলে এড়ান।'],['উপহার হিসেবে দেওয়া যাবে?','হ্যাঁ, বড় প্যাক উপহারের জন্য জনপ্রিয়।']]},
'হানি নাটস (মধু-বাদাম)':{h:'হানি নাটস: মধুতে ডোবানো বাদামের মজা',s:'বাদাম ও মধুর একসাথে মিশ্রণ; মচমচে ও মিষ্টি স্বাদের একসাথে পাওয়া যায়।',i:'হানি নাটস মধুর ভেতরে বাদাম ডুবিয়ে রাখা হয়। এতে বাদামের মচমচে ভাব ও মধুর মিষ্টি দুই স্বাদ পাওয়া যায়।',x:[['কীভাবে খাবেন','সরাসরি চামচে, রুটি বা টোস্টে মাখিয়ে, দইয়ের সাথে বা ওটসের ওপর ছিটিয়ে।'],['স্বাদ','মধুর মিষ্টি ও বাদামের মচমচে স্বাদের মিলন; সময়ের সাথে বাদাম একটু নরম হতে পারে।'],['সতর্কতা','মধু থাকায় ১ বছরের কম বয়সী শিশুকে দেবেন না। বাদামে অ্যালার্জি থাকলে এড়ান।']],t:['ঢাকনা আঁটা জারে রাখুন।','শুকনো চামচ ব্যবহার করুন।'],f:[['মধু জমে গেলে?','হালকা গরম পানিতে জার ভিজিয়ে নিন।'],['কতদিন ভালো থাকে?','প্যাকেটের মেয়াদ দেখুন।']]},
'হলুদের গুঁড়া':{h:'হলুদের গুঁড়া: রং, ঘ্রাণ ও রান্নায় সঠিক ব্যবহার',s:'রান্নায় রং ও ঘ্রাণ আনতে হলুদের গুঁড়া অপরিহার্য। গাঢ় হলুদ রং ও নিজস্ব সুগন্ধ ভালো হলুদের লক্ষণ।',i:'হলুদ বাঙালির প্রতিদিনের রান্নার মূল উপাদান। ভালো হলুদের রং গাঢ় ও ঘ্রাণ সতেজ হয়।',x:[['ভালো হলুদ চিনবেন কীভাবে','রং গাঢ় সোনালি-হলুদ, ঘ্রাণ তাজা, গুঁড়া মসৃণ — অতিরিক্ত কৃত্রিম উজ্জ্বল রং থাকলে সন্দেহ করুন।'],['রান্নায় কখন দেবেন','মাছ-মাংস মাখানোর সময় ও রান্নার শুরুতে তেলে অল্প ভেজে নিলে ঘ্রাণ ফোটে। বেশি পুড়ে গেলে তেতো হয়।'],['কীভাবে রাখবেন','বায়ুরোধী কৌটায় আলো-আর্দ্রতা থেকে দূরে রাখলে রং ও ঘ্রাণ বেশিদিন থাকে।']],t:['শুকনো চামচ ব্যবহার করুন।','চুলার কাছে রাখবেন না।'],f:[['রং কালচে কেন?','পুরনো হলে বা আর্দ্রতা পেলে রং কমে যায়।'],['কতদিন ব্যবহার করা যায়?','প্যাকেটের মেয়াদ ও সংরক্ষণের ওপর নির্ভর করে।']]},
'মরিচের গুঁড়া':{h:'মরিচের গুঁড়া: ঝাল, রং ও সঠিক সংরক্ষণ',s:'রান্নায় ঝাল ও লাল রং আনার প্রধান মসলা। শুকনো মরিচ পিষে তৈরি।',i:'মরিচের গুঁড়ার ঝাল আসে ক্যাপসাইসিন নামক উপাদান থেকে। জাতের ওপর নির্ভর করে ঝাল ও রঙের তারতম্য হয়।',x:[['ঝাল ও রং','কিছু মরিচের রং গাঢ় কিন্তু ঝাল কম, কিছুতে ঝাল বেশি। তাই পছন্দমতো ব্যবহার করুন।'],['রান্নায়','মাংস, ডাল, ভর্তা ও আচারে ব্যবহার করা হয়। বেশি তেলে পুড়িয়ে ফেললে তেতো হয়।'],['সংরক্ষণ','আর্দ্রতা মরিচের গুঁড়ায় ছত্রাক ধরাতে পারে; তাই বায়ুরোধী, শুকনো কৌটা ব্যবহার করুন।']],t:['শুকনো চামচ ব্যবহার করুন।','অল্প অল্প করে কিনুন।'],f:[['ঝাল কম করতে কী করব?','পরিমাণ কমান বা অল্প টক দই যোগ করুন।'],['চোখে লাগলে?','পরিষ্কার পানি দিয়ে ধুয়ে নিন।']]},
'ধনিয়ার গুঁড়া':{h:'ধনিয়ার গুঁড়া: সুগন্ধ ও রান্নায় সঠিক ব্যবহার',s:'ধনিয়া বীজ পিষে তৈরি মোলায়েম সুগন্ধি মসলা। ঝোল ও ভুনায় মিষ্টি-লেবুর মতো সুবাস দেয়।',i:'ধনিয়ার গুঁড়া অন্য মসলার ঝাঁঝ সামলে রান্নায় ভারসাম্য আনে।',x:[['স্বাদ ও ঘ্রাণ','মৃদু সাইট্রাস-মিষ্টি সুবাস। ঝালের সাথে মিশলে রান্না মোলায়েম হয়।'],['কোথায় ব্যবহার করবেন','মাছ-মাংসের ঝোল, ডাল, সবজি, কোরমা ও ভর্তায়।'],['কীভাবে রাখবেন','বায়ুরোধী কৌটায় আলো থেকে দূরে রাখুন।']],t:['তেলে অল্প নেড়ে দিলে ঘ্রাণ বাড়ে।','ভেজা চামচ ব্যবহার করবেন না।'],f:[['ঘ্রাণ কমে গেছে কেন?','পুরনো হলে বা খোলা রাখলে ঘ্রাণ কমে যায়।'],['ভেজে নেওয়া দরকার?','না; তবে অল্প ভেজে নিলে স্বাদ বাড়ে।']]},

/* ---------- ব্লগ ---------- */
const BL={c:'',s:'',cache:null};
const slugMap={};
function blogSlug(cat,g){const k=cat+'|'+g;return slugMap[k]||(slugMap[k]=cat+'-'+sha256('pbblog|'+g).slice(0,6))}
function blogPostBase(g,cat){
 const P=BLOGP[g],C=CATB[cat]||CATB.other;
 if(P)return Object.assign({g,cat},P);
 return {g,cat,h:g+': পরিচিতি, ব্যবহার ও কেনার আগে জানুন',s:g+' — '+C.d.split('।')[0]+'।',i:C.d,x:[['কেন বেছে নেবেন','পণ্যের উৎস, মান ও সংরক্ষণ সম্পর্কে স্বচ্ছ তথ্য জানিয়ে আমরা আপনাকে নির্ভরযোগ্য পণ্য দিতে চেষ্টা করি। পণ্য পেজের "বিস্তারিত" অংশে সংগ্রহের তথ্য ও প্যাকিং-মেয়াদ দেখতে পারবেন।'],['কেনার আগে যা দেখবেন','প্যাকেটে তারিখ ও মেয়াদ, সিল ও লেবেল ঠিক আছে কিনা দেখুন এবং কোনো প্রশ্ন থাকলে সরাসরি আমাদের জিজ্ঞাসা করুন।']],t:C.tips,f:[['কীভাবে অর্ডার করব?','পণ্য পেজ থেকে কার্টে যোগ করে চেকআউট করুন, অথবা WhatsApp/Messenger-এ সরাসরি জানান।']]};
}
function blogPostOf(g,cat){const p=blogPostBase(g,cat),X=PX[g]||{};p.q=X.q||[];p.x=p.x.concat(X.x||[],CATM[cat]||CATM.other);return p}
const defDesc=(g,cat)=>(BLOGP[g]?BLOGP[g].s:g+' — '+(CATB[cat]||CATB.other).d.split('।')[0]+'।');
function blogAll(){return shopData().map(x=>Object.assign(blogPostOf(x.g,x.cat),{slug:blogSlug(x.cat,x.g),it:x.items.find(i=>i.avail)||x.items[0],minp:Math.min(...x.items.map(i=>i.price)),n:x.items.length}))}
function readMin(p){const t=[p.i].concat(p.x.map(a=>a[1]),p.t||[],(p.f||[]).map(a=>a[0]+a[1])).join(' ');return Math.max(1,Math.ceil(t.split(/\s+/).length/110))}
function blogCatsHTML(){
 const all=blogAll();
 return CATS.filter(c=>all.some(p=>p.cat===c[0])).map(c=>`<button class="bcat" data-act="blogCat" data-c="${c[0]}"><span class="bci">${c[2]}</span><b>${esc(c[1])}</b><small>${bn(all.filter(p=>p.cat===c[0]).length,0)}টি লেখা</small></button>`).join('');
}
function bpostCard(p){return `<button class="bpost" data-act="blogPost" data-s="${p.slug}"><span class="thumb" style="width:64px;height:64px"><img src="${groupImg(p.it)}" alt=""></span><span class="grow"><b>${esc(p.g)}</b><small>${esc(p.s)}</small><i>⏱ ${bn(readMin(p),0)} মিনিটের পড়া</i></span><em>›</em></button>`}
function blogHTML(){
 const all=blogAll(),post=BL.s?all.find(p=>p.slug===BL.s):null;
 const top=(back,lbl)=>`<div class="cphead"><b>📝 Blog</b><button data-act="${back}">${lbl}</button></div>`;
 if(post){
  const sib=all.filter(p=>p.cat===post.cat&&p.slug!==post.slug),i=all.indexOf(post),nx=all[(i+1)%all.length],pv=all[(i-1+all.length)%all.length];
  const k=esc(post.cat+'|'+post.g),cn=catName(post.cat);

const MOBILE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent||''),INAPP=/; wv\)|FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent||'');
const _wo=window.open.bind(window);
const waBiz=()=>{try{return localStorage.getItem('pb_wab')==='1'}catch(e){return false}};
function openWA(url){
 let ph='',t='';try{const u=new URL(url);ph=u.pathname.replace(/\D/g,'');t=u.searchParams.get('text')||''}catch(e){}
 const q=(ph?'phone='+ph+'&':'')+'text='+encodeURIComponent(t);
 let go='';
 if(/Android/i.test(navigator.userAgent||'')&&waBiz())go='intent://send?'+q+'#Intent;scheme=whatsapp;package=com.whatsapp.w4b;end';
 else if(!INAPP)go='whatsapp://send?'+q;
 if(!go){_wo(url,'_blank','noopener,noreferrer');return}
 let left=false;const onv=()=>{if(document.hidden)left=true};document.addEventListener('visibilitychange',onv);
 const a=document.createElement('a');a.href=go;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>{document.removeEventListener('visibilitychange',onv);if(!left&&!document.hidden)_wo(url,'_blank','noopener,noreferrer')},2200);
}
window.open=function(u,a,b){if(typeof u==='string'&&MOBILE&&/^https:\/\/wa\.me\//.test(u)){openWA(u);return null}return _wo(u,a,b)};
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a||!MOBILE)return;const h=a.getAttribute('href')||'';if(/^https:\/\/wa\.me\//.test(h)){e.preventDefault();openWA(h)}});

honey:[['খাঁটি মধু চেনার বাস্তব ও নির্ভরযোগ্য উপায়','পানিতে ফোঁটা ফেলা, আগুনে ধরা বা পিঁপড়া পরীক্ষার মতো ঘরোয়া পদ্ধতি পুরোপুরি নির্ভরযোগ্য নয় — এগুলো অনেক সময় ভুল ধারণা দেয়। সবচেয়ে নিশ্চিত উপায় হলো ল্যাব পরীক্ষা (আর্দ্রতা, HMF, ডায়াস্টেজ কার্যকলাপ ও চিনির অনুপাত) এবং বিশ্বস্ত উৎস থেকে কেনা। কেনার আগে জিজ্ঞাসা করুন: মধুটি কোন ফুলের, কোথা থেকে এবং কবে সংগ্রহ করা? উত্তর স্পষ্ট ও সহজ হলে ভরসা করা সহজ হয়। দাম বাজারের তুলনায় অস্বাভাবিক কম হলে সতর্ক হোন।'],['মধু সংরক্ষণের সঠিক নিয়ম','মধু আর্দ্রতা টানে, তাই সবসময় কাচের বা ফুড-গ্রেড জারে ঢাকনা শক্ত করে এঁটে রাখুন। ঘরের স্বাভাবিক তাপমাত্রায় ঠান্ডা, শুকনো ও অন্ধকার জায়গা সবচেয়ে ভালো। ফ্রিজে রাখলে মধু দ্রুত জমে যায়, তাই দরকার নেই। জমে গেলে জারটি ৪০°C-এর নিচের হালকা গরম পানিতে কিছুক্ষণ ভিজিয়ে রাখুন — সরাসরি আগুনে বা মাইক্রোওয়েভে গরম করবেন না, এতে স্বাদ ও গুণ নষ্ট হতে পারে। শুকনো ও পরিষ্কার চামচ ব্যবহার করুন; পানি ঢুকলে মধু গাঁজতে পারে।'],['প্রতিদিনের জীবনে মধু ব্যবহারের সহজ আইডিয়া','সকালে কুসুম গরম পানি বা লেবুর শরবতে এক চা-চামচ, রুটি-পরোটা-টোস্টে মাখিয়ে, দই বা ওটসের ওপর ছিটিয়ে, সালাদ ড্রেসিং বা মাংসের মেরিনেডে মিষ্টি যোগ করতে, কিংবা চিনির বিকল্প হিসেবে চায়ে ব্যবহার করতে পারেন। ফুটন্ত পানিতে সরাসরি মেশাবেন না; একটু ঠান্ডা হলে মেশান। দিনে ১–২ চা-চামচ অনেকের জন্য পরিমিত। মনে রাখবেন, মধুও শর্করা — ডায়াবেটিস থাকলে চিকিৎসকের পরামর্শ নিন এবং ১ বছরের কম বয়সী শিশুকে মধু দেবেন না।']],
dates:[['ভালো খেজুর কেনার সহজ গাইড','তাজা খেজুরের চামড়া সামান্য চকচকে, ভেতরটা নরম ও মাংসল হয়। অতিরিক্ত আঠালো, ভেজা-ভেজা, টক বা গাঁজানো গন্ধ থাকলে সেই খেজুর এড়িয়ে চলুন। প্যাকেটে প্যাকিং তারিখ ও মেয়াদ আছে কিনা দেখুন। পিঁপড়া বা পোকার চিহ্ন, ফাটা ও কালচে দাগ থাকলে ভালোভাবে যাচাই করুন। একই জাতের দানাগুলো কাছাকাছি আকারের হলে সাধারণত মান ভালো বোঝা যায়।'],['খেজুর সংরক্ষণ ও পরিবেশন','কম আর্দ্রতার ঠান্ডা স্থানে বায়ুরোধী কৌটায় রাখুন। দীর্ঘ সময়ের জন্য ফ্রিজে রাখলে নরম ভাব ও স্বাদ বেশিদিন থাকে; খাওয়ার ১৫ মিনিট আগে বের করে নিলে আবার নরম হয়। শুকিয়ে শক্ত হয়ে গেলে কয়েক মিনিট কুসুম গরম পানিতে ভিজিয়ে রাখলে নরম হয়। পরিবেশনে বাদাম বা ক্রিম পনির ভরে সাজালে অতিথি-আপ্যায়নেও চমৎকার মানায়।'],['খেজুর দিয়ে সহজ কয়েকটি আইডিয়া','খেজুর-বাদাম এনার্জি বল (বিচি ফেলে বাটা খেজুরে কাজু-আমন্ড মিশিয়ে), দুধ ও খেজুরের স্মুদি, ওটসের ওপর কুচি খেজুর, সেহরি বা ইফতারে দুধ-খেজুর, কিংবা মিষ্টির বিকল্প হিসেবে কেক-পুডিংয়ে বাটা খেজুর ব্যবহার করতে পারেন। দিনে ২–৩টি অনেকের জন্য পরিমিত; ডায়াবেটিস বা বিশেষ খাদ্যনির্দেশনা থাকলে চিকিৎসকের পরামর্শ নিন।']],
ghee:[['খাঁটি ঘি চেনার সূচক','ভালো গাওয়া ঘির ঘ্রাণ স্বাভাবিক, মিষ্টি-মাখনের মতো; স্বাদে চিটচিটে বা তেলতেলে অনুভূতি থাকে না। ঘরের তাপমাত্রায় এটি নরম দানাদার, গরমে স্বচ্ছ সোনালি তরল। কৃত্রিম রং বা কড়া সুবাস থাকলে সতর্ক হোন। কেনার সময় উৎস, তৈরির তারিখ ও মেয়াদ জানতে চান। সবচেয়ে ভালো পরীক্ষা হলো নিজের স্বাদ ও ঘ্রাণ — ঘি খাওয়ার পর গলায় অস্বাভাবিক টান বা তেতো অনুভূতি হলে ব্যবহার বন্ধ করুন।'],['রান্নায় ঘি: কোথায় সবচেয়ে ভালো','ঘির স্মোক পয়েন্ট বা ধোঁয়া ওঠার তাপমাত্রা তুলনামূলক বেশি, তাই ভাজা ও ভুনা রান্নায় এটি স্থিতিশীল থাকে। পোলাও-বিরিয়ানি, খিচুড়ি, পরোটা, হালুয়া, ডাল-তড়কা এবং সবজির ফোড়নে অল্প ঘি দিলে ঘ্রাণ ও স্বাদ বেড়ে যায়। গরম ভাতের সাথে এক চা-চামচ ঘি অনেক পরিবারের প্রিয় অভ্যাস। পরিমাণ সীমিত রাখুন, কারণ ঘি ক্যালরিসমৃদ্ধ।'],['ঘি সংরক্ষণের নিয়ম','পরিষ্কার, শুকনো কাচের জারে রাখুন এবং শুকনো চামচ ব্যবহার করুন — সামান্য আর্দ্রতাও ঘি নষ্ট করতে পারে। সরাসরি আলো ও চুলার তাপ থেকে দূরে রাখুন। ঘিয়ের জারে বারবার হাত বা ভেজা চামচ ঢোকাবেন না। সঠিকভাবে রাখলে ঘি অনেক মাস ভালো থাকে; তবে টকটক গন্ধ, ছত্রাক বা অস্বাভাবিক রঙ দেখলে ফেলে দিন।']],
oil:[['ঘানি ভাঙা বনাম রিফাইনড তেল','ঘানি ভাঙা তেলে সরিষা বা নারকেল ধীরে চাপ দিয়ে তেল বের করা হয় এবং তা ব্লিচ বা অতিরিক্ত রাসায়নিক প্রক্রিয়ায় পরিশোধিত হয় না। ফলে ঘ্রাণ, রং ও স্বাদ প্রাকৃতিকভাবে বেশি থাকে। রিফাইনড তেল সাধারণত হালকা রঙের, গন্ধহীন ও দীর্ঘস্থায়ী। কোনটি ভালো তা নির্ভর করে আপনার রান্না ও স্বাদের পছন্দের ওপর; ঐতিহ্যবাহী বাঙালি রান্নায় ঘানির তেলের জুড়ি নেই।'],['প্রতিদিনের রান্নায় তেল ব্যবহারের টিপস','তেল অতিরিক্ত গরম করে ধোঁয়া তুলবেন না, এতে স্বাদ তেতো হয় ও পুষ্টিগুণ কমে। একই তেল বারবার গরম করে ব্যবহার করা এড়িয়ে চলুন। পরিমিত তেলে রান্না করুন এবং সালাদ বা ভর্তায় কাঁচা তেল ব্যবহার করলে অল্প পরিমাণই যথেষ্ট। কোনো স্বাস্থ্যগত সীমাবদ্ধতা থাকলে চিকিৎসক বা পুষ্টিবিদের পরামর্শ নিন।'],['তেল সংরক্ষণ ও মেয়াদ','আলো ও তাপ তেলকে দ্রুত পুরনো করে ফেলে। তাই ঢাকনা শক্ত করে এঁটে ঠান্ডা, অন্ধকার জায়গায় রাখুন। ব্যবহারের আগে ঘ্রাণ দেখে নিন; টকটক বা রান্সিড (পুরনো) গন্ধ থাকলে ব্যবহার করবেন না। বড় বোতল থেকে অল্প অল্প করে ছোট বোতলে ঢেলে রাখলে বাকি তেল দীর্ঘ সময় ভালো থাকে।']],
vinegar:[['ভিনেগার ব্যবহারের ঘরোয়া আইডিয়া','সালাদ ড্রেসিংয়ে অলিভ অয়েল, লেবু ও লবণের সাথে, আচার ও পিকলে, মাংস নরম করতে মেরিনেডে, কিংবা এক গ্লাস পানিতে ১–২ চা-চামচ মিশিয়ে হালকা পানীয় হিসেবে ব্যবহার করা যায়। ঘর পরিষ্কারেও অনেকে সাদা বা আপেল সিডার ভিনেগার ব্যবহার করেন, তবে খাওয়ার জন্য কেনা ভিনেগার আলাদা রাখাই ভালো।'],['কারা সতর্ক থাকবেন','ভিনেগার অম্লীয়। গ্যাস্ট্রিক, আলসার, দাঁতের স্পর্শকাতরতা বা কিডনি সংক্রান্ত সমস্যা থাকলে এটি খাওয়ার আগে চিকিৎসকের পরামর্শ নিন। অন্য ওষুধ খেলে ভিনেগারের সাথে মিথস্ক্রিয়ার সম্ভাবনা আছে কিনা জেনে নিন। কখনোই খালি পেটে বেশি পরিমাণে বা অমিশ্রিত ভিনেগার খাবেন না।'],['ভালো ভিনেগার কেনার সময় কী দেখবেন','লেবেলে "আপেল সিডার ভিনেগার", উপাদান তালিকা, অ্যাসিডিটির শতাংশ (সাধারণত ৫%) ও মেয়াদ দেখুন। ফিল্টার না করা ভিনেগারে "মা" থাকতে পারে, যা স্বাভাবিক। ঢাকনা ঠিকমতো সিল করা আছে কিনা এবং বোতল আলো থেকে দূরে রাখা হয়েছে কিনা দেখে নিন।']],
nuts:[['সতেজ বাদাম কেনার গাইড','সতেজ বাদামে সামান্য মিষ্টি ঘ্রাণ থাকে এবং কামড়ালে মচমচে লাগে। তেল-তেল, তেতো বা টক গন্ধ হলে সেটি পুরনো হয়ে গেছে। প্যাকেটে প্যাকিং তারিখ, মেয়াদ ও সিল দেখে নিন। অপ্রয়োজনে একসাথে বেশি না কিনে ছোট প্যাকে কিনলে সবসময় সতেজ বাদাম পাওয়া যায়।'],['বাদাম দিয়ে ১০ মিনিটের স্বাস্থ্যকর নাস্তা','ওটসের ওপর কাটা বাদাম ও মধু, দইয়ের সাথে আমন্ড-কাজু, বাদাম-খেজুরের বল, সালাদে কুচি বাদাম অথবা শুকনো কড়াইতে হালকা সেঁকে অল্প লবণ ছিটিয়ে চায়ের সাথে — সবই সহজ ও সুস্বাদু আইডিয়া। এক মুঠো (২৫–৩০ গ্রাম) পরিমাণ ঠিক আছে।'],['অ্যালার্জি ও সতর্কতা','বাদামের অ্যালার্জি কখনো গুরুতর হতে পারে। পরিবারে কারও এমন সমস্যা থাকলে বাদাম বা বাদামজাত পণ্য আলাদা রাখুন। ছোট শিশুদের গোটা বাদাম দিলে গলায় আটকে যাওয়ার ঝুঁকি থাকে, তাই কুচি বা গুঁড়া করে দিন। অ্যালার্জির উপসর্গ দেখা দিলে দ্রুত চিকিৎসকের কাছে যান।']],
spice:[['ভালো গুঁড়া মসলা চেনার উপায়','তাজা গুঁড়া মসলার রং প্রাকৃতিক ও ঘ্রাণ তীব্র হয়। রং অস্বাভাবিক উজ্জ্বল, ঘ্রাণ ফ্যাকাশে বা গুঁড়ায় দানা-দানা ভেজা ভাব থাকলে সন্দেহ করুন। ঘরে সহজ পরীক্ষা: সামান্য গুঁড়া হাতের তালুতে ঘষে ঘ্রাণ নিন — ভালো মসলার ঘ্রাণ কয়েক সেকেন্ডেই ফুটে ওঠে। বিশ্বাসযোগ্য উৎস ও প্যাকিং তারিখই সবচেয়ে বড় ভরসা।'],['মসলা সংরক্ষণ ও মেয়াদ','গুঁড়া মসলার শত্রু আলো, তাপ, বাতাস ও আর্দ্রতা। বায়ুরোধী কাচের বা স্টিলের কৌটায়, চুলা ও জানালা থেকে দূরে রাখুন। শুকনো চামচ ব্যবহার করুন এবং অল্প অল্প করে কিনুন — এতে ঘ্রাণ ও রং বেশিদিন ঠিক থাকে। সাধারণত ৬–১২ মাসের মধ্যে ব্যবহার করা ভালো।'],['রান্নায় মসলা ব্যবহারের কৌশল','মসলা তেলে অল্প আঁচে নেড়ে নিলে ঘ্রাণ ফোটে, তবে পুড়ে গেলে তেতো হয়। ভেজা মসলা (পানিতে গুলে) দিলে রং ভালো আসে এবং পোড়ার ঝুঁকি কমে। পরিমাণ অল্প দিয়ে শুরু করে স্বাদ দেখে বাড়ান। বিভিন্ন মসলার মিশ্রণ রান্নায় ভারসাম্য আনে।']],
tea:[['ভালো চা চেনার উপায়','ভালো চায়ের পাতা সমান আকারের, শুকনো ও সুগন্ধি হয়। বেশি গুঁড়া, ধুলো বা ভেজা-ভেজা ভাব থাকলে মান কম হতে পারে। চা বানালে লিকারের রং পরিষ্কার ও গাঢ় হবে এবং স্বাদে সামান্য কষ ও মিষ্টি ভাব থাকবে। প্যাকেটে প্যাকিং তারিখ ও মেয়াদ দেখে নিন।'],['লিকার, দুধ চা ও আলাদা স্টাইলের পার্থক্য','লিকার চা পানি ও পাতায় তৈরি, তাই আসল স্বাদ বোঝা যায়। দুধ চায়ে পাতা একটু বেশি সময় ফুটিয়ে দুধ মেশালে ঘন ও ক্রিমি স্বাদ আসে। গরম বা ঠান্ডা — আপনার পছন্দমতো লেবু, আদা, এলাচ বা সামান্য মধু মিশিয়ে নতুন স্বাদ বানাতে পারেন।'],['চা সংরক্ষণের নিয়ম','চায়ের পাতা গন্ধ শোষণ করে, তাই মসলা বা অন্য উগ্র গন্ধের পণ্যের পাশে রাখবেন না। বায়ুরোধী কৌটায় আলো ও আর্দ্রতা থেকে দূরে রাখুন। ফ্রিজে রাখার দরকার নেই; বরং ফ্রিজের ভেজা পরিবেশ চায়ের ক্ষতি করতে পারে।']],
sweet:[['গুড় ও চিনির জাত চেনার টিপস','ভালো আখের গুড়ের রং গাঢ় সোনালি-বাদামি, স্বাদ মাটির মতো মিষ্টি ও সামান্য ক্যারামেল। অতিরিক্ত সাদা বা চকচকে রং কখনো কৃত্রিম প্রক্রিয়ার ইঙ্গিত হতে পারে। প্যাকেটে উৎস ও তৈরির মৌসুম জানতে চান। শীতকালে (খেজুর ও আখের মৌসুমে) গুড়ের স্বাদ সাধারণত বেশি ভালো হয়।'],['চিনি কমানোর সহজ অভ্যাস','চা-কফিতে চিনির পরিমাণ ধাপে ধাপে কমান, প্যাকেটজাত মিষ্টি পানীয়ের বদলে ফল ও বাড়িতে বানানো পানীয় বেছে নিন। গুড় বা ব্রাউন সুগার ব্যবহার করলেও মোট মিষ্টির পরিমাণ সীমিত রাখুন, কারণ ক্যালরি প্রায় একই থাকে। ডায়াবেটিস থাকলে চিকিৎসকের পরামর্শ অনুযায়ী চলুন।'],['সংরক্ষণ ও ব্যবহার','গুড় আর্দ্রতা টানে, তাই ঢাকনা আঁটা পাত্রে রাখুন। শক্ত হয়ে গেলে ছুরি দিয়ে কেটে বা গুঁড়া করে ব্যবহার করুন। ব্রাউন সুগার শক্ত হলে ভেজা কাপড়ে মুড়ে কয়েক ঘণ্টা রাখলে নরম হয়। পায়েস, পিঠা, চা, বেকিং — সবখানেই ব্যবহার করা যায়।']],
grain:[['ওটসের ধরন ও কোনটি কখন','রোলড ওটস সাধারণ পরিজ ও বেকিংয়ের জন্য ভালো; স্টিল-কাট ওটস বেশি সময় নেয় কিন্তু গড়ন চিবানোর মতো; ইনস্ট্যান্ট ওটস দ্রুত তৈরি হয়। প্যাকেটে "প্লেইন" বা "সাধারণ" লেখা ওটস বেছে নিন, কারণ ফ্লেভারযুক্ত ওটসে চিনি বেশি থাকতে পারে।'],['ওটস দিয়ে ৫টি সহজ রেসিপি আইডিয়া','১) দুধ-মধু-কলা দিয়ে গরম পরিজ। ২) রাতে দইয়ে ভিজিয়ে সকালে ঠান্ডা ওভারনাইট ওটস। ৩) ডিম ও সবজি মিশিয়ে সুস্বাদু ওটস চিলা। ৪) ওটস-খেজুর-বাদামের এনার্জি বল। ৫) ওটস গুঁড়ো করে পরোটা বা কুকিজে আটা-ময়দার সাথে মিশিয়ে ব্যবহার।'],['সংরক্ষণ ও সতর্কতা','বায়ুরোধী কৌটায় শুকনো জায়গায় রাখুন। আর্দ্রতা লাগলে ওটসে পোকা বা ছত্রাক ধরতে পারে। গ্লুটেন সংবেদনশীলতা থাকলে প্যাকেটে "গ্লুটেন-ফ্রি" লেখা আছে কিনা দেখে নিন। নতুন করে খাওয়া শুরু করলে অল্প পরিমাণ দিয়ে শুরু করুন।']],
other:[['কেনার আগে জেনে নিন','প্যাকেটের লেবেল, তারিখ ও মেয়াদ দেখুন এবং কোনো প্রশ্ন থাকলে সরাসরি আমাদের জিজ্ঞাসা করুন। উৎস ও সংগ্রহের তথ্য জানা থাকলে পণ্য নিয়ে সবচেয়ে বেশি আস্থা পাওয়া যায়।']]

'সুন্দরবনের মধু':{q:[['উৎস','সুন্দরবনের ম্যানগ্রোভ ফুল'],['স্বাদ','মোলায়েম মিষ্টি, হালকা বনজ ঘ্রাণ'],['সময়','সাধারণত এপ্রিল–মে'],['রং','হালকা সোনালি থেকে অ্যাম্বার']],x:[['কেন সুন্দরবনের মধু আলাদা','ম্যানগ্রোভ বনের লবণাক্ত পরিবেশ ও বৈচিত্র্যময় গাছের কারণে এই মধুর স্বাদ সমতলের মধুর চেয়ে আলাদা হতে পারে। এক এক মৌসুমে এক এক ফুলের প্রাধান্য থাকে বলে প্রতিটি ব্যাচের রং ও ঘ্রাণ কিছুটা ভিন্ন — এটি প্রাকৃতিক মধুর বৈশিষ্ট্য, ত্রুটি নয়।'],['এই মধুর সাথে কী মানায়','গরম রুটি, ঘরে বানানো দই, সকালের কুসুম গরম পানি, কিংবা ফলের সালাদে সামান্য ছিটিয়ে দিলে স্বাদ আরও খোলে।']]},

'মিশ্র ফুলের মধু':{q:[['উৎস','একাধিক ফুল'],['স্বাদ','সুষম মিষ্টি'],['ব্যবহার','প্রতিদিনের জন্য'],['বৈশিষ্ট্য','ব্যাচ ভেদে সামান্য আলাদা']],x:[['প্রতিদিনের মধু হিসেবে কেন ভালো','একক ফুলের মধু তুলনামূলক দামি হতে পারে। যারা প্রতিদিন চা, দুধ, রুটি বা রান্নায় মধু ব্যবহার করেন, তাদের জন্য মিশ্র ফুলের মধু সাশ্রয়ী ও বহুমুখী পছন্দ।'],['কীভাবে বুঝবেন আপনার পছন্দ','প্রথমে মিশ্র ফুলের ছোট জার নিন, তারপর কোন ফুলের মধু বেশি ভালো লাগে তা বুঝে একক ফুলের মধু বেছে নিতে পারেন।']]},

function playIntro(){
 const force=/[?&]intro=1/.test(location.search);
 try{if(navigator.webdriver&&!force)return}catch(e){}
 try{if(!force&&sessionStorage.getItem('pb_intro')==='1')return;sessionStorage.setItem('pb_intro','1')}catch(e){}
 const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,T=reduce?1100:3000;
 const el=document.createElement('div');el.id='intro';
 el.innerHTML='<canvas id="ic"></canvas><div class="ig"></div><div class="iscan"></div><div class="ihub"><i class="ir r1"></i><i class="ir r2"></i><i class="ir r3"></i><div class="ilw"><img class="ilogo" src="'+LOGO+'" alt=""><i class="ibeam"></i></div></div><div class="itx"><div class="iname">'+'PureBite'.split('').map((c,i)=>'<span style="animation-delay:'+(1.05+i*.07).toFixed(2)+'s">'+c+'</span>').join('')+'</div><div class="itag"><span style="animation-delay:1.85s">খাঁটি পণ্য,</span> <span style="animation-delay:2.05s">বিশ্বাসের স্বাদ</span></div></div><button class="iskip" type="button">স্কিপ ›</button><i class="ibar"></i>';
 if(reduce)el.classList.add('rm');
 document.body.appendChild(el);
 let done=false,raf=0;
 const end=()=>{if(done)return;done=true;cancelAnimationFrame(raf);el.classList.add('out');setTimeout(()=>el.remove(),500)};
 el.addEventListener('click',end);
 setTimeout(end,T);
 if(reduce)return;
 const cv=el.querySelector('#ic'),cx=cv.getContext('2d');if(!cx)return;
 let W=0,H=0,D=Math.min(2,window.devicePixelRatio||1);
 const size=()=>{W=window.innerWidth;H=window.innerHeight;cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(D,0,0,D,0,0)};size();
 const HU=[190,215,265,300,48,150],N=64,ps=[];
 for(let i=0;i<N;i++)ps.push({a:Math.random()*6.283,r:.28+Math.random()*.62,v:(Math.random()<.5?-1:1)*(.5+Math.random()*1.1),s:1+Math.random()*2.2,h:HU[i%HU.length],p:Math.random()*6.283});
 const hx=[];for(let i=0;i<9;i++)hx.push({x:Math.random(),y:Math.random(),s:10+Math.random()*22,v:.03+Math.random()*.06,p:Math.random()*6.283});
 const t0=performance.now();
 const hex=(x,y,r,rot)=>{cx.beginPath();for(let k=0;k<6;k++){const a=rot+k*Math.PI/3;cx[k?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r)}cx.closePath()};
 const frame=now=>{
  const t=now-t0;if(done)return;
  cx.clearRect(0,0,W,H);
  const X=W/2,Y=H*.42,U=Math.min(W,H)/390,e=Math.min(1,t/900),ee=1-Math.pow(1-e,3);
  hx.forEach(h=>{const yy=((h.y-t/1000*h.v*2+10)%1)*H,al=.16+.1*Math.sin(t/400+h.p);cx.strokeStyle='rgba(253,230,138,'+al+')';cx.lineWidth=1;hex(h.x*W,yy,h.s*U,t/2000*(h.v*8));cx.stroke()});
  const pts=ps.map(p=>{const r=p.r*210*U*(1+(1-ee)*2.4),a=p.a+p.v*t/1000;return{x:X+Math.cos(a)*r,y:Y+Math.sin(a)*r*.62,p}});
  cx.lineWidth=.6;
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=dx*dx+dy*dy;if(d<3600*U*U){cx.strokeStyle='rgba(110,231,255,'+(.22*(1-d/(3600*U*U))*ee)+')';cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.stroke()}}
  pts.forEach(q=>{const al=ee*(.55+.45*Math.sin(t/260+q.p.p));cx.fillStyle='hsla('+q.p.h+',95%,72%,'+al+')';cx.shadowColor='hsla('+q.p.h+',100%,65%,.9)';cx.shadowBlur=10;cx.beginPath();cx.arc(q.x,q.y,q.p.s*U,0,6.283);cx.fill()});
  cx.shadowBlur=0;
  if(t>2300&&t<3000){const k=(t-2300)/700;cx.strokeStyle='rgba(167,139,250,'+(.7*(1-k))+')';cx.lineWidth=2;cx.beginPath();cx.arc(X,Y,(70+k*Math.max(W,H)*.6)*1,0,6.283);cx.stroke()}
  raf=requestAnimationFrame(frame);
 };
 raf=requestAnimationFrame(frame);
 window.addEventListener('resize',size,{once:true});
}

 importData:()=>$('#impfile').click(),
 delSample:()=>{if(!confirm('নমুনা অর্ডার, পণ্য ও কাস্টমার মুছে যাবে। চালিয়ে যাবেন?'))return;db.orders=db.orders.filter(o=>!o.s);db.products=db.products.filter(p=>!p.s);db.customers=db.customers.filter(c=>!c.s);save();toast('নমুনা তথ্য মুছে গেছে');render()},
 resetAll:()=>{if(!confirm('সব অর্ডার, পণ্য ও কাস্টমার মুছে যাবে!'))return;if(!confirm('নিশ্চিত? এটি আর ফেরানো যাবে না।'))return;const shop=db.shop,lk=db.lock;db={v:3,shop,products:[],customers:[],orders:[],seq:1000,photos:{},details:{},slides:[null,null,null,null,null]};if(lk)db.lock=lk;save();toast('নতুন করে শুরু করুন');render()}
};

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const fn=ACT[t.dataset.act];if(fn){if(t.tagName!=='A')e.preventDefault();fn(t.dataset,t)}
});
function resizePhoto(file,cb,mx,q){mx=mx||640;q=q||.82;
 const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{const k=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',q))};
 img.onerror=()=>{URL.revokeObjectURL(url);toast('ছবিটি পড়া যায়নি — JPG বা PNG ছবি দিন')};img.src=url;
}
document.addEventListener('change',e=>{
 const fi=e.target;
 if(fi.dataset&&fi.dataset.sid){setStatus(fi.dataset.sid,fi.value);return}
 if(fi.dataset&&fi.dataset.slide!==undefined&&fi.files[0]){const i=+fi.dataset.slide;resizePhoto(fi.files[0],d=>{db.slides[i]=d;save();toast('স্লাইডে ছবি বসেছে ✓');redrawSlides()},1000,.8);fi.value='';return}
 if(fi.id==='pr_photo'&&fi.files[0]){resizePhoto(fi.files[0],d=>{PH=d;const p=$('#pr_prev');if(p)p.src=d;toast('ছবি বসানো হয়েছে — "সেভ করুন" চাপুন')});fi.value='';return}
 if(fi.dataset&&fi.dataset.gslot!==undefined&&fi.files[0]){const g=galGroup(),sl=+fi.dataset.gslot;if(g){resizePhoto(fi.files[0],d=>{const a=(db.gallery[g.g]||[]).slice();while(a.length<GMAX)a.push(null);a[sl]=d;db.gallery[g.g]=a;save();openGallery(GALK);toast('ছবি যোগ হয়েছে ✓');redrawShop()},560,.72)}fi.value='';return}
 if(fi.dataset&&fi.dataset.pid!==undefined&&fi.files[0]){const g=fi.dataset.pid;resizePhoto(fi.files[0],d=>{db.photos[g]=d;save();toast('ছবি সেভ হয়েছে ✓');redrawShop(1)});fi.value='';return}
 if(e.target.id==='impfile'&&e.target.files[0]){
  const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x||!Array.isArray(x.products)||!Array.isArray(x.orders))throw 0;const lk=db.lock;db=sanitizeDb(x);if(lk)db.lock=lk;else delete db.lock;fixDb();save();toast('ব্যাকআপ রিস্টোর হয়েছে ✓');render()}catch(err){toast('ফাইলটি সঠিক ব্যাকআপ নয়')}};
  rd.readAsText(e.target.files[0]);
 }
});
function boot(){BOOTED=true;shell();render();setTimeout(autoFollow,900)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='lk_pin')tryUnlock();else if(e.key==='Enter'&&e.target&&e.target.id==='sq2'){ACT.srAll()}else if(e.key==='Enter'&&e.target&&e.target.id==='shq'){const g=$('#glist');e.target.blur();if(g)g.scrollIntoView({behavior:'smooth',block:'start'})}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){HID=Date.now()}else if(db&&db.lock&&!PUBMODE&&BOOTED&&HID&&Date.now()-HID>120000){showLock()}});
document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('#slider'))SL.x=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(!(e.target.closest&&e.target.closest('#slider'))||SL.n<2)return;const dx=e.changedTouches[0].clientX-SL.x;if(Math.abs(dx)>40){slideTo((SL.k+(dx<0?1:SL.n-1))%SL.n);startSlider()}},{passive:true});
window.addEventListener('DOMContentLoaded',()=>{
 dlg().addEventListener('click',e=>{if(e.target===dlg())closeModal()});
 window.addEventListener('popstate',()=>{if(!$('#pg-shop'))return;if(!blogRoute(location.hash,true)&&SV==='blog')setView('home',1)});
 dlg().addEventListener('close',()=>{if(SV==='prod'&&$('#pg-shop'))redrawProd()});
 try{playIntro()}catch(e){}
 if(PUBMODE&&PUBD){db=PUBD;sanitizeDb(db);fixDb();CM=pubCM()}
 if(CM){
  document.body.classList.add('cust');
  $$('img[data-logo]').forEach(i=>i.src=LOGO);$('#favicon').href=LOGO;
  $('#ptitle').textContent=CM.n;$('#pdate').textContent='';document.title=CM.n+' — ক্যাটালগ';
  mountShop();initHQ();try{blogRoute(location.hash,true)}catch(e){}return;
 }
 load();
 if(db.lock)showLock();else boot();
});
</script>
</body>
</html>
