>বাদাম দিয়ে ১০ মিনিটের স্বাস্থ্যকর নাস্তা</h3><p>ওটসের ওপর কাটা বাদাম ও মধু, দইয়ের সাথে আমন্ড-কাজু, বাদাম-খেজুরের বল, সালাদে কুচি বাদাম অথবা শুকনো কড়াইতে হালকা সেঁকে অল্প লবণ ছিটিয়ে চায়ের সাথে — সবই সহজ ও সুস্বাদু আইডিয়া। এক মুঠো (২৫–৩০ গ্রাম) পরিমাণ ঠিক আছে।</p><h3>অ্যালার্জি ও সতর্কতা</h3><p>বাদামের অ্যালার্জি কখনো গুরুতর হতে পারে। পরিবারে কারও এমন সমস্যা থাকলে বাদাম বা বাদামজাত পণ্য আলাদা রাখুন। ছোট শিশুদের গোটা বাদাম দিলে গলায় আটকে যাওয়ার ঝুঁকি থাকে, তাই কুচি বা গুঁড়া করে দিন। অ্যালার্জির উপসর্গ দেখা দিলে দ্রুত চিকিৎসকের কাছে যান।</p><ul><li>বায়ুরোধী কৌটায় রাখুন।</li><li>আর্দ্রতা ও গরম থেকে দূরে রাখুন।</li></ul><h3>ভিজিয়ে খাওয়া কি ভালো?</h3><p>ভিজিয়ে খেলে নরম হয় ও চিবানো সহজ হয়; এটি ব্যক্তিগত পছন্দ।</p><h3>সবাই কি খেতে পারে?</h3><p>বাদামে অ্যালার্জি থাকলে একেবারেই নয়।</p></article><article><h2>মিক্সড বাদাম: এক প্যাকে নানা স্বাদ</h2><p>কাজু, আমন্ড ও অন্যান্য বাদামের মিশ্রণ। নাস্তা ও উপহারের জন্য সুবিধাজনক।</p><p>মিক্সড বাদাম একসাথে নানা স্বাদ ও গড়ন পাওয়ার সহজ উপায়। অফিস, স্কুল বা ভ্রমণে এটি নেওয়ার জন্য ভালো।</p><h3>কী কী থাকে</h3><p>সাধারণত কাজু, আমন্ড, কিশমিশ ও অন্য বাদামের মিশ্রণ। উপাদানের অনুপাত প্যাক ভেদে সামান্য আলাদা হতে পারে।</p><h3>কখন খাবেন</h3><p>সকালের নাস্তা, বিকেলের স্ন্যাকস বা ভ্রমণে নিতে পারেন।</p><h3>পরিমাণ</h3><p>এক মুঠো যথেষ্ট; ক্যালরি বেশি থাকায় পরিমিত খান।</p><h3>ভ্রমণ ও অফিসে সুবিধাজনক</h3><p>ছোট জিপ ব্যাগে মিক্সড বাদাম নিয়ে গেলে ক্ষুধা পেলে সহজে খাওয়া যায়, আর চিপস বা অন্য প্যাকেটজাত স্ন্যাকসের একটি ভালো বিকল্প হয়।</p><h3>উপহার ও সাজানো</h3><p>ঈদ বা উৎসবে রঙিন বাক্সে মিক্সড বাদাম ও খেজুর একসাথে সাজিয়ে উপহার দেওয়া যায়।</p><h3>সতেজ বাদাম কেনার গাইড</h3><p>সতেজ বাদামে সামান্য মিষ্টি ঘ্রাণ থাকে এবং কামড়ালে মচমচে লাগে। তেল-তেল, তেতো বা টক গন্ধ হলে সেটি পুরনো হয়ে গেছে। প্যাকেটে প্যাকিং তারিখ, মেয়াদ ও সিল দেখে নিন। অপ্রয়োজনে একসাথে বেশি না কিনে ছোট প্যাকে কিনলে সবসময় সতেজ বাদাম পাওয়া যায়।</p><h3>বাদাম দিয়ে ১০ মিনিটের স্বাস্থ্যকর নাস্তা</h3><p>ওটসের ওপর কাটা বাদাম ও মধু, দইয়ের সাথে আমন্ড-কাজু, বাদাম-খেজুরের বল, সালাদে কুচি বাদাম অথবা শুকনো কড়াইতে হালকা সেঁকে অল্প লবণ ছিটিয়ে চায়ের সাথে — সবই সহজ ও সুস্বাদু আইডিয়া। এক মুঠো (২৫–৩০ গ্রাম) পরিমাণ ঠিক আছে।</p><h3>অ্যালার্জি ও সতর্কতা</h3><p>বাদামের অ্যালার্জি কখনো গুরুতর হতে পারে। পরিবারে কারও এমন সমস্যা থাকলে বাদাম বা বাদামজাত পণ্য আলাদা রাখুন। ছোট শিশুদের গোটা বাদাম দিলে গলায় আটকে যাওয়ার ঝুঁকি থাকে, তাই কুচি বা গুঁড়া করে দিন। অ্যালার্জির উপসর্গ দেখা দিলে দ্রুত চিকিৎসকের কাছে যান।</p><ul><li>বায়ুরোধী কৌটায় রাখুন।</li><li>আর্দ্রতা থেকে দূরে রাখুন।</li></ul><h3>অ্যালার্জি থাকলে কী করব?</h3><p>প্যাকের উপাদান তালিকা দেখে নিন; অ্যালার্জি থাকলে এড়ান।</p><h3>উপহার হিসেবে দেওয়া যাবে?</h3><p>হ্যাঁ, বড় প্যাক উপহারের জন্য জনপ্রিয়।</p></article><article><h2>হানি নাটস: মধুতে ডোবানো বাদামের মজা</h2><p>বাদাম ও মধুর একসাথে মিশ্রণ; মচমচে ও মিষ্টি স্বাদের একসাথে পাওয়া যায়।</p><p>হানি নাটস মধুর ভেতরে বাদাম ডুবিয়ে রাখা হয়। এতে বাদামের মচমচে ভাব ও মধুর মিষ্টি দুই স্বাদ পাওয়া যায়।</p><h3>কীভাবে খাবেন</h3><p>সরাসরি চামচে, রুটি বা টোস্টে মাখিয়ে, দইয়ের সাথে বা ওটসের ওপর ছিটিয়ে।</p><h3>স্বাদ</h3><p>মধুর মিষ্টি ও বাদামের মচমচে স্বাদের মিলন; সময়ের সাথে বাদাম একটু নরম হতে পারে।</p><h3>সতর্কতা</h3><p>মধু থাকায় ১ বছরের কম বয়সী শিশুকে দেবেন না। বাদামে অ্যালার্জি থাকলে এড়ান।</p><h3>হানি নাটস দিয়ে সকালের নাস্তা</h3><p>টোস্টে বা পরোটায় মাখিয়ে, গ্রিক দইয়ে বা ওটসের ওপর কয়েক চামচ হানি নাটস দিলে মুহূর্তে সুস্বাদু ও পেট ভরা নাস্তা তৈরি হয়।</p><h3>সংরক্ষণের টিপস</h3><p>ঢাকনা আঁটা জারে ঘরের স্বাভাবিক তাপমাত্রায় রাখুন। সবসময় শুকনো চামচ ব্যবহার করুন, নইলে মধু গাঁজতে পারে।</p><h3>সতেজ বাদাম কেনার গাইড</h3><p>সতেজ বাদামে সামান্য মিষ্টি ঘ্রাণ থাকে এবং কামড়ালে মচমচে লাগে। তেল-তেল, তেতো বা টক গন্ধ হলে সেটি পুরনো হয়ে গেছে। প্যাকেটে প্যাকিং তারিখ, মেয়াদ ও সিল দেখে নিন। অপ্রয়োজনে একসাথে বেশি না কিনে ছোট প্যাকে কিনলে সবসময় সতেজ বাদাম পাওয়া যায়।</p><h3>বাদাম দিয়ে ১০ মিনিটের স্বাস্থ্যকর নাস্তা</h3><p>ওটসের ওপর কাটা বাদাম ও মধু, দইয়ের সাথে আমন্ড-কাজু, বাদাম-খেজুরের বল, সালাদে কুচি বাদাম অথবা শুকনো কড়াইতে হালকা সেঁকে অল্প লবণ ছিটিয়ে চায়ের সাথে — সবই সহজ ও সুস্বাদু আইডিয়া। এক মুঠো (২৫–৩০ গ্রাম) পরিমাণ ঠিক আছে।</p><h3>অ্যালার্জি ও সতর্কতা</h3><p>বাদামের অ্যালার্জি কখনো গুরুতর হতে পারে। পরিবারে কারও এমন সমস্যা থাকলে বাদাম বা বাদামজাত পণ্য আলাদা রাখুন। ছোট শিশুদের গোটা বাদাম দিলে গলায় আটকে যাওয়ার ঝুঁকি থাকে, তাই কুচি বা গুঁড়া করে দিন। অ্যালার্জির উপসর্গ দেখা দিলে দ্রুত চিকিৎসকের কাছে যান।</p><ul><li>ঢাকনা আঁটা জারে রাখুন।</li><li>শুকনো চামচ ব্যবহার করুন।</li></ul><h3>মধু জমে গেলে?</h3><p>হালকা গরম পানিতে জার ভিজিয়ে নিন।</p><h3>কতদিন ভালো থাকে?</h3><p>প্যাকেটের মেয়াদ দেখুন।</p></article><article><h2>আখরোট: খোসা ছাড়ানো মগজের স্বাদ, পুষ্টি ও কীভাবে খাবেন</h2><p>মগজের মতো ভাঁজওয়ালা, হালকা মিষ্টি ও সামান্য তেতো আভার বাদাম; ওমেগা-৩ জাতীয় চর্বি ও আঁশে ভরপুর। সকালের নাস্তা, সালাদ ও মিষ্টিতে মানায়।</p><p>আখরোট (Walnut) শীতপ্রধান অঞ্চলের গাছের ফল। ভেতরের দুই ভাঁজের শাঁসটাই আমরা খাই। দেখতে মগজের মতো বলে এটি অনেক দেশেই পরিচিত &quot;ব্রেন ফুড&quot; নামে, যদিও কোনো একটি খাবারই বুদ্ধি বাড়িয়ে দেয় না; সুষম খাবারের অংশ হিসেবেই এর মূল্য।</p><h3>কী আছে আখরোটে</h3><p>আখরোটে উদ্ভিজ্জ ওমেগা-৩ (আলফা-লিনোলেনিক অ্যাসিড), আঁশ, প্রোটিন, ম্যাগনেসিয়াম ও ভিটামিন ই আছে। ক্যালরি বেশি, তাই অল্প পরিমাণই যথেষ্ট; দিনে মুঠো খানেক (প্রায় ২৫–৩০ গ্রাম) সাধারণ একটি মাপ।</p><h3>স্বাদ ও গড়ন</h3><p>খোসা ছাড়ানো আখরোট হালকা মিষ্টি, মাখনের মতো তেলতেলে ও শেষে সামান্য তেতো আভা দেয়। ভেতরের বাদামি পাতলা আবরণে এই তেতো ভাব থাকে; চাইলে ১–২ মিনিট গরম পানিতে ভিজিয়ে আবরণ তুলে নিতে পারেন।</p><h3>কীভাবে খাবেন</h3><p>সরাসরি খাওয়া যায়। ওটস, দই, সালাদ বা কলার সাথে মিশিয়ে নিন। হালকা ভেজে নিলে সুগন্ধ বাড়ে। রাতে পানিতে ৪–৮ ঘণ্টা ভিজিয়ে সকালে খেলে নরম হয় এবং কিছু মানুষের হজমে সুবিধা হয়।</p><h3>ঘরোয়া রান্নায়</h3><p>কুচি করে কেক, ব্রাউনি, হালুয়া ও পায়েসে দিলে স্বাদ ও গড়ন দুটোই বাড়ে। কুচানো আখরোট দিয়ে খেজুরের লাড্ডুও বানানো যায়।</p><h3>ঘরে সহজ আইডিয়া</h3><p>কুচানো আখরোট, কলা ও দই মিলিয়ে সকালের নাস্তা বানান। খেজুর ও আখরোট একসাথে বেটে ছোট লাড্ডু বানালে ইফতারেও চলে।</p><h3>সতেজ বাদাম কেনার গাইড</h3><p>সতেজ বাদামে সামান্য মিষ্টি ঘ্রাণ থাকে এবং কামড়ালে মচমচে লাগে। তেল-তেল, তেতো বা টক গন্ধ হলে সেটি পুরনো হয়ে গেছে। প্যাকেটে প্যাকিং তারিখ, মেয়াদ ও সিল দেখে নিন। অপ্রয়োজনে একসাথে বেশি না কিনে ছোট প্যাকে কিনলে সবসময় সতেজ বাদাম পাওয়া যায়।</p><h3>বাদাম দিয়ে ১০ মিনিটের স্বাস্থ্যকর নাস্তা</h3><p>ওটসের ওপর কাটা বাদাম ও মধু, দইয়ের সাথে আমন্ড-কাজু, বাদাম-খেজুরের বল, সালাদে কুচি বাদাম অথবা শুকনো কড়াইতে হালকা সেঁকে অল্প লবণ ছিটিয়ে চায়ের সাথে — সবই সহজ ও সুস্বাদু আইডিয়া। এক মুঠো (২৫–৩০ গ্রাম) পরিমাণ ঠিক আছে।</p><h3>অ্যালার্জি ও সতর্কতা</h3><p>বাদামের অ্যালার্জি কখনো গুরুতর হতে পারে। পরিবারে কারও এমন সমস্যা থাকলে বাদাম বা বাদামজাত পণ্য আলাদা রাখুন। ছোট শিশুদের গোটা বাদাম দিলে গলায় আটকে যাওয়ার ঝুঁকি থাকে, তাই কুচি বা গুঁড়া করে দিন। অ্যালার্জির উপসর্গ দেখা দিলে দ্রুত চিকিৎসকের কাছে যান।</p><ul><li>আখরোটে তেল বেশি, তাই বায়ুরোধী কৌটায় ঠান্ডা জায়গায় (সম্ভব হলে ফ্রিজে) রাখুন।</li><li>তেতো বা বাসি গন্ধ হলে খাবেন না।</li><li>বাদাম থেকে অ্যালার্জি থাকলে আখরোট এড়িয়ে চলুন।</li></ul><h3>আখরোট কি রোজ খাওয়া যায়?</h3><p>সুস্থ মানুষ অল্প পরিমাণ রোজ খেতে পারেন। নির্দিষ্ট অসুখ থাকলে চিকিৎসকের পরামর্শ নিন।</p><h3>ভিজিয়ে খাওয়া কি জরুরি?</h3><p>না, জরুরি নয়। এটি পছন্দ ও হজমের অভ্যাসের ব্যাপার।</p><h3>কতদিন ভালো থাকে?</h3><p>ঠান্ডা ও শুকনো জায়গায় বায়ুরোধী কৌটায় কয়েক মাস ভালো থাকে। প্যাকেটের মেয়াদ দেখে নিন।</p></article><article><h2>চিয়া সিড: কীভাবে ভেজাবেন, কত খাবেন ও কী বানাবেন</h2><p>ছোট্ট কালচে-ধূসর বীজ; পানিতে ভিজলে জেলির মতো ফুলে ওঠে। আঁশ ও উদ্ভিজ্জ ওমেগা-৩ আছে। পুডিং, শরবত, দই ও স্মুদিতে মেশানো যায়।</p><p>চিয়া সিড (Chia seed) মধ্য ও দক্ষিণ আমেরিকার একটি গাছের বীজ। আকারে তিলের চেয়েও ছোট, নিজের স্বাদ প্রায় নেই বলে যেকোনো পানীয় বা খাবারে সহজে মিশে যায়। বাংলাদেশে সাধারণত শরবত, স্মুদি ও পুডিংয়ে ব্যবহার হয়।</p><h3>কেন ভিজিয়ে খাবেন</h3><p>শুকনো চিয়া সিড পানি শুষে নিজের ওজনের কয়েক গুণ ফুলে যায়। তাই ১০–১৫ মিনিট (বা রাতভর) পানি বা দুধে ভিজিয়ে নিন। শুকনো অবস্থায় বেশি পরিমাণ খেয়ে পরে পানি পান করলে গলায় আটকানোর ঝুঁকি থাকে, তাই এটি এড়ান।</p><h3>কতটা খাবেন</h3><p>শুরুতে ১ চা-চামচ (প্রায় ৫ গ্রাম) থেকে শুরু করুন; অভ্যস্ত হলে দিনে ১–২ টেবিল-চামচ। আঁশ বেশি, তাই হঠাৎ বেশি খেলে পেট ফাঁপা বা অস্বস্তি হতে পারে। সাথে পর্যাপ্ত পানি পান করুন।</p><h3>সহজ রেসিপি</h3><p>১ কাপ দুধ বা নারকেলের দুধে ২–৩ টেবিল-চামচ চিয়া মিশিয়ে ফ্রিজে ৪ ঘণ্টা রাখলে চিয়া পুডিং তৈরি। ওপরে ফল, মধু বা কুচানো বাদাম দিন। লেবুর শরবত বা বেলের শরবতেও মেশানো যায়।</p><h3>স্বাদ ও গড়ন</h3><p>ভেজা চিয়ার ওপর পিচ্ছিল জেলির আবরণ থাকে, ভেতরে সামান্য কুড়মুড়ে ভাব। তাই সাবুদানার মতো গড়ন পছন্দ করলে আপনার ভালো লাগবে।</p><h3>শরবতে ব্যবহার</h3><p>এক গ্লাস লেবুর শরবতে ১ চা-চামচ ভেজানো চিয়া মেশালে ভিন্ন গড়ন আসে। ফ্রিজে রাখা চিয়া পুডিং গরমে ভালো লাগে।</p><h3>সতেজ বাদাম কেনার গাইড</h3><p>সতেজ বাদামে সামান্য মিষ্টি ঘ্রাণ থাকে এবং কামড়ালে মচমচে লাগে। তেল-তেল, তেতো বা টক গন্ধ হলে সেটি পুরনো হয়ে গেছে। প্যাকেটে প্যাকিং তারিখ, মেয়াদ ও সিল দেখে নিন। অপ্রয়োজনে একসাথে বেশি না কিনে ছোট প্যাকে কিনলে সবসময় সতেজ বাদাম পাওয়া যায়।</p><h3>বাদাম দিয়ে ১০ মিনিটের স্বাস্থ্যকর নাস্তা</h3><p>ওটসের ওপর কাটা বাদাম ও মধু, দইয়ের সাথে আমন্ড-কাজু, বাদাম-খেজুরের বল, সালাদে কুচি বাদাম অথবা শুকনো কড়াইতে হালকা সেঁকে অল্প লবণ ছিটিয়ে চায়ের সাথে — সবই সহজ ও সুস্বাদু আইডিয়া। এক মুঠো (২৫–৩০ গ্রাম) পরিমাণ ঠিক আছে।</p><h3>অ্যালার্জি ও সতর্কতা</h3><p>বাদামের অ্যালার্জি কখনো গুরুতর হতে পারে। পরিবারে কারও এমন সমস্যা থাকলে বাদাম বা বাদামজাত পণ্য আলাদা রাখুন। ছোট শিশুদের গোটা বাদাম দিলে গলায় আটকে যাওয়ার ঝুঁকি থাকে, তাই কুচি বা গুঁড়া করে দিন। অ্যালার্জির উপসর্গ দেখা দিলে দ্রুত চিকিৎসকের কাছে যান।</p><ul><li>বায়ুরোধী কৌটায় শুকনো জায়গায় রাখুন।</li><li>ভেজানো চিয়া ফ্রিজে ৩–৫ দিনের মধ্যে খেয়ে ফেলুন।</li><li>গিলতে সমস্যা আছে বা রক্ত পাতলা করার ওষুধ খেলে আগে চিকিৎসকের পরামর্শ নিন।</li></ul><h3>চিয়া সিড কি ওজন কমায়?</h3><p>কোনো একক খাবার ওজন কমায় না। আঁশ পেট ভরা অনুভূতি দিতে পারে, তবে সুষম খাবার ও শরীরচর্চাই মূল।</p><h3>সব বয়সীরা কি খেতে পারে?</h3><p>ছোট শিশুদের দেওয়ার আগে অবশ্যই ভিজিয়ে নরম করে এবং চিকিৎসকের পরামর্শ নিয়ে দিন।</p><h3>তুকমা ও চিয়া কি এক?</h3><p>না; দুটোই ভিজে জেলি হয়, কিন্তু আলাদা গাছের বীজ। তুকমা কালো ও বড়, চিয়া ছোট ও ধূসর।</p></article><article><h2>কুমড়ার বীজ: ম্যাগনেসিয়াম-জিংকে ভরা কুড়মুড়ে স্ন্যাকস</h2><p>সবুজাভ, চ্যাপ্টা ও কুড়মুড়ে বীজ; ম্যাগনেসিয়াম, জিংক ও আঁশ আছে। ভেজে নাস্তা হিসেবে, সালাদে বা ওটসের ওপরে ছিটিয়ে খাওয়া যায়।</p><p>মিষ্টি কুমড়ার ভেতরের বীজ শুকিয়ে খোসা ছাড়ালে যে সবুজ রঙের শাঁস পাওয়া যায়, তাই আমরা &quot;কুমড়ার বীজ&quot; (Pumpkin seed / পেপিটা) বলি। কুড়মুড়ে স্বাদ ও হালকা বাদামের মতো গন্ধের জন্য এটি স্বাস্থ্য-সচেতনদের পছন্দ।</p><h3>পুষ্টি পরিচয়</h3><p>কুমড়ার বীজে প্রোটিন, ম্যাগনেসিয়াম, জিংক, আয়রন ও আঁশ আছে। ক্যালরি বেশি, তাই মুঠো খানেক (প্রায় ২০–৩০ গ্রাম) পরিমাণ একটি সাধারণ মাপ।</p><h3>ভাজার সহজ উপায়</h3><p>নন-স্টিক প্যানে তেল ছাড়াই ২–৩ মিনিট মৃদু আঁচে নাড়তে থাকুন; ফুলে উঠে হালকা সোনালি হলে নামান। চাইলে সামান্য লবণ বা গোলমরিচের গুঁড়া ছিটান।</p><h3>কীভাবে খাবেন</h3><p>সালাদ, স্যুপ, ওটস, দই ও স্মুদি বোলের ওপরে ছিটিয়ে দিন। ঘরে বানানো গ্রানোলা বা বাদাম-বীজের মিক্সেও চমৎকার।</p><h3>স্বাদ ও গড়ন</h3><p>ভাজলে বাদামের মতো গন্ধ আসে, কামড়ে হালকা কুড়মুড়ে লাগে। কাঁচা অবস্থাতেও খাওয়া যায়, তবে ভাজলে স্বাদ বেশি খোলে।</p><h3>সালাদে ব্যবহার</h3><p>শসা, টমেটো ও পেঁয়াজের সালাদে ভাজা কুমড়ার বীজ ছিটিয়ে দিলে কুড়মুড়ে ভাব ও স্বাদ বাড়ে।</p><h3>সতেজ বাদাম কেনার গাইড</h3><p>সতেজ বাদামে সামান্য মিষ্টি ঘ্রাণ থাকে এবং কামড়ালে মচমচে লাগে। তেল-তেল, তেতো বা টক গন্ধ হলে সেটি পুরনো হয়ে গেছে। প্যাকেটে প্যাকিং তারিখ, মেয়াদ ও সিল দেখে নিন। অপ্রয়োজনে একসাথে বেশি না কিনে ছোট প্যাকে কিনলে সবসময় সতেজ বাদাম পাওয়া যায়।</p><h3>বাদাম দিয়ে ১০ মিনিটের স্বাস্থ্যকর নাস্তা</h3><p>ওটসের ওপর কাটা বাদাম ও মধু, দইয়ের সাথে আমন্ড-কাজু, বাদাম-খেজুরের বল, সালাদে কুচি বাদাম অথবা শুকনো কড়াইতে হালকা সেঁকে অল্প লবণ ছিটিয়ে চায়ের সাথে — সবই সহজ ও সুস্বাদু আইডিয়া। এক মুঠো (২৫–৩০ গ্রাম) পরিমাণ ঠিক আছে।</p><h3>অ্যালার্জি ও সতর্কতা</h3><p>বাদামের অ্যালার্জি কখনো গুরুতর হতে পারে। পরিবারে কারও এমন সমস্যা থাকলে বাদাম বা বাদামজাত পণ্য আলাদা রাখুন। ছোট শিশুদের গোটা বাদাম দিলে গলায় আটকে যাওয়ার ঝুঁকি থাকে, তাই কুচি বা গুঁড়া করে দিন। অ্যালার্জির উপসর্গ দেখা দিলে দ্রুত চিকিৎসকের কাছে যান।</p><ul><li>বায়ুরোধী কৌটায় ঠান্ডা, শুকনো জায়গায় রাখুন।</li><li>তেতো বা বাসি গন্ধ হলে ফেলে দিন।</li><li>অতিরিক্ত লবণ দিয়ে ভাজা বীজ বেশি না খাওয়াই ভালো।</li></ul><h3>খোসাসহ নাকি খোসা ছাড়ানো?</h3><p>এই পণ্যের বীজ খোসা ছাড়ানো সবুজ শাঁস, সরাসরি খাওয়া যায়।</p><h3>প্রতিদিন কতটা?</h3><p>অল্প পরিমাণ (মুঠো খানেক) যথেষ্ট; বেশি খেলে ক্যালরি বেড়ে যায়।</p><h3>কাঁচা না ভাজা ভালো?</h3><p>দুটোই খাওয়া যায়; স্বাদের জন্য হালকা ভেজে নিন।</p></article><article><h2>তরমুজের বীজ: শুকনো, ভাজা ও সহজ স্ন্যাকস হিসেবে খাওয়ার নিয়ম</h2><p>শুকনো তরমুজ বীজের মিষ্টি-বাদামি শাঁস; হালকা ভেজে চিবিয়ে খাওয়ার মতো নাস্তা। প্রোটিন, ম্যাগনেসিয়াম ও ভালো চর্বি পাওয়া যায়।</p><p>তরমুজ খাওয়ার পর যে বীজ আমরা ফেলে দিই, শুকিয়ে ও পরিষ্কার করে সেটিই বিশেষ নাস্তা হিসেবে বিক্রি হয়। এশিয়া ও মধ্যপ্রাচ্যের অনেক দেশে এটি ঐতিহ্যবাহী বীজ-স্ন্যাকস, বিশেষ করে উৎসবে ও অতিথি আপ্যায়নে।</p><h3>স্বাদ ও গড়ন</h3><p>কালচে-বাদামি বা সাদাটে খোসার ভেতরে ছোট শাঁস থাকে। ভাজলে হালকা বাদামি, মিষ্টি-বাদামের মতো স্বাদ ও কুড়মুড়ে ভাব পাওয়া যায়।</p><h3>কীভাবে খাবেন</h3><p>হালকা আঁচে শুকনো প্যানে ২–৩ মিনিট ভেজে নিন, ঠান্ডা হলে খান। কুমড়ার বীজ বা বাদামের সাথে মিক্স করে নাস্তার বাটিতে রাখলে মজা বাড়ে।</p><h3>কেন জনপ্রিয়</h3><p>ছোট দানা, তাই আড্ডা বা টিভি দেখার সময় ধীরে ধীরে খাওয়ার অভ্যাসে উপযোগী; চিপসের বিকল্প হিসেবেও অনেকে বেছে নেন।</p><h3>পুষ্টি পরিচয়</h3><p>এতে প্রোটিন, ম্যাগনেসিয়াম, আয়রন ও উদ্ভিজ্জ চর্বি থাকে। তবে ক্যালরি বেশি, তাই অল্প পরিমাণ খাওয়াই ভালো।</p><h3>নাস্তার মিক্স</h3><p>ভাজা তরমুজের বীজ, কুমড়ার বীজ ও কাঠবাদাম মিলিয়ে একটি ঘরোয়া নাস্তার মিক্স বানাতে পারেন।</p><h3>সতেজ বাদাম কেনার গাইড</h3><p>সতেজ বাদামে সামান্য মিষ্টি ঘ্রাণ থাকে এবং কামড়ালে মচমচে লাগে। তেল-তেল, তেতো বা টক গন্ধ হলে সেটি পুরনো হয়ে গেছে। প্যাকেটে প্যাকিং তারিখ, মেয়াদ ও সিল দেখে নিন। অপ্রয়োজনে একসাথে বেশি না কিনে ছোট প্যাকে কিনলে সবসময় সতেজ বাদাম পাওয়া যায়।</p><h3>বাদাম দিয়ে ১০ মিনিটের স্বাস্থ্যকর নাস্তা</h3><p>ওটসের ওপর কাটা বাদাম ও মধু, দইয়ের সাথে আমন্ড-কাজু, বাদাম-খেজুরের বল, সালাদে কুচি বাদাম অথবা শুকনো কড়াইতে হালকা সেঁকে অল্প লবণ ছিটিয়ে চায়ের সাথে — সবই সহজ ও সুস্বাদু আইডিয়া। এক মুঠো (২৫–৩০ গ্রাম) পরিমাণ ঠিক আছে।</p><h3>অ্যালার্জি ও সতর্কতা</h3><p>বাদামের অ্যালার্জি কখনো গুরুতর হতে পারে। পরিবারে কারও এমন সমস্যা থাকলে বাদাম বা বাদামজাত পণ্য আলাদা রাখুন। ছোট শিশুদের গোটা বাদাম দিলে গলায় আটকে যাওয়ার ঝুঁকি থাকে, তাই কুচি বা গুঁড়া করে দিন। অ্যালার্জির উপসর্গ দেখা দিলে দ্রুত চিকিৎসকের কাছে যান।</p><ul><li>শুকনো ও বায়ুরোধী কৌটায় রাখুন; স্যাঁতসেঁতে হলে কুড়মুড়ে ভাব চলে যায়।</li><li>অতিরিক্ত লবণ দিয়ে ভাজা নাস্তা বেশি না খাওয়াই ভালো।</li><li>ছোট শিশুদের গলায় আটকে যাওয়ার ঝুঁকি আছে, তাদের দেওয়ার সময় সতর্ক থাকুন।</li></ul><h3>বীজ কি সরাসরি খাওয়া যায়?</h3><p>হ্যাঁ, তবে ভাজলে স্বাদ ভালো হয়।</p><h3>খোসা সহ খাব?</h3><p>প্রচলিত নিয়মে খোসা ভেঙে ভেতরের শাঁস খাওয়া হয়; খোসা শক্ত বলে সবাই গিলে খান না।</p><h3>কতদিন ভালো থাকে?</h3><p>শুকনো ও বায়ুরোধী অবস্থায় কয়েক মাস; মেয়াদ প্যাকেটে দেখুন।</p></article><article><h2>হলুদের গুঁড়া: রং, ঘ্রাণ ও রান্নায় সঠিক ব্যবহার</h2><p>রান্নায় রং ও ঘ্রাণ আনতে হলুদের গুঁড়া অপরিহার্য। গাঢ় হলুদ রং ও নিজস্ব সুগন্ধ ভালো হলুদের লক্ষণ।</p><p>হলুদ বাঙালির প্রতিদিনের রান্নার মূল উপাদান। ভালো হলুদের রং গাঢ় ও ঘ্রাণ সতেজ হয়।</p><h3>ভালো হলুদ চিনবেন কীভাবে</h3><p>রং গাঢ় সোনালি-হলুদ, ঘ্রাণ তাজা, গুঁড়া মসৃণ — অতিরিক্ত কৃত্রিম উজ্জ্বল রং থাকলে সন্দেহ করুন।</p><h3>রান্নায় কখন দেবেন</h3><p>মাছ-মাংস মাখানোর সময় ও রান্নার শুরুতে তেলে অল্প ভেজে নিলে ঘ্রাণ ফোটে। বেশি পুড়ে গেলে তেতো হয়।</p><h3>কীভাবে রাখবেন</h3><p>বায়ুরোধী কৌটায় আলো-আর্দ্রতা থেকে দূরে রাখলে রং ও ঘ্রাণ বেশিদিন থাকে।</p><h3>রান্নায় হলুদের সঠিক সময়</h3><p>মাছ বা মাংস মাখানোর সময় লবণ-হলুদ মাখিয়ে রেখে দিলে রান্নায় রং ভালো আসে এবং কাঁচা গন্ধ কমে। ডাল বা সবজিতে ফোড়নের পর হলুদ দিয়ে অল্প নেড়ে নিন।</p><h3>দাগ ওঠানোর টিপস</h3><p>হলুদের দাগ লাগলে কাপড় সরাসরি রোদে শুকাতে দিলে দাগ অনেকটা হালকা হয়ে যায়। রান্নাঘরের কাউন্টারে লাগলে লেবুর রস ও লবণ ঘষে পরিষ্কার করা যায়।</p><h3>ভালো গুঁড়া মসলা চেনার উপায়</h3><p>তাজা গুঁড়া মসলার রং প্রাকৃতিক ও ঘ্রাণ তীব্র হয়। রং অস্বাভাবিক উজ্জ্বল, ঘ্রাণ ফ্যাকাশে বা গুঁড়ায় দানা-দানা ভেজা ভাব থাকলে সন্দেহ করুন। ঘরে সহজ পরীক্ষা: সামান্য গুঁড়া হাতের তালুতে ঘষে ঘ্রাণ নিন — ভালো মসলার ঘ্রাণ কয়েক সেকেন্ডেই ফুটে ওঠে। বিশ্বাসযোগ্য উৎস ও প্যাকিং তারিখই সবচেয়ে বড় ভরসা।</p><h3>মসলা সংরক্ষণ ও মেয়াদ</h3><p>গুঁড়া মসলার শত্রু আলো, তাপ, বাতাস ও আর্দ্রতা। বায়ুরোধী কাচের বা স্টিলের কৌটায়, চুলা ও জানালা থেকে দূরে রাখুন। শুকনো চামচ ব্যবহার করুন এবং অল্প অল্প করে কিনুন — এতে ঘ্রাণ ও রং বেশিদিন ঠিক থাকে। সাধারণত ৬–১২ মাসের মধ্যে ব্যবহার করা ভালো।</p><h3>রান্নায় মসলা ব্যবহারের কৌশল</h3><p>মসলা তেলে অল্প আঁচে নেড়ে নিলে ঘ্রাণ ফোটে, তবে পুড়ে গেলে তেতো হয়। ভেজা মসলা (পানিতে গুলে) দিলে রং ভালো আসে এবং পোড়ার ঝুঁকি কমে। পরিমাণ অল্প দিয়ে শুরু করে স্বাদ দেখে বাড়ান। বিভিন্ন মসলার মিশ্রণ রান্নায় ভারসাম্য আনে।</p><ul><li>শুকনো চামচ ব্যবহার করুন।</li><li>চুলার কাছে রাখবেন না।</li></ul><h3>রং কালচে কেন?</h3><p>পুরনো হলে বা আর্দ্রতা পেলে রং কমে যায়।</p><h3>কতদিন ব্যবহার করা যায়?</h3><p>প্যাকেটের মেয়াদ ও সংরক্ষণের ওপর নির্ভর করে।</p></article><article><h2>মরিচের গুঁড়া: ঝাল, রং ও সঠিক সংরক্ষণ</h2><p>রান্নায় ঝাল ও লাল রং আনার প্রধান মসলা। শুকনো মরিচ পিষে তৈরি।</p><p>মরিচের গুঁড়ার ঝাল আসে ক্যাপসাইসিন নামক উপাদান থেকে। জাতের ওপর নির্ভর করে ঝাল ও রঙের তারতম্য হয়।</p><h3>ঝাল ও রং</h3><p>কিছু মরিচের রং গাঢ় কিন্তু ঝাল কম, কিছুতে ঝাল বেশি। তাই পছন্দমতো ব্যবহার করুন।</p><h3>রান্নায়</h3><p>মাংস, ডাল, ভর্তা ও আচারে ব্যবহার করা হয়। বেশি তেলে পুড়িয়ে ফেললে তেতো হয়।</p><h3>সংরক্ষণ</h3><p>আর্দ্রতা মরিচের গুঁড়ায় ছত্রাক ধরাতে পারে; তাই বায়ুরোধী, শুকনো কৌটা ব্যবহার করুন।</p><h3>ঝালের মাত্রা ঠিক করার কৌশল</h3><p>পরিমাণ ধীরে ধীরে বাড়িয়ে স্বাদ দেখে নিন। অতিরিক্ত ঝাল হয়ে গেলে টক দই, নারকেল দুধ বা সামান্য চিনি মিশিয়ে ভারসাম্য আনা যায়।</p><h3>রং ভালো পেতে</h3><p>মরিচের গুঁড়া সামান্য পানিতে গুলে পেস্ট করে নিয়ে তেলে ছাড়লে পোড়ার ভয় থাকে না এবং রঙও উজ্জ্বল হয়।</p><h3>ভালো গুঁড়া মসলা চেনার উপায়</h3><p>তাজা গুঁড়া মসলার রং প্রাকৃতিক ও ঘ্রাণ তীব্র হয়। রং অস্বাভাবিক উজ্জ্বল, ঘ্রাণ ফ্যাকাশে বা গুঁড়ায় দানা-দানা ভেজা ভাব থাকলে সন্দেহ করুন। ঘরে সহজ পরীক্ষা: সামান্য গুঁড়া হাতের তালুতে ঘষে ঘ্রাণ নিন — ভালো মসলার ঘ্রাণ কয়েক সেকেন্ডেই ফুটে ওঠে। বিশ্বাসযোগ্য উৎস ও প্যাকিং তারিখই সবচেয়ে বড় ভরসা।</p><h3>মসলা সংরক্ষণ ও মেয়াদ</h3><p>গুঁড়া মসলার শত্রু আলো, তাপ, বাতাস ও আর্দ্রতা। বায়ুরোধী কাচের বা স্টিলের কৌটায়, চুলা ও জানালা থেকে দূরে রাখুন। শুকনো চামচ ব্যবহার করুন এবং অল্প অল্প করে কিনুন — এতে ঘ্রাণ ও রং বেশিদিন ঠিক থাকে। সাধারণত ৬–১২ মাসের মধ্যে ব্যবহার করা ভালো।</p><h3>রান্নায় মসলা ব্যবহারের কৌশল</h3><p>মসলা তেলে অল্প আঁচে নেড়ে নিলে ঘ্রাণ ফোটে, তবে পুড়ে গেলে তেতো হয়। ভেজা মসলা (পানিতে গুলে) দিলে রং ভালো আসে এবং পোড়ার ঝুঁকি কমে। পরিমাণ অল্প দিয়ে শুরু করে স্বাদ দেখে বাড়ান। বিভিন্ন মসলার মিশ্রণ রান্নায় ভারসাম্য আনে।</p><ul><li>শুকনো চামচ ব্যবহার করুন।</li><li>অল্প অল্প করে কিনুন।</li></ul><h3>ঝাল কম করতে কী করব?</h3><p>পরিমাণ কমান বা অল্প টক দই যোগ করুন।</p><h3>চোখে লাগলে?</h3><p>পরিষ্কার পানি দিয়ে ধুয়ে নিন।</p></article><article><h2>ধনিয়ার গুঁড়া: সুগন্ধ ও রান্নায় সঠিক ব্যবহার</h2><p>ধনিয়া বীজ পিষে তৈরি মোলায়েম সুগন্ধি মসলা। ঝোল ও ভুনায় মিষ্টি-লেবুর মতো সুবাস দেয়।</p><p>ধনিয়ার গুঁড়া অন্য মসলার ঝাঁঝ সামলে রান্নায় ভারসাম্য আনে।</p><h3>স্বাদ ও ঘ্রাণ</h3><p>মৃদু সাইট্রাস-মিষ্টি সুবাস। ঝালের সাথে মিশলে রান্না মোলায়েম হয়।</p><h3>কোথায় ব্যবহার করবেন</h3><p>মাছ-মাংসের ঝোল, ডাল, সবজি, কোরমা ও ভর্তায়।</p><h3>কীভাবে রাখবেন</h3><p>বায়ুরোধী কৌটায় আলো থেকে দূরে রাখুন।</p><h3>মসলার মিশ্রণে ধনিয়ার ভূমিকা</h3><p>ধনিয়া গুঁড়া ঝাল ও উষ্ণতার সাথে মৃদু মিষ্টি-লেবুর ভাব যোগ করে রান্নাকে সুষম করে। হলুদ, জিরা, মরিচের সাথে একসাথে মেশালে সহজেই ঘরোয়া মসলার মিশ্রণ তৈরি হয়।</p><h3>আপনার নিজস্ব মসলার মিশ্রণ</h3><p>ধনিয়া ২ ভাগ, জিরা ১ ভাগ ও হলুদ আধা ভাগ মিশিয়ে একটি ঘরোয়া মিশ্রণ তৈরি করে রাখলে প্রতিদিনের রান্নায় সময় বাঁচে।</p><h3>ভালো গুঁড়া মসলা চেনার উপায়</h3><p>তাজা গুঁড়া মসলার রং প্রাকৃতিক ও ঘ্রাণ তীব্র হয়। রং অস্বাভাবিক উজ্জ্বল, ঘ্রাণ ফ্যাকাশে বা গুঁড়ায় দানা-দানা ভেজা ভাব থাকলে সন্দেহ করুন। ঘরে সহজ পরীক্ষা: সামান্য গুঁড়া হাতের তালুতে ঘষে ঘ্রাণ নিন — ভালো মসলার ঘ্রাণ কয়েক সেকেন্ডেই ফুটে ওঠে। বিশ্বাসযোগ্য উৎস ও প্যাকিং তারিখই সবচেয়ে বড় ভরসা।</p><h3>মসলা সংরক্ষণ ও মেয়াদ</h3><p>গুঁড়া মসলার শত্রু আলো, তাপ, বাতাস ও আর্দ্রতা। বায়ুরোধী কাচের বা স্টিলের কৌটায়, চুলা ও জানালা থেকে দূরে রাখুন। শুকনো চামচ ব্যবহার করুন এবং অল্প অল্প করে কিনুন — এতে ঘ্রাণ ও রং বেশিদিন ঠিক থাকে। সাধারণত ৬–১২ মাসের মধ্যে ব্যবহার করা ভালো।</p><h3>রান্নায় মসলা ব্যবহারের কৌশল</h3><p>মসলা তেলে অল্প আঁচে নেড়ে নিলে ঘ্রাণ ফোটে, তবে পুড়ে গেলে তেতো হয়। ভেজা মসলা (পানিতে গুলে) দিলে রং ভালো আসে এবং পোড়ার ঝুঁকি কমে। পরিমাণ অল্প দিয়ে শুরু করে স্বাদ দেখে বাড়ান। বিভিন্ন মসলার মিশ্রণ রান্নায় ভারসাম্য আনে।</p><ul><li>তেলে অল্প নেড়ে দিলে ঘ্রাণ বাড়ে।</li><li>ভেজা চামচ ব্যবহার করবেন না।</li></ul><h3>ঘ্রাণ কমে গেছে কেন?</h3><p>পুরনো হলে বা খোলা রাখলে ঘ্রাণ কমে যায়।</p><h3>ভেজে নেওয়া দরকার?</h3><p>না; তবে অল্প ভেজে নিলে স্বাদ বাড়ে।</p></article><article><h2>জিরার গুঁড়া: উষ্ণ সুবাস ও ব্যবহার</h2><p>ভাজা বা কাঁচা জিরা পিষে তৈরি উষ্ণ সুবাসের মসলা। ডাল, ভর্তা ও মাংস রান্নায় জনপ্রিয়।</p><p>জিরা বাংলাদেশসহ দক্ষিণ এশিয়ার রান্নার প্রাণ। জিরার গুঁড়ার সুবাস রান্নাকে আলাদা মাত্রা দেয়।</p><h3>স্বাদ ও ঘ্রাণ</h3><p>মাটির মতো উষ্ণ ঘ্রাণ ও সামান্য তিতকুটে স্বাদ।</p><h3>কীভাবে ব্যবহার করবেন</h3><p>ডালে ফোড়ন, দই-ভর্তা, মাংস, সালাদ ও নানা মসলার মিশ্রণে।</p><h3>সংরক্ষণ</h3><p>বায়ুরোধী কৌটায় আর্দ্রতা থেকে দূরে রাখুন।</p><h3>জিরার গুঁড়া দিয়ে সহজ রেসিপি</h3><p>দই-জিরা সালাদ, ভাজা জিরার ঘোল (লবণ ও পুদিনা দিয়ে), বা ডালে ফোড়ন — সবই সহজ ও সুস্বাদু। গরমে জিরা ঘোল বিশেষ জনপ্রিয়।</p><h3>ভাজা জিরার গুঁড়া ঘরে বানানো</h3><p>শুকনো কড়াইতে অল্প আঁচে জিরা হালকা বাদামি করে ভেজে ঠান্ডা করে মিহি গুঁড়া করুন। তাজা ভাজা জিরার ঘ্রাণ অনেক গভীর।</p><h3>ভালো গুঁড়া মসলা চেনার উপায়</h3><p>তাজা গুঁড়া মসলার রং প্রাকৃতিক ও ঘ্রাণ তীব্র হয়। রং অস্বাভাবিক উজ্জ্বল, ঘ্রাণ ফ্যাকাশে বা গুঁড়ায় দানা-দানা ভেজা ভাব থাকলে সন্দেহ করুন। ঘরে সহজ পরীক্ষা: সামান্য গুঁড়া হাতের তালুতে ঘষে ঘ্রাণ নিন — ভালো মসলার ঘ্রাণ কয়েক সেকেন্ডেই ফুটে ওঠে। বিশ্বাসযোগ্য উৎস ও প্যাকিং তারিখই সবচেয়ে বড় ভরসা।</p><h3>মসলা সংরক্ষণ ও মেয়াদ</h3><p>গুঁড়া মসলার শত্রু আলো, তাপ, বাতাস ও আর্দ্রতা। বায়ুরোধী কাচের বা স্টিলের কৌটায়, চুলা ও জানালা থেকে দূরে রাখুন। শুকনো চামচ ব্যবহার করুন এবং অল্প অল্প করে কিনুন — এতে ঘ্রাণ ও রং বেশিদিন ঠিক থাকে। সাধারণত ৬–১২ মাসের মধ্যে ব্যবহার করা ভালো।</p><h3>রান্নায় মসলা ব্যবহারের কৌশল</h3><p>মসলা তেলে অল্প আঁচে নেড়ে নিলে ঘ্রাণ ফোটে, তবে পুড়ে গেলে তেতো হয়। ভেজা মসলা (পানিতে গুলে) দিলে রং ভালো আসে এবং পোড়ার ঝুঁকি কমে। পরিমাণ অল্প দিয়ে শুরু করে স্বাদ দেখে বাড়ান। বিভিন্ন মসলার মিশ্রণ রান্নায় ভারসাম্য আনে।</p><ul><li>রান্নার একদম শেষে ছিটালে ঘ্রাণ বেশি পাওয়া যায়।</li><li>শুকনো চামচ ব্যবহার করুন।</li></ul><h3>ভাজা জিরা আর কাঁচা জিরার পার্থক্য?</h3><p>ভাজা জিরার ঘ্রাণ আরও গাঢ় হয়।</p><h3>কতটুকু দেব?</h3><p>অল্প দিয়ে শুরু করুন; বেশি হলে তেতো লাগতে পারে।</p></article><article><h2>চা: সঠিকভাবে বানানোর কৌশল ও সংরক্ষণ</h2><p>সতেজ ঘ্রাণ ও গাঢ় লিকারের চা। সঠিক পানির তাপমাত্রা ও সময় মানলে স্বাদ বেশি ভালো হয়।</p><p>চা বাংলাদেশের জনপ্রিয় পানীয়। সঠিক নিয়মে বানালে সুগন্ধ ও স্বাদ পুরো পাওয়া যায়।</p><h3>সঠিকভাবে বানানোর নিয়ম</h3><p>এক কাপ পানিতে এক চা-চামচ পাতা দিন; পানি ফুটিয়ে একটু ঠান্ডা করে (প্রায় ৮০–৯০°C) ঢালুন এবং ২–৩ মিনিট ভিজিয়ে ছেঁকে নিন।</p><h3>দুধ-চিনি</h3><p>চাইলে দুধ ও চিনি মেশান; তবে দুধ-চিনি ছাড়া খেলে আসল ঘ্রাণ বোঝা যায়।</p><h3>সংরক্ষণ</h3><p>বায়ুরোধী কৌটায় আলো ও আর্দ্রতা থেকে দূরে রাখুন।</p><h3>দুধ চা বানানোর ধাপ</h3><p>এক কাপ পানি ফুটিয়ে ১ চা-চামচ পাতা দিন এবং ২ মিনিট ফুটতে দিন। এরপর আধা কাপ দুধ মিশিয়ে আরও ১ মিনিট ফুটিয়ে ছেঁকে নিন। চিনি ও এলাচ প্রয়োজনমতো দিন।</p><h3>ঠান্ডা চা (আইসড টি)</h3><p>লিকার চা বানিয়ে ঠান্ডা করে লেবু, পুদিনা পাতা ও বরফ মিশিয়ে নিলে গরমের দিনে সতেজ পানীয় তৈরি হয়। চাইলে সামান্য মধু যোগ করুন।</p><h3>ভালো চা চেনার উপায়</h3><p>ভালো চায়ের পাতা সমান আকারের, শুকনো ও সুগন্ধি হয়। বেশি গুঁড়া, ধুলো বা ভেজা-ভেজা ভাব থাকলে মান কম হতে পারে। চা বানালে লিকারের রং পরিষ্কার ও গাঢ় হবে এবং স্বাদে সামান্য কষ ও মিষ্টি ভাব থাকবে। প্যাকেটে প্যাকিং তারিখ ও মেয়াদ দেখে নিন।</p><h3>লিকার, দুধ চা ও আলাদা স্টাইলের পার্থক্য</h3><p>লিকার চা পানি ও পাতায় তৈরি, তাই আসল স্বাদ বোঝা যায়। দুধ চায়ে পাতা একটু বেশি সময় ফুটিয়ে দুধ মেশালে ঘন ও ক্রিমি স্বাদ আসে। গরম বা ঠান্ডা — আপনার পছন্দমতো লেবু, আদা, এলাচ বা সামান্য মধু মিশিয়ে নতুন স্বাদ বানাতে পারেন।</p><h3>চা সংরক্ষণের নিয়ম</h3><p>চায়ের পাতা গন্ধ শোষণ করে, তাই মসলা বা অন্য উগ্র গন্ধের পণ্যের পাশে রাখবেন না। বায়ুরোধী কৌটায় আলো ও আর্দ্রতা থেকে দূরে রাখুন। ফ্রিজে রাখার দরকার নেই; বরং ফ্রিজের ভেজা পরিবেশ চায়ের ক্ষতি করতে পারে।</p><ul><li>বেশিক্ষণ ভেজাবেন না, তেতো হবে।</li><li>ভেজা চামচ ঢোকাবেন না।</li></ul><h3>লিকার হালকা কেন?</h3><p>পাতা কম বা সময় কম হলে লিকার হালকা হয়।</p><h3>দিনে কয়বার চা খাওয়া ভালো?</h3><p>পরিমিত; ক্যাফেইনের প্রতি সংবেদনশীল হলে কম খান।</p></article><article><h2>গ্রিন টি: সঠিক তাপমাত্রা, সময় ও নিয়মে কীভাবে বানাবেন</h2><p>ফারমেন্ট না করা তাজা সবুজ চা-পাতা; হালকা ঘাসের মতো ঘ্রাণ ও কম তেতো স্বাদ। ৭০–৮০° সেলসিয়াস গরম পানিতে ২–৩ মিনিট ভিজিয়ে খান।</p><p>গ্রিন টি এবং ব্ল্যাক টি একই চা গাছ (Camellia sinensis) থেকে আসে; পার্থক্য হলো প্রক্রিয়ায়। গ্রিন টিতে পাতা খুব অল্প জারণ হয়, তাই রং সবুজ থাকে ও স্বাদ হালকা ও তাজা হয়। অনেকেই দুধ-চিনি ছাড়া পান করেন।</p><h3>কীভাবে বানাবেন</h3><p>১ কাপ পানি ফুটিয়ে ১–২ মিনিট ঠান্ডা করে নিন (প্রায় ৭০–৮০° সে.)। প্রতি কাপে ১ চা-চামচ (প্রায় ২ গ্রাম) পাতা দিয়ে ২–৩ মিনিট ঢেকে রাখুন, তারপর ছেঁকে নিন। ফুটন্ত পানি বা বেশি সময় ভেজালে তেতো হয়ে যায়।</p><h3>স্বাদ বাড়াতে</h3><p>লেবুর রস, পুদিনা পাতা বা সামান্য মধু মেশাতে পারেন। দুধ মিশিয়ে সাধারণত খাওয়া হয় না। ঠান্ডা গ্রিন টি বানাতে গরম চা ঠান্ডা করে বরফ দিন।</p><h3>কখন কতটা</h3><p>দিনে ২–৩ কাপ অনেকের জন্য ঠিক। এতে ক্যাফেইন আছে, তাই ঘুমের কয়েক ঘণ্টা আগে এড়িয়ে চলা ভালো। খালি পেটে কড়া চা কারও কারও অম্বল বাড়ায়।</p><h3>কী দেখে কিনবেন</h3><p>পাতার রং হালকা সবুজ থেকে অলিভ হলে ভালো; পুরোপুরি বাদামি বা ধুলোর মতো হলে পুরনো। প্যাকেট শক্তভাবে বন্ধ আছে কি না দেখুন।</p><h3>ঠান্ডা গ্রিন টি</h3><p>১ টেবিল-চামচ পাতা ১ লিটার ঠান্ডা পানিতে ৬–৮ ঘণ্টা ফ্রিজে রেখে ছেঁকে নিলে কম তেতো ঠান্ডা গ্রিন টি তৈরি হয়।</p><h3>ভালো চা চেনার উপায়</h3><p>ভালো চায়ের পাতা সমান আকারের, শুকনো ও সুগন্ধি হয়। বেশি গুঁড়া, ধুলো বা ভেজা-ভেজা ভাব থাকলে মান কম হতে পারে। চা বানালে লিকারের রং পরিষ্কার ও গাঢ় হবে এবং স্বাদে সামান্য কষ ও মিষ্টি ভাব থাকবে। প্যাকেটে প্যাকিং তারিখ ও মেয়াদ দেখে নিন।</p><h3>লিকার, দুধ চা ও আলাদা স্টাইলের পার্থক্য</h3><p>লিকার চা পানি ও পাতায় তৈরি, তাই আসল স্বাদ বোঝা যায়। দুধ চায়ে পাতা একটু বেশি সময় ফুটিয়ে দুধ মেশালে ঘন ও ক্রিমি স্বাদ আসে। গরম বা ঠান্ডা — আপনার পছন্দমতো লেবু, আদা, এলাচ বা সামান্য মধু মিশিয়ে নতুন স্বাদ বানাতে পারেন।</p><h3>চা সংরক্ষণের নিয়ম</h3><p>চায়ের পাতা গন্ধ শোষণ করে, তাই মসলা বা অন্য উগ্র গন্ধের পণ্যের পাশে রাখবেন না। বায়ুরোধী কৌটায় আলো ও আর্দ্রতা থেকে দূরে রাখুন। ফ্রিজে রাখার দরকার নেই; বরং ফ্রিজের ভেজা পরিবেশ চায়ের ক্ষতি করতে পারে।</p><ul><li>আলো, আর্দ্রতা ও গন্ধ থেকে দূরে বায়ুরোধী কৌটায় রাখুন।</li><li>খোলা প্যাকেট ২–৩ মাসের মধ্যে ব্যবহার করুন।</li><li>একই পাতা ২য় বার ভেজানো যায়, তবে স্বাদ হালকা হবে।</li></ul><h3>গ্রিন টি কি ওজন কমায়?</h3><p>কোনো পানীয়ই একা ওজন কমায় না। চিনি-দুধ ছাড়া হওয়ায় ক্যালরি কম, এটুকুই সুবিধা।</p><h3>গর্ভাবস্থায় খাওয়া যাবে?</h3><p>ক্যাফেইনের কারণে পরিমাণ সীমিত রাখুন এবং চিকিৎসকের পরামর্শ নিন।</p><h3>গ্রিন টি আর ব্ল্যাক টির পার্থক্য কী?</h3><p>একই গাছ; প্রক্রিয়া আলাদা। গ্রিন টি হালকা ও তাজা, ব্ল্যাক টি গাঢ় ও কড়া।</p></article><article><h2>ব্ল্যাক টি: কড়া লিকার, দুধ চা ও লেবু চা বানানোর সঠিক নিয়ম</h2><p>পুরোপুরি জারিত গাঢ় চা-পাতা; কড়া রং ও গাঢ় স্বাদ। দুধ চা, লিকার চা বা লেবু চা — সবভাবেই মানানসই।</p><p>ব্ল্যাক টি আমাদের সবচেয়ে চেনা চা। পাতা শুকানো, মোচড়ানো ও পুরোপুরি জারিত করার ফলে গাঢ় বাদামি-কালচে রং, কড়া ঘ্রাণ ও পূর্ণ স্বাদ পাওয়া যায়। সকালের নাস্তা বা বিকেলের আড্ডা — দুই সময়েই এটি জনপ্রিয়।</p><h3>লিকার চা</h3><p>প্রতি কাপে ১ চা-চামচ পাতা, ফুটন্ত পানি (প্রায় ৯৫–১০০° সে.) ঢেলে ৩–৪ মিনিট ঢেকে রাখুন; ছেঁকে চিনি বা মধু মেশাতে পারেন। বেশি সময় ভেজালে তেতো হয়।</p><h3>দুধ চা</h3><p>পানিতে পাতা দিয়ে ২–৩ মিনিট ফোটান, এরপর গরম দুধ ও চিনি মিশিয়ে আরও ১ মিনিট রেখে ছেঁকে নিন। কড়া স্বাদ চাইলে পাতার পরিমাণ একটু বাড়ান।</p><h3>লেবু ও মশলা চা</h3><p>লিকার চায়ে লেবুর রস ও সামান্য মধু দিন। শীতে আদা, এলাচ বা দারুচিনি মিশিয়ে মশলা চা বানানো যায়।</p><h3>কী দেখে কিনবেন</h3><p>পাতা সমান আকারের, গাঢ় রঙের ও শুকনো মচমচে হলে ভালো। অতিরিক্ত গুঁড়া বা ধুলো বেশি হলে লিকার ঘোলা ও তেতো হয়।</p><h3>আইসড লেমন টি</h3><p>কড়া ব্ল্যাক টি ঠান্ডা করে লেবুর রস, মধু ও বরফ মিশিয়ে আইসড টি বানানো যায়।</p><h3>ভালো চা চেনার উপায়</h3><p>ভালো চায়ের পাতা সমান আকারের, শুকনো ও সুগন্ধি হয়। বেশি গুঁড়া, ধুলো বা ভেজা-ভেজা ভাব থাকলে মান কম হতে পারে। চা বানালে লিকারের রং পরিষ্কার ও গাঢ় হবে এবং স্বাদে সামান্য কষ ও মিষ্টি ভাব থাকবে। প্যাকেটে প্যাকিং তারিখ ও মেয়াদ দেখে নিন।</p><h3>লিকার, দুধ চা ও আলাদা স্টাইলের পার্থক্য</h3><p>লিকার চা পানি ও পাতায় তৈরি, তাই আসল স্বাদ বোঝা যায়। দুধ চায়ে পাতা একটু বেশি সময় ফুটিয়ে দুধ মেশালে ঘন ও ক্রিমি স্বাদ আসে। গরম বা ঠান্ডা — আপনার পছন্দমতো লেবু, আদা, এলাচ বা সামান্য মধু মিশিয়ে নতুন স্বাদ বানাতে পারেন।</p><h3>চা সংরক্ষণের নিয়ম</h3><p>চায়ের পাতা গন্ধ শোষণ করে, তাই মসলা বা অন্য উগ্র গন্ধের পণ্যের পাশে রাখবেন না। বায়ুরোধী কৌটায় আলো ও আর্দ্রতা থেকে দূরে রাখুন। ফ্রিজে রাখার দরকার নেই; বরং ফ্রিজের ভেজা পরিবেশ চায়ের ক্ষতি করতে পারে।</p><ul><li>শুকনো, বায়ুরোধী কৌটায় রাখুন; ভেজা চামচ ঢোকাবেন না।</li><li>ঝাঁঝালো গন্ধের মসলা বা সাবানের পাশে রাখবেন না; চা গন্ধ টেনে নেয়।</li><li>রাতে ঘুমের সমস্যা থাকলে সন্ধ্যার পর কম খান।</li></ul><h3>দিনে কয় কাপ ঠিক আছে?</h3><p>সুস্থ মানুষ সাধারণত ২–৪ কাপ পান করেন। ক্যাফেইনে সংবেদনশীল হলে কম খান।</p><h3>দুধ চায়ে কেন তেতো লাগে?</h3><p>বেশি সময় ফোটালে বা পাতা বেশি দিলে এমন হয়; সময় ও পরিমাণ কমান।</p><h3>কতদিন ভালো থাকে?</h3><p>সঠিকভাবে রাখলে খোলার পর ২–৩ মাস স্বাদ ভালো থাকে।</p></article><article><h2>তুলসী পাতার চা: ভেষজ ঘ্রাণ, বানানোর নিয়ম ও সতর্কতা</h2><p>শুকনো তুলসী পাতার ক্যাফেইনমুক্ত ভেষজ চা; ঝাঁঝালো মিষ্টি ঘ্রাণ ও হালকা স্বাদ। ঋতু বদলের সময় গরম গরম পান করতে অনেকে ভালোবাসেন।</p><p>তুলসী ভারতীয় উপমহাদেশে ঘরোয়া ভেষজ হিসেবে বহুদিন ধরে পরিচিত। শুকনো তুলসী পাতার চা (Tulsi / Holy basil tea) চা-গাছের পাতা নয়, তাই সাধারণত ক্যাফেইনমুক্ত। এর ঘ্রাণ লবঙ্গ ও পুদিনার মাঝামাঝি, স্বাদে হালকা ঝাঁজ থাকে।</p><h3>কীভাবে বানাবেন</h3><p>১ কাপ ফুটন্ত পানিতে ১ চা-চামচ শুকনো তুলসী পাতা দিন, ঢেকে ৫–৭ মিনিট ভিজিয়ে ছেঁকে নিন। আদা বা মধু মিশিয়ে পান করা যায়। ঢেকে রাখলে সুগন্ধ ধরে থাকে।</p><h3>কখন পান করবেন</h3><p>সকাল-বিকেল বা ঠান্ডা ও আবহাওয়া বদলের দিনে গরম পানীয় হিসেবে। যেহেতু এতে ক্যাফেইন নেই, রাতেও অনেকে পান করেন।</p><h3>স্বাদ বাড়াতে</h3><p>লেবুর রস, আদা, মধু বা অল্প দারুচিনি মেশান। ঠান্ডা করে বরফ দিয়ে খেলেও ভালো লাগে।</p><h3>ঐতিহ্য ও বৈজ্ঞানিক সীমা</h3><p>তুলসী নিয়ে ঐতিহ্যবাহী ব্যবহার অনেক, কিন্তু রোগ সারানোর পাকা প্রমাণ সীমিত। তাই এটিকে ঘরোয়া আরামদায়ক পানীয় হিসেবে দেখাই ঠিক, ওষুধের বিকল্প নয়।</p><h3>আদা-মধু মিশ্রণ</h3><p>তুলসী চায়ে আদার ছোট টুকরো ও অল্প মধু মেশালে শীতের দিনে আরামদায়ক গরম পানীয় হয়।</p><h3>ভালো চা চেনার উপায়</h3><p>ভালো চায়ের পাতা সমান আকারের, শুকনো ও সুগন্ধি হয়। বেশি গুঁড়া, ধুলো বা ভেজা-ভেজা ভাব থাকলে মান কম হতে পারে। চা বানালে লিকারের রং পরিষ্কার ও গাঢ় হবে এবং স্বাদে সামান্য কষ ও মিষ্টি ভাব থাকবে। প্যাকেটে প্যাকিং তারিখ ও মেয়াদ দেখে নিন।</p><h3>লিকার, দুধ চা ও আলাদা স্টাইলের পার্থক্য</h3><p>লিকার চা পানি ও পাতায় তৈরি, তাই আসল স্বাদ বোঝা যায়। দুধ চায়ে পাতা একটু বেশি সময় ফুটিয়ে দুধ মেশালে ঘন ও ক্রিমি স্বাদ আসে। গরম বা ঠান্ডা — আপনার পছন্দমতো লেবু, আদা, এলাচ বা সামান্য মধু মিশিয়ে নতুন স্বাদ বানাতে পারেন।</p><h3>চা সংরক্ষণের নিয়ম</h3><p>চায়ের পাতা গন্ধ শোষণ করে, তাই মসলা বা অন্য উগ্র গন্ধের পণ্যের পাশে রাখবেন না। বায়ুরোধী কৌটায় আলো ও আর্দ্রতা থেকে দূরে রাখুন। ফ্রিজে রাখার দরকার নেই; বরং ফ্রিজের ভেজা পরিবেশ চায়ের ক্ষতি করতে পারে।</p><ul><li>রোদ ও আর্দ্রতা থেকে দূরে বায়ুরোধী কৌটায় রাখুন।</li><li>গর্ভাবস্থা, স্তন্যদান বা নিয়মিত ওষুধ চললে আগে চিকিৎসকের পরামর্শ নিন।</li><li>দিনে ২–৩ কাপের বেশি না খাওয়াই ভালো।</li></ul><h3>তুলসী চায়ে কি ক্যাফেইন আছে?</h3><p>না, এটি চা-গাছের পাতা নয়; সাধারণত ক্যাফেইনমুক্ত।</p><h3>সর্দি-কাশিতে কি কাজ করে?</h3><p>গরম পানীয় গলা আরাম দিতে পারে; তবে রোগের চিকিৎসা নয়। সমস্যা বাড়লে ডাক্তার দেখান।</p><h3>কতদিন ভালো থাকে?</h3><p>শুকনো ও বায়ুরোধী অবস্থায় কয়েক মাস।</p></article><article><h2>আদা চা পাতা: আদা-মেশানো চা বানানোর সহজ নিয়ম ও টিপস</h2><p>চা-পাতার সাথে আদার ঝাঁজ মেশানো মিক্স; এক কাপেই চা ও আদার স্বাদ পাওয়া যায়। শীতে ও বৃষ্টির দিনে গরম গরম আরামদায়ক।</p><p>আদা চা বাংলাদেশের ঘরে ঘরে জনপ্রিয়। প্রতিবার আদা ছেঁচে চা বানানোর ঝামেলা এড়াতে আদা-মেশানো চা-পাতার মিক্স অনেকে বেছে নেন। এতে চা-পাতার গাঢ় স্বাদের সাথে আদার ঝাঁজ ও ঘ্রাণ একসাথে পাওয়া যায়।</p><h3>কীভাবে বানাবেন</h3><p>১ কাপ পানিতে ১–১½ চা-চামচ মিক্স দিয়ে ২–৩ মিনিট ফোটান, তারপর ছেঁকে নিন। দুধ চা চাইলে ফোটানো শেষে গরম দুধ ও চিনি মিশিয়ে আরও ১ মিনিট রাখুন।</p><h3>ঝাঁজ কমানো বা বাড়ানো</h3><p>ঝাঁজ বেশি লাগলে পাতা কমান ও দুধ বেশি দিন। আরও ঝাঁজ চাইলে সামান্য টাটকা আদা কুচি যোগ করুন।</p><h3>কখন ভালো লাগে</h3><p>ঠান্ডা, বৃষ্টির দিনে বা গলা খুসখুস করলে গরম আদা চা আরাম দেয়। অতিথি আপ্যায়নেও দ্রুত বানানো যায়।</p><h3>সতর্কতা</h3><p>আদা বেশি খেলে কারও অম্বল হতে পারে। পিত্তথলির পাথর, রক্তপাতজনিত সমস্যা বা রক্ত পাতলা করার ওষুধ চললে চিকিৎসকের পরামর্শ নিন।</p><h3>দুধ চা ফর্মুলা</h3><p>১ কাপ পানি + ১ চা-চামচ মিক্স ফুটিয়ে ½ কাপ দুধ দিন, আরও ১ মিনিট রেখে ছাঁকুন; চিনি স্বাদমতো।</p><h3>ভালো চা চেনার উপায়</h3><p>ভালো চায়ের পাতা সমান আকারের, শুকনো ও সুগন্ধি হয়। বেশি গুঁড়া, ধুলো বা ভেজা-ভেজা ভাব থাকলে মান কম হতে পারে। চা বানালে লিকারের রং পরিষ্কার ও গাঢ় হবে এবং স্বাদে সামান্য কষ ও মিষ্টি ভাব থাকবে। প্যাকেটে প্যাকিং তারিখ ও মেয়াদ দেখে নিন।</p><h3>লিকার, দুধ চা ও আলাদা স্টাইলের পার্থক্য</h3><p>লিকার চা পানি ও পাতায় তৈরি, তাই আসল স্বাদ বোঝা যায়। দুধ চায়ে পাতা একটু বেশি সময় ফুটিয়ে দুধ মেশালে ঘন ও ক্রিমি স্বাদ আসে। গরম বা ঠান্ডা — আপনার পছন্দমতো লেবু, আদা, এলাচ বা সামান্য মধু মিশিয়ে নতুন স্বাদ বানাতে পারেন।</p><h3>চা সংরক্ষণের নিয়ম</h3><p>চায়ের পাতা গন্ধ শোষণ করে, তাই মসলা বা অন্য উগ্র গন্ধের পণ্যের পাশে রাখবেন না। বায়ুরোধী কৌটায় আলো ও আর্দ্রতা থেকে দূরে রাখুন। ফ্রিজে রাখার দরকার নেই; বরং ফ্রিজের ভেজা পরিবেশ চায়ের ক্ষতি করতে পারে।</p><ul><li>বায়ুরোধী কৌটায় শুকনো জায়গায় রাখুন।</li><li>ভেজা চামচ ঢোকাবেন না।</li><li>মিক্স একবার খুলে গেলে ২–৩ মাসের মধ্যে ব্যবহার করুন।</li></ul><h3>এতে ক্যাফেইন আছে?</h3><p>চা-পাতা থাকলে সামান্য ক্যাফেইন থাকে; প্যাকেটের উপাদানের তালিকা দেখে নিন।</p><h3>দুধ ছাড়া খাওয়া যায়?</h3><p>হ্যাঁ; লিকার আদা চা মধু ও লেবু দিয়েও ভালো লাগে।</p><h3>খালি পেটে খাওয়া ঠিক?</h3><p>কারও অম্বল হতে পারে; অস্বস্তি হলে খাবারের পরে খান।</p></article><article><h2>লেমন গ্রাস টি: লেবুর মতো সুবাসিত ক্যাফেইনমুক্ত ভেষজ চা</h2><p>শুকনো লেমন গ্রাসের পাতলা ফালি; লেবুর মতো সতেজ ঘ্রাণ ও হালকা স্বাদ। গরম বা ঠান্ডা — দুইভাবেই মানানসই, সাধারণত ক্যাফেইনমুক্ত।</p><p>লেমন গ্রাস (Cymbopogon) এশিয়ার একটি সুগন্ধি ঘাস। এর শুকনো পাতা ও কাণ্ড থেকে সহজ ভেষজ চা (ইনফিউশন) বানানো যায়। থাই ও ভিয়েতনামি রান্নায় এটি বহুল ব্যবহৃত; পানীয় হিসেবে এর লেবুর মতো সতেজ ঘ্রাণ অনেকের প্রিয়।</p><h3>কীভাবে বানাবেন</h3><p>১ কাপ ফুটন্ত পানিতে ১–২ চা-চামচ শুকনো লেমন গ্রাস দিন, ঢেকে ৫–৭ মিনিট ভিজিয়ে ছেঁকে নিন। বেশি সময় ভেজালে ঘাসের মতো তেতো আভা আসতে পারে।</p><h3>স্বাদ বাড়াতে</h3><p>মধু, লেবুর রস, আদা বা পুদিনা পাতা মিলিয়ে নিন। ঠান্ডা করে বরফ দিলে গরমের দিনে সতেজ পানীয় হয়।</p><h3>কখন ভালো লাগে</h3><p>ক্যাফেইনমুক্ত হওয়ায় সন্ধ্যা বা রাতে খাবারের পরেও পান করা যায়। গরমকালে ঠান্ডা সংস্করণ জনপ্রিয়।</p><h3>রান্নায় ব্যবহার</h3><p>চা ছাড়াও স্যুপ, ভাত বা মাছের ঝোলে সুগন্ধ আনতে এক টুকরো ব্যবহার করা যায়।</p><h3>সামার কুলার</h3><p>লেমন গ্রাস চা ঠান্ডা করে পুদিনা পাতা ও বরফ দিলে গরমের দিনে সতেজ হয়; চাইলে সামান্য মধু দিন।</p><h3>ভালো চা চেনার উপায়</h3><p>ভালো চায়ের পাতা সমান আকারের, শুকনো ও সুগন্ধি হয়। বেশি গুঁড়া, ধুলো বা ভেজা-ভেজা ভাব থাকলে মান কম হতে পারে। চা বানালে লিকারের রং পরিষ্কার ও গাঢ় হবে এবং স্বাদে সামান্য কষ ও মিষ্টি ভাব থাকবে। প্যাকেটে প্যাকিং তারিখ ও মেয়াদ দেখে নিন।</p><h3>লিকার, দুধ চা ও আলাদা স্টাইলের পার্থক্য</h3><p>লিকার চা পানি ও পাতায় তৈরি, তাই আসল স্বাদ বোঝা যায়। দুধ চায়ে পাতা একটু বেশি সময় ফুটিয়ে দুধ মেশালে ঘন ও ক্রিমি স্বাদ আসে। গরম বা ঠান্ডা — আপনার পছন্দমতো লেবু, আদা, এলাচ বা সামান্য মধু মিশিয়ে নতুন স্বাদ বানাতে পারেন।</p><h3>চা সংরক্ষণের নিয়ম</h3><p>চায়ের পাতা গন্ধ শোষণ করে, তাই মসলা বা অন্য উগ্র গন্ধের পণ্যের পাশে রাখবেন না। বায়ুরোধী কৌটায় আলো ও আর্দ্রতা থেকে দূরে রাখুন। ফ্রিজে রাখার দরকার নেই; বরং ফ্রিজের ভেজা পরিবেশ চায়ের ক্ষতি করতে পারে।</p><ul><li>বায়ুরোধী কৌটায় শুকনো জায়গায় রাখুন।</li><li>গর্ভাবস্থা বা নিয়মিত ওষুধ চললে আগে চিকিৎসকের পরামর্শ নিন।</li><li>অ্যালার্জির লক্ষণ হলে সেবন বন্ধ করুন।</li></ul><h3>লেমন গ্রাস টিতে কি ক্যাফেইন আছে?</h3><p>না, এটি চা-পাতা নয়; সাধারণত ক্যাফেইনমুক্ত।</p><h3>ঠান্ডা করে খাওয়া যাবে?</h3><p>হ্যাঁ, ঠান্ডা করে বরফ ও লেবু দিলে চমৎকার সামার ড্রিংক।</p><h3>কতদিন ভালো থাকে?</h3><p>শুকনো ও বায়ুরোধী অবস্থায় কয়েক মাস।</p></article><article><h2>আখের গুড়: স্বাদ, ব্যবহার ও সংরক্ষণ</h2><p>আখের রস জ্বাল দিয়ে তৈরি প্রাকৃতিক মিষ্টি। চিনির তুলনায় কম প্রক্রিয়াজাত; সামান্য খনিজ উপাদান থাকে।</p><p>আখের গুড় বাংলার শীতের ঐতিহ্য। পিঠা-পায়েস থেকে চা পর্যন্ত নানা খাবারে ব্যবহৃত হয়।</p><h3>স্বাদ ও রং</h3><p>গাঢ় সোনালি-বাদামি, মাটির মতো মিষ্টি ও সামান্য ক্যারামেল স্বাদ।</p><h3>ব্যবহার</h3><p>পিঠা, পায়েস, চা, মুড়ি-মুড়কি, মিষ্টি ও ঘরোয়া মিষ্টান্নে।</p><h3>চিনির সাথে তুলনা</h3><p>গুড়ে সামান্য আয়রন ও পটাশিয়ামের মতো খনিজ থাকে, তবে ক্যালরি ও শর্করা চিনির প্রায় কাছাকাছি। তাই পরিমিত খান।</p><h3>গুড় দিয়ে ঐতিহ্যবাহী খাবার</h3><p>নলেন গুড়ের পায়েস, ভাপা পিঠা, পাটিসাপটার পুর, মুড়ি-মুড়কি, তিলের নাড়ু — বাঙালির শীতের খাবার গুড় ছাড়া অসম্পূর্ণ।</p><h3>চায়ে গুড়ের ব্যবহার</h3><p>গুড় ব্যবহার করে চা বানালে দুধ কেটে যেতে পারে, তাই প্রথমে চা ও পানি ফুটিয়ে শেষে অল্প গুড় মেশান বা পরিবেশনের ঠিক আগে দিন।</p><h3>গুড় ও চিনির জাত চেনার টিপস</h3><p>ভালো আখের গুড়ের রং গাঢ় সোনালি-বাদামি, স্বাদ মাটির মতো মিষ্টি ও সামান্য ক্যারামেল। অতিরিক্ত সাদা বা চকচকে রং কখনো কৃত্রিম প্রক্রিয়ার ইঙ্গিত হতে পারে। প্যাকেটে উৎস ও তৈরির মৌসুম জানতে চান। শীতকালে (খেজুর ও আখের মৌসুমে) গুড়ের স্বাদ সাধারণত বেশি ভালো হয়।</p><h3>চিনি কমানোর সহজ অভ্যাস</h3><p>চা-কফিতে চিনির পরিমাণ ধাপে ধাপে কমান, প্যাকেটজাত মিষ্টি পানীয়ের বদলে ফল ও বাড়িতে বানানো পানীয় বেছে নিন। গুড় বা ব্রাউন সুগার ব্যবহার করলেও মোট মিষ্টির পরিমাণ সীমিত রাখুন, কারণ ক্যালরি প্রায় একই থাকে। ডায়াবেটিস থাকলে চিকিৎসকের পরামর্শ অনুযায়ী চলুন।</p><h3>সংরক্ষণ ও ব্যবহার</h3><p>গুড় আর্দ্রতা টানে, তাই ঢাকনা আঁটা পাত্রে রাখুন। শক্ত হয়ে গেলে ছুরি দিয়ে কেটে বা গুঁড়া করে ব্যবহার করুন। ব্রাউন সুগার শক্ত হলে ভেজা কাপড়ে মুড়ে কয়েক ঘণ্টা রাখলে নরম হয়। পায়েস, পিঠা, চা, বেকিং — সবখানেই ব্যবহার করা যায়।</p><ul><li>ঢাকনা আঁটা পাত্রে রাখুন, আর্দ্রতা টানে।</li><li>ডায়াবেটিস থাকলে চিকিৎসকের পরামর্শ নিন।</li></ul><h3>গুড় নরম হয়ে যায় কেন?</h3><p>আর্দ্রতা টানলে নরম হয়।</p><h3>কতদিন ভালো থাকে?</h3><p>প্যাকেটের মেয়াদ ও সংরক্ষণের ওপর নির্ভর করে।</p></article><article><h2>ব্রাউন সুগার: স্বাদ, পার্থক্য ও ব্যবহার</h2><p>চিনির সাথে মোলাসেস (আখের ঝোলা গুড়ের সিরাপ) থাকায় রং বাদামি ও স্বাদে হালকা ক্যারামেল।</p><p>ব্রাউন সুগার বেকিং, চা-কফি ও ডেজার্টে জনপ্রিয়। এর সামান্য আর্দ্র গড়ন ও ক্যারামেল স্বাদ আলাদা মাত্রা যোগ করে।</p><h3>সাদা চিনির সাথে পার্থক্য</h3><p>ব্রাউন সুগারে মোলাসেস থাকায় রং ও স্বাদ আলাদা। তবে ক্যালরি ও শর্করা সাদা চিনির কাছাকাছি।</p><h3>ব্যবহার</h3><p>কেক, কুকিজ, চা-কফি, ওটস ও পুডিংয়ে।</p><h3>সংরক্ষণ</h3><p>শক্ত হয়ে গেলে ভেজা কাগজে ঢেকে রাখলে আবার নরম হয়।</p><h3>বেকিংয়ে ব্রাউন সুগারের সুবিধা</h3><p>কুকিজ, কেক ও ব্রাউনিতে ব্রাউন সুগার আর্দ্রতা ও গাঢ় স্বাদ যোগ করে এবং বেকড খাবার নরম রাখতে সাহায্য করে।</p><h3>কফি বা চায়ে ব্রাউন সুগার</h3><p>সাদা চিনির জায়গায় এক চা-চামচ ব্রাউন সুগার মিশিয়ে দেখুন — হালকা ক্যারামেল স্বাদে চা-কফির মজা আলাদা হবে।</p><h3>গুড় ও চিনির জাত চেনার টিপস</h3><p>ভালো আখের গুড়ের রং গাঢ় সোনালি-বাদামি, স্বাদ মাটির মতো মিষ্টি ও সামান্য ক্যারামেল। অতিরিক্ত সাদা বা চকচকে রং কখনো কৃত্রিম প্রক্রিয়ার ইঙ্গিত হতে পারে। প্যাকেটে উৎস ও তৈরির মৌসুম জানতে চান। শীতকালে (খেজুর ও আখের মৌসুমে) গুড়ের স্বাদ সাধারণত বেশি ভালো হয়।</p><h3>চিনি কমানোর সহজ অভ্যাস</h3><p>চা-কফিতে চিনির পরিমাণ ধাপে ধাপে কমান, প্যাকেটজাত মিষ্টি পানীয়ের বদলে ফল ও বাড়িতে বানানো পানীয় বেছে নিন। গুড় বা ব্রাউন সুগার ব্যবহার করলেও মোট মিষ্টির পরিমাণ সীমিত রাখুন, কারণ ক্যালরি প্রায় একই থাকে। ডায়াবেটিস থাকলে চিকিৎসকের পরামর্শ অনুযায়ী চলুন।</p><h3>সংরক্ষণ ও ব্যবহার</h3><p>গুড় আর্দ্রতা টানে, তাই ঢাকনা আঁটা পাত্রে রাখুন। শক্ত হয়ে গেলে ছুরি দিয়ে কেটে বা গুঁড়া করে ব্যবহার করুন। ব্রাউন সুগার শক্ত হলে ভেজা কাপড়ে মুড়ে কয়েক ঘণ্টা রাখলে নরম হয়। পায়েস, পিঠা, চা, বেকিং — সবখানেই ব্যবহার করা যায়।</p><ul><li>বায়ুরোধী কৌটায় রাখুন।</li><li>পরিমিত ব্যবহার করুন।</li></ul><h3>এটি কি সাদা চিনির চেয়ে স্বাস্থ্যকর?</h3><p>পুষ্টিগুণে বড় পার্থক্য নেই; পরিমিত খাওয়াই ভালো।</p><h3>শক্ত হয়ে গেলে কী করব?</h3><p>কয়েক ঘণ্টা ভেজা কাপড়ে মোড়া কৌটায় রাখুন।</p></article><article><h2>হালুয়া: ঘরোয়া স্বাদের মিষ্টি, সংরক্ষণ ও পরিবেশনের গাইড</h2><p>ঘি, চিনি বা গুড় ও আটা বা সুজি দিয়ে ঘরোয়া পদ্ধতিতে তৈরি নরম ও সুগন্ধি মিষ্টি।</p><p>হালুয়া আমাদের উৎসব, অতিথি আপ্যায়ন ও শীতের সন্ধ্যার প্রিয় মিষ্টি। ঘি আর মসলার ঘ্রাণে ভরা নরম হালুয়া একবার খেলে বারবার মনে পড়ে।</p><h3>স্বাদ ও গড়ন</h3><p>হালুয়া সাধারণত ঘন, নরম ও সামান্য দানাদার হয়। ঘি ও এলাচের সুগন্ধ, মিষ্টি মাঝারি থেকে বেশি। কাজু-কিশমিশ বা বাদাম থাকলে মচমচে স্বাদ যোগ হয়।</p><h3>কীভাবে পরিবেশন করবেন</h3><p>গরম করে হালকা ঘি ছিটিয়ে খেলে সুগন্ধ আরও বাড়ে। রুটি, পরোটা বা সকালের নাস্তার সাথেও অনেকে খান। আলাদা বাটিতে অল্প করে নিন।</p><h3>কখন এটি উপহার হিসেবে ভালো</h3><p>ঈদ, বিয়ে-বাড়ি, শুভ অনুষ্ঠান বা অতিথির জন্য ছোট কৌটায় দেওয়া হালুয়া সুন্দর উপহার হতে পারে।</p><h3>গরম করে খাওয়ার নিয়ম</h3><p>অল্প পরিমাণ নন-স্টিক প্যানে বা মাইক্রোওয়েভে ২০–৩০ সেকেন্ড গরম করুন; একবার গরম করা হালুয়া বারবার গরম করবেন না।</p><h3>গুড় ও চিনির জাত চেনার টিপস</h3><p>ভালো আখের গুড়ের রং গাঢ় সোনালি-বাদামি, স্বাদ মাটির মতো মিষ্টি ও সামান্য ক্যারামেল। অতিরিক্ত সাদা বা চকচকে রং কখনো কৃত্রিম প্রক্রিয়ার ইঙ্গিত হতে পারে। প্যাকেটে উৎস ও তৈরির মৌসুম জানতে চান। শীতকালে (খেজুর ও আখের মৌসুমে) গুড়ের স্বাদ সাধারণত বেশি ভালো হয়।</p><h3>চিনি কমানোর সহজ অভ্যাস</h3><p>চা-কফিতে চিনির পরিমাণ ধাপে ধাপে কমান, প্যাকেটজাত মিষ্টি পানীয়ের বদলে ফল ও বাড়িতে বানানো পানীয় বেছে নিন। গুড় বা ব্রাউন সুগার ব্যবহার করলেও মোট মিষ্টির পরিমাণ সীমিত রাখুন, কারণ ক্যালরি প্রায় একই থাকে। ডায়াবেটিস থাকলে চিকিৎসকের পরামর্শ অনুযায়ী চলুন।</p><h3>সংরক্ষণ ও ব্যবহার</h3><p>গুড় আর্দ্রতা টানে, তাই ঢাকনা আঁটা পাত্রে রাখুন। শক্ত হয়ে গেলে ছুরি দিয়ে কেটে বা গুঁড়া করে ব্যবহার করুন। ব্রাউন সুগার শক্ত হলে ভেজা কাপড়ে মুড়ে কয়েক ঘণ্টা রাখলে নরম হয়। পায়েস, পিঠা, চা, বেকিং — সবখানেই ব্যবহার করা যায়।</p><ul><li>প্যাকেটের তারিখ দেখে নিন এবং দ্রুত শেষ করুন।</li><li>গরমে বা ভ্যাপসা আবহাওয়ায় ফ্রিজে রাখুন।</li><li>পরিষ্কার শুকনো চামচ ব্যবহার করুন।</li></ul><h3>হালুয়া কতদিন ভালো থাকে?</h3><p>তৈরির ধরন ও আবহাওয়ার ওপর নির্ভর করে; সাধারণত ফ্রিজে রাখলে বেশি সময় ভালো থাকে। প্যাকেটের তারিখ মেনে চলুন।</p><h3>ডায়াবেটিস থাকলে খাওয়া যাবে?</h3><p>চিনি ও ঘি বেশি থাকে; চিকিৎসকের পরামর্শ ছাড়া নিয়মিত খাবেন না।</p></article><article><h2>ওটস: সহজ ও দ্রুত নাস্তার সেরা বিকল্প</h2><p>রান্না করা সহজ, পেট ভরা অনুভূতি দেয়। দুধ বা পানিতে ৫–৭ মিনিট জ্বাল দিলেই তৈরি।</p><p>ওটস সকালের নাস্তায় জনপ্রিয় একটি শস্য। এটি দুধ বা পানিতে সিদ্ধ করে ফল, বাদাম বা মধু মিশিয়ে খাওয়া যায়।</p><h3>কীভাবে রান্না করবেন</h3><p>এক কাপ ওটসে দুই কাপ দুধ বা পানি দিয়ে ৫–৭ মিনিট জ্বাল দিন; চাইলে সামান্য লবণ বা মিষ্টি দিন।</p><h3>ওভারনাইট ওটস</h3><p>রাতে দুধ বা দইয়ে ভিজিয়ে ফ্রিজে রাখুন, সকালে ফল দিয়ে ঠান্ডা অবস্থায় খান।</p><h3>স্বাদ বাড়াবেন কীভাবে</h3><p>ফল, বাদাম, মধু, দারুচিনি, বা অল্প গুড় মেশাতে পারেন।</p><h3>ওটস পরিজ: ধাপে ধাপে রেসিপি</h3><p>১ কাপ ওটস ও ২ কাপ দুধ বা পানি মাঝারি আঁচে ৫–৭ মিনিট নেড়ে নেড়ে রান্না করুন। নামিয়ে কলা, বাদাম, মধু বা দারুচিনি মিশিয়ে পরিবেশন করুন।</p><h3>সকালের ব্যস্ততায় ওভারনাইট ওটস</h3><p>রাতে এক কাপ ওটস, আধা কাপ দই, আধা কাপ দুধ ও এক চামচ মধু একটি জারে মিশিয়ে ফ্রিজে রাখুন। সকালে ফল ও বাদাম ছড়িয়ে খেলেই নাস্তা তৈরি।</p><h3>ওটসের ধরন ও কোনটি কখন</h3><p>রোলড ওটস সাধারণ পরিজ ও বেকিংয়ের জন্য ভালো; স্টিল-কাট ওটস বেশি সময় নেয় কিন্তু গড়ন চিবানোর মতো; ইনস্ট্যান্ট ওটস দ্রুত তৈরি হয়। প্যাকেটে &quot;প্লেইন&quot; বা &quot;সাধারণ&quot; লেখা ওটস বেছে নিন, কারণ ফ্লেভারযুক্ত ওটসে চিনি বেশি থাকতে পারে।</p><h3>ওটস দিয়ে ৫টি সহজ রেসিপি আইডিয়া</h3><p>১) দুধ-মধু-কলা দিয়ে গরম পরিজ। ২) রাতে দইয়ে ভিজিয়ে সকালে ঠান্ডা ওভারনাইট ওটস। ৩) ডিম ও সবজি মিশিয়ে সুস্বাদু ওটস চিলা। ৪) ওটস-খেজুর-বাদামের এনার্জি বল। ৫) ওটস গুঁড়ো করে পরোটা বা কুকিজে আটা-ময়দার সাথে মিশিয়ে ব্যবহার।</p><h3>সংরক্ষণ ও সতর্কতা</h3><p>বায়ুরোধী কৌটায় শুকনো জায়গায় রাখুন। আর্দ্রতা লাগলে ওটসে পোকা বা ছত্রাক ধরতে পারে। গ্লুটেন সংবেদনশীলতা থাকলে প্যাকেটে &quot;গ্লুটেন-ফ্রি&quot; লেখা আছে কিনা দেখে নিন। নতুন করে খাওয়া শুরু করলে অল্প পরিমাণ দিয়ে শুরু করুন।</p><ul><li>সাধারণ ওটস নিন; অতিরিক্ত মিষ্টি মেশানো ওটস এড়ান।</li><li>শুকনো, বায়ুরোধী কৌটায় রাখুন।</li></ul><h3>ওটস কি ডায়াবেটিস রোগী খেতে পারেন?</h3><p>পরিমাণ ও ধরন চিকিৎসকের পরামর্শে ঠিক করুন।</p><h3>ইনস্ট্যান্ট ও রোলড ওটসের পার্থক্য?</h3><p>ইনস্ট্যান্ট দ্রুত নরম হয়; রোলড ওটস একটু বেশি সময় নেয়।</p></article><article><h2>আমলকীর তেল: চুলের যত্নে ব্যবহারের নিয়ম ও সতর্কতা</h2><p>শুকনো আমলকীর নির্যাস মেশানো ভেষজ কেশ তেল; হালকা ভেষজ ঘ্রাণ ও চুলে ম্যাসাজের জন্য উপযোগী।</p><p>আমলকী উপমহাদেশের চুলের যত্নের ঐতিহ্যবাহী উপাদান। আমলকীর তেল সাধারণত নারকেল বা তিলের মতো বেস তেলে আমলকী মিশিয়ে তৈরি করা হয় এবং চুল ও মাথার ত্বকে ম্যাসাজে ব্যবহার হয়।</p><h3>কীভাবে ব্যবহার করবেন</h3><p>সামান্য তেল হালকা গরম করে আঙুলের ডগায় মাথার ত্বকে ৫–১০ মিনিট ম্যাসাজ করুন। কমপক্ষে ৩০ মিনিট থেকে ২–৩ ঘণ্টা রেখে হালকা শ্যাম্পুতে ধুয়ে ফেলুন। সপ্তাহে ২–৩ দিন ব্যবহার করা যায়।</p><h3>কী আশা করবেন</h3><p>নিয়মিত তেল ম্যাসাজ চুলকে নরম ও চকচকে করতে ও শুষ্কতা কমাতে সাহায্য করে বলে অনেকে অভিজ্ঞতা জানান। তবে চুল গজানো বা পড়া বন্ধ হওয়ার নিশ্চয়তা কোনো তেলই দিতে পারে না; খাদ্যাভ্যাস, ঘুম, স্বাস্থ্য ও বংশগত কারণও বড় ভূমিকা রাখে।</p><h3>সতর্কতা</h3><p>এটি খাওয়ার জন্য নয়। ব্যবহারের আগে কানের পাশে বা হাতে ছোট জায়গায় পরীক্ষা করুন; চুলকানি বা লালচে ভাব হলে ব্যবহার বন্ধ করুন। সমস্যা বেশি হলে চর্মরোগ বিশেষজ্ঞ দেখান।</p><h3>চুল ধোয়ার টিপস</h3><p>তেল বেশি লাগলে প্রথমে সামান্য শ্যাম্পু শুকনো চুলে ঘষে তারপর পানি দিন; এতে তেল সহজে উঠে যায়।</p><h3>চুলের যত্নে বাস্তব প্রত্যাশা</h3><p>কেশ তেল ম্যাসাজ মাথার ত্বক সতেজ রাখে, শুষ্কতা কমায় ও চুল নরম করে বলে অনেকে অভিজ্ঞতা জানান। কিন্তু চুল লম্বা বা ঘন হওয়ার নিশ্চয়তা কোনো তেলেই নেই; বংশগতি, হরমোন, খাদ্য, ঘুম ও স্বাস্থ্য বড় ভূমিকা রাখে। হঠাৎ বেশি চুল পড়লে চর্মরোগ বিশেষজ্ঞ বা চিকিৎসকের পরামর্শ নিন।</p><h3>ম্যাসাজের সহজ নিয়ম</h3><p>তেল সামান্য হালকা গরম করে আঙুলের ডগায় মাথার ত্বকে গোলাকারভাবে ৫–১০ মিনিট ম্যাসাজ করুন, তারপর ১–৩ ঘণ্টা রেখে হালকা শ্যাম্পুতে ধুয়ে ফেলুন। সপ্তাহে ২–৩ দিন যথেষ্ট। গরম তেল সরাসরি ত্বকে ঢালবেন না।</p><ul><li>ঢাকনা এঁটে ঠান্ডা ও শুকনো স্থানে রাখুন।</li><li>তেল পুরো রাত রাখলে বালিশে পুরনো কাপড় বা তোয়ালে বিছিয়ে নিন।</li><li>শিশুদের নাগালের বাইরে রাখুন।</li></ul><h3>আমলকীর তেল কি চুল লম্বা করে?</h3><p>চুলের বৃদ্ধি অনেক কারণে নির্ভরশীল; তেল মাথার ত্বকের যত্নে সাহায্য করে, কিন্তু নির্দিষ্ট ফলের নিশ্চয়তা দেয় না।</p><h3>প্রতিদিন ব্যবহার করা যাবে?</h3><p>চুলের ধরন বুঝে সপ্তাহে ২–৩ দিন ভালো; তৈলাক্ত ত্বকে কম ব্যবহার করুন।</p></article><article><h2>ভৃঙ্গরাজ কেশ তেল: চুল লম্বা করার জনপ্রিয় ভেষজ তেল সম্পর্কে যা জানা দরকার</h2><p>ভৃঙ্গরাজ (কেশরাজ) পাতার নির্যাস মেশানো কেশ তেল; চুলের গোড়া ও মাথার ত্বকের যত্নে ঐতিহ্যগতভাবে ব্যবহৃত।</p><p>ভৃঙ্গরাজ বা কেশরাজ (Eclipta alba) আয়ুর্বেদিক চুলের যত্নে সবচেয়ে পরিচিত উপাদানগুলোর একটি; একে অনেক সময় &quot;চুলের রাজা&quot; বলা হয়। চুল লম্বা ও ঘন করতে অনেকেই ভৃঙ্গরাজ তেল ব্যবহার করেন।</p><h3>কেন এই নামই জনপ্রিয়</h3><p>ইন্টারনেট ও ঘরোয়া পরামর্শে চুলের বৃদ্ধির জন্য সবচেয়ে বেশি আলোচিত ভেষজ নামগুলোর মধ্যে ভৃঙ্গরাজ, আমলকী ও নারকেল তেল শীর্ষে থাকে। এই তেলে সাধারণত ভৃঙ্গরাজ পাতার নির্যাস নারকেল বা তিল তেলে মেশানো থাকে।</p><h3>ব্যবহারের নিয়ম</h3><p>সপ্তাহে ২–৩ দিন সামান্য গরম করা তেল আঙুলের ডগায় মাথার ত্বকে ৫–১০ মিনিট ম্যাসাজ করুন। ১–৩ ঘণ্টা বা সারারাত রেখে হালকা শ্যাম্পুতে ধুয়ে ফেলুন। ধৈর্য ধরুন — ফল দেখতে সাধারণত কয়েক মাস নিয়মিত ব্যবহার লাগে।</p><h3>সততার সাথে জানা ভালো</h3><p>কোনো তেলই নিশ্চিতভাবে চুল লম্বা করে দেওয়ার প্রতিশ্রুতি দিতে পারে না। মাথার ত্বক সুস্থ রাখা, ম্যাসাজ, পর্যাপ্ত প্রোটিন, আয়রন ও ঘুম চুলের বৃদ্ধিতে সহায়ক। হঠাৎ বেশি চুল পড়লে চিকিৎসকের পরামর্শ নিন।</p><h3>চুলের জন্য সুষম জীবনযাত্রা</h3><p>তেলের পাশাপাশি পর্যাপ্ত প্রোটিন, আয়রন, জিংক, ঘুম ও মানসিক চাপ কমানো চুলের স্বাস্থ্যে ভূমিকা রাখে।</p><h3>চুলের যত্নে বাস্তব প্রত্যাশা</h3><p>কেশ তেল ম্যাসাজ মাথার ত্বক সতেজ রাখে, শুষ্কতা কমায় ও চুল নরম করে বলে অনেকে অভিজ্ঞতা জানান। কিন্তু চুল লম্বা বা ঘন হওয়ার নিশ্চয়তা কোনো তেলেই নেই; বংশগতি, হরমোন, খাদ্য, ঘুম ও স্বাস্থ্য বড় ভূমিকা রাখে। হঠাৎ বেশি চুল পড়লে চর্মরোগ বিশেষজ্ঞ বা চিকিৎসকের পরামর্শ নিন।</p><h3>ম্যাসাজের সহজ নিয়ম</h3><p>তেল সামান্য হালকা গরম করে আঙুলের ডগায় মাথার ত্বকে গোলাকারভাবে ৫–১০ মিনিট ম্যাসাজ করুন, তারপর ১–৩ ঘণ্টা রেখে হালকা শ্যাম্পুতে ধুয়ে ফেলুন। সপ্তাহে ২–৩ দিন যথেষ্ট। গরম তেল সরাসরি ত্বকে ঢালবেন না।</p><ul><li>প্রথমবার ব্যবহারের আগে ছোট জায়গায় প্যাচ টেস্ট করুন।</li><li>চোখে লাগলে পরিষ্কার পানিতে ধুয়ে ফেলুন।</li><li>ঢাকনা এঁটে ছায়াযুক্ত স্থানে রাখুন।</li></ul><h3>ভৃঙ্গরাজ তেল কি সবার জন্য?</h3><p>বেশিরভাগ মানুষের জন্য নিরাপদ ধরা হয়; অ্যালার্জি বা ত্বকের সমস্যা থাকলে আগে পরীক্ষা বা পরামর্শ নিন।</p><h3>কতদিনে ফল পাওয়া যায়?</h3><p>চুলের বৃদ্ধি ধীর; ২–৩ মাস নিয়মিত ব্যবহার ও সুষম খাবার একসাথে রাখলে ভালো ধারণা পাওয়া যায়।</p></article><article><h2>ইসবগুলের ভুসি: সঠিকভাবে কীভাবে খাবেন ও কী সতর্কতা</h2><p>ইসবগুল গাছের বীজের খোসা (ভুসি); পানিতে ফুলে জেলির মতো হয়। আঁশ বাড়াতে ও নিয়মিত হজমে সহায়ক হিসেবে পরিচিত।</p><p>ইসবগুলের ভুসি Plantago ovata গাছের বীজের খোসা থেকে তৈরি। এতে দ্রবণীয় আঁশ থাকে; পানিতে মিশলে ফুলে জেলির মতো হয়, তাই খাওয়ার নিয়ম জানা জরুরি।</p><h3>খাওয়ার সঠিক নিয়ম</h3><p>১–২ চা-চামচ (প্রায় ৫–১০ গ্রাম) ভুসি এক গ্লাস (২৫০ মিলি বা বেশি) পানিতে মিশিয়ে সঙ্গে সঙ্গে পান করুন, ফুলে ঘন হওয়ার আগেই। এরপর আরও এক গ্লাস পানি খান। অল্প মাত্রায় শুরু করে ধীরে বাড়ান। দিনে একবার বা দুইবার খাওয়ার প্রচলন আছে।</p><h3>কীসের সাথে মেশাবেন</h3><p>সাধারণ পানি, লেবুর শরবত, দই বা দুধের সাথে মিশিয়ে অনেকে খান। গরম পানি এড়িয়ে চলুন, কারণ তাতে তাড়াতাড়ি ঘন হয়ে যায়।</p><h3>কারা সতর্ক থাকবেন</h3><p>গিলতে অসুবিধা, অন্ত্রে বাধা, অ্যালার্জি বা নিয়মিত ওষুধ খান এমন ব্যক্তিরা চিকিৎসকের পরামর্শ নিন। অন্য ওষুধ খাওয়ার অন্তত ১–২ ঘণ্টা আগে বা পরে খান। কখনোই শুকনো অবস্থায় বা কম পানিতে খাবেন না।</p><h3>ওষুধ ও ইসবগুলের ব্যবধান</h3><p>ওষুধ শোষণে বাধা এড়াতে অন্য ওষুধের অন্তত ১–২ ঘণ্টা আগে বা পরে ইসবগুল খান।</p><h3>কেনার আগে ও খাওয়ার আগে যা মনে রাখবেন</h3><p>ভেষজ পণ্যের গুণ ও প্রভাব মানুষ ভেদে আলাদা হতে পারে। কোনো দীর্ঘমেয়াদী রোগ, গর্ভাবস্থা, শিশু বা নিয়মিত ওষুধের ক্ষেত্রে ব্যবহারের আগে অবশ্যই চিকিৎসকের পরামর্শ নিন। এখানে দেওয়া তথ্য সাধারণ জ্ঞানের জন্য, চিকিৎসা পরামর্শ নয়।</p><h3>সংরক্ষণ ও ব্যবহার</h3><p>আর্দ্রতা ঢুকলে দানা জমে যায় বা ছত্রাক ধরতে পারে। তাই বায়ুরোধী কৌটায়, ঠান্ডা ও শুকনো স্থানে রাখুন। প্রতিবার শুকনো চামচ ব্যবহার করুন এবং প্যাকেটের তারিখ দেখে নিন।</p><ul><li>বায়ুরোধী কৌটায় শুকনো স্থানে রাখুন।</li><li>শুকনো চামচ ব্যবহার করুন; আর্দ্রতা লাগলে জমে যেতে পারে।</li><li>প্রচুর পানি পান করুন।</li></ul><h3>ইসবগুলের ভুসির সঠিক বানান কী?</h3><p>প্রচলিত ও প্রামাণিক বানান হলো ইসবগুলের ভুসি (কখনো ইসবগুল বা ইসপগুল লেখাও দেখা যায়)।</p><h3>রাতে খাওয়া যাবে?</h3><p>অনেকে রাতে বা সকালে খান। সময় নয়, বেশি পানি ও নিয়মিততাই গুরুত্বপূর্ণ।</p></article><article><h2>তোকমা দানা: কীভাবে ভেজাবেন, শরবতে কীভাবে খাবেন ও সতর্কতা</h2><p>বেসিল (তুলসী জাতীয়) গাছের ছোট কালো বীজ; পানিতে ভিজালে জেলির আবরণে ঢেকে যায়। গরমের ঠান্ডা পানীয়ের জনপ্রিয় উপাদান।</p><p>তোকমা দানা (সঠিক বানান: তোকমা দানা) মিষ্টি তুলসী বা বেসিলের বীজ। পানিতে ভেজালে ফুলে জেলির মতো হয়ে যায় এবং শরবত, ফালুদা বা লেবুর পানিতে মজাদার ঘনত্ব আনে।</p><h3>কীভাবে প্রস্তুত করবেন</h3><p>১ চা-চামচ তোকমা দানা এক গ্লাস স্বাভাবিক পানিতে ১৫–২০ মিনিট ভিজিয়ে রাখুন। ফুলে জেলির আবরণে ঢেকে গেলে তা শরবত বা দুধে মিশিয়ে নিন।</p><h3>কোথায় ব্যবহার করবেন</h3><p>লেবুর শরবত, রুহ আফজা বা দুধের শরবত, ফালুদা, আইসক্রিম এবং ফলের স্মুদির সাথে মানানসই। গরমের দিনে অনেকে এটি ঠান্ডা পানীয়তে বেছে নেন।</p><h3>সতর্কতা</h3><p>কখনও শুকনো দানা সরাসরি গিলবেন না — গলায় আটকে যেতে পারে। শিশুদের দেওয়ার আগে ভালো করে ভিজিয়ে নিন। ডায়াবেটিস বা ওষুধে থাকলে, বা গর্ভাবস্থায় চিকিৎসকের পরামর্শ নিন। অতিরিক্ত পরিমাণে একসাথে খেলে পেট ফাঁপতে পারে।</p><h3>শরবতের সহজ রেসিপি</h3><p>ভেজানো তোকমা দানা, লেবুর রস, সামান্য মধু ও ঠান্ডা পানি মিশিয়ে ১ মিনিটেই গরমের শরবত তৈরি করা যায়।</p><h3>কেনার আগে ও খাওয়ার আগে যা মনে রাখবেন</h3><p>ভেষজ পণ্যের গুণ ও প্রভাব মানুষ ভেদে আলাদা হতে পারে। কোনো দীর্ঘমেয়াদী রোগ, গর্ভাবস্থা, শিশু বা নিয়মিত ওষুধের ক্ষেত্রে ব্যবহারের আগে অবশ্যই চিকিৎসকের পরামর্শ নিন। এখানে দেওয়া তথ্য সাধারণ জ্ঞানের জন্য, চিকিৎসা পরামর্শ নয়।</p><h3>সংরক্ষণ ও ব্যবহার</h3><p>আর্দ্রতা ঢুকলে দানা জমে যায় বা ছত্রাক ধরতে পারে। তাই বায়ুরোধী কৌটায়, ঠান্ডা ও শুকনো স্থানে রাখুন। প্রতিবার শুকনো চামচ ব্যবহার করুন এবং প্যাকেটের তারিখ দেখে নিন।</p><ul><li>বায়ুরোধী কৌটায় শুকনো স্থানে রাখুন।</li><li>ভেজানোর পর ফ্রিজে রেখে ১–২ দিনের মধ্যে ব্যবহার করুন।</li><li>শুকনো চামচ ব্যবহার করুন।</li></ul><h3>তোকমা ও চিয়া কি একই?</h3><p>না; দুটোই বীজ ও পানিতে ফোলে, তবে ভিন্ন উদ্ভিদের এবং গড়ন, স্বাদ ও আকার আলাদা।</p><h3>কতটা খাব?</h3><p>শুরুতে দিনে ১ চা-চামচ ভালো; শরীরের সাথে মানিয়ে নিলে বাড়ান।</p></article><article><h2>চিরতা: তিতকুটে ভেষজের ঐতিহ্যবাহী ব্যবহার ও সতর্কতা</h2><p>চিরতা (চিরেতা) গাছের শুকনো ডালপালা; অত্যন্ত তেতো স্বাদ। ঘরোয়া ভেষজ পানীয়ে ব্যবহারের ঐতিহ্য আছে।</p><p>চিরতা বা চিরেতা (Swertia chirata) হিমালয় অঞ্চলের ভেষজ, যার তেতো স্বাদ সুপরিচিত। বাংলাদেশ ও ভারতে শুকনো চিরতা ভিজিয়ে পানি খাওয়ার ঐতিহ্যবাহী ঘরোয়া প্রচলন আছে।</p><h3>কীভাবে ব্যবহার করা হয়</h3><p>ঘরোয়া নিয়মে ১–২ ছোট টুকরো (প্রায় ১–২ গ্রাম) শুকনো চিরতা সন্ধ্যায় এক গ্লাস পানিতে ভিজিয়ে রেখে সকালে পানি ছেঁকে খাওয়ার প্রচলন আছে। স্বাদ অত্যন্ত তেতো — তাই অল্প পরিমাণ দিয়ে শুরু করুন।</p><h3>কী মনে রাখবেন</h3><p>এটি ঔষধ নয়; কোনো রোগ সারানোর দাবি এখানে নেই। দীর্ঘদিন নিয়মিত খাওয়ার আগে অভিজ্ঞ চিকিৎসক বা ভেষজ চিকিৎসকের পরামর্শ নেওয়া ভালো।</p><h3>সতর্কতা</h3><p>গর্ভবতী ও স্তন্যদানকারী মা, শিশু, ডায়াবেটিসের ওষুধ খান এমন ব্যক্তি (রক্তে শর্করা কমে যাওয়ার ঝুঁকি) এবং লিভার বা কিডনির সমস্যা থাকলে ব্যবহারের আগে চিকিৎসকের মত নিন।</p><h3>তেতো স্বাদ সহনীয় করা</h3><p>পানি ছেঁকে নিয়ে সামান্য লেবু বা এক চা-চামচ মধু মিশিয়ে অনেকে খান; তবে মধু শিশুর (১ বছরের নিচে) জন্য নয়।</p><h3>কেনার আগে ও খাওয়ার আগে যা মনে রাখবেন</h3><p>ভেষজ পণ্যের গুণ ও প্রভাব মানুষ ভেদে আলাদা হতে পারে। কোনো দীর্ঘমেয়াদী রোগ, গর্ভাবস্থা, শিশু বা নিয়মিত ওষুধের ক্ষেত্রে ব্যবহ function szOf(label){
 const s=String(label||'').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
 const m=s.match(/(\d+(?:\.\d+)?)/);if(!m)return 500;
 let n=parseFloat(m[1]);if(/কেজি|kg/i.test(s)||/লিটার/.test(s))n*=1000;return n;
}

const OILB=[['#8a6300','#d9a40e','#f6cf4d','#d9a40e','#8a6300','GHANI-BHANGA','MUSTARD OIL'],['#aab5aa','#e1e9e1','#fbfdfb','#e1e9e1','#aab5aa','PURE COCONUT','OIL']];
function artSvg(cat,v,sz,size){
 const key=[cat,v,sz].join('|');if(ART[key])return ART[key];
 const sc=Math.max(.55,Math.min(1,.58+.42*Math.log(Math.max(sz,60)/80)/Math.log(1000/80)));
 const lab=szLatin(sz,cat);
 const ob=OILB[v%OILB.length];
 const body=(cat==='dates'||cat==='nuts')?pouch(cat,v,lab):cat==='vinegar'?bottle(lab):cat==='oil'?bottle(lab,ob.slice(0,5),ob[5],ob[6]):(cat==='spice'||cat==='tea'||cat==='sweet'||cat==='grain')?sachet(cat,v,lab):jar(cat,v,lab);
 const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f1e4bd"/></linearGradient><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ead9a6"/><stop offset="1" stop-color="#cdb77a"/></linearGradient><filter id="bl"><feGaussianBlur stdDeviation="5"/></filter></defs><rect width="300" height="260" fill="url(#bg)"/><rect y="214" width="300" height="46" fill="url(#fl)"/><ellipse cx="150" cy="219" rx="${Math.round(95*sc)}" ry="9" fill="#000" opacity=".3" filter="url(#bl)"/><g transform="translate(150 218) scale(${sc.toFixed(3)}) translate(-150 -218)">${body}</g></svg>`;
 return ART[key]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}

 hl(cx-W*.42,W*.07,.6);hl(cx-W*.31,W*.022,.4);hl(cx+W*.36,W*.03,.3);
 c.restore();
 c.save();path();c.lineWidth=Math.max(2,W*.012);c.strokeStyle='rgba(120,135,140,.55)';c.stroke();c.restore();

async function pinHash(pin,salt,mode){
 if(mode==='p'&&window.crypto&&window.crypto.subtle){
  const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);

}

function setStatus(id,v){

function linesHTML(){

function prodOptions(sel){return CATS.map(c=>{const L=db.products.filter(p=>(p.cat||'other')===c[0]);return L.length?`<optgroup label="${c[2]} ${c[1]}">${L.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)} (স্টক ${bn(p.stock)} ${esc(p.unit)})</option>`).join('')}</optgroup>`:''}).join('')}
function lineProd(ix,pid){const p=getP(pid);D.items[ix].pid=pid;if(p)D.items[ix].price=p.price;$('#lines').innerHTML=linesHTML();updTotals()}
function lineSet(ix,k,v){D.items[ix][k]=parseFloat(v)||0;const e=$('#lt'+ix);if(e)e.textContent=tk(D.items[ix].qty*D.items[ix].price);updTotals()}
function pickCust(){
 const c=db.customers.find(x=>x.name===val('o_name'));
 if(c){$('#o_phone').value=c.phone||'';$('#o_addr').value=c.addr||''}
}
function readDraft(){
 D.discount=num('o_disc');D.delivery=num('o_del');D.paid=num('o_paid');
}
function updTotals(){
 if(!$('#o_tot'))return;readDraft();
 const sub=D.items.reduce((a,i)=>a+i.qty*i.price,0),total=sub-D.discount+D.delivery,due=Math.max(0,total-D.paid);

 $('#o_tot').innerHTML=`<div><span>সাবটোটাল</span><span>${tk(sub)}</span></div>${D.discount?`<div><span>ছাড়</span><span>− ${tk(D.discount)}</span></div>`:''}${D.delivery?`<div><span>ডেলিভারি</span><span>+ ${tk(D.delivery)}</span></div>`:''}<div class="big"><span>সর্বমোট</span><span>${tk(total)}</span></div><div><span>পরিশোধ</span><span>${tk(D.paid)}</span></div><div class="${due>0?'due':''}"><span>বাকি</span><span>${tk(due)}</span></div>${over.length?`<div class="warn">⚠️ স্টকের চেয়ে বেশি: ${esc(over.join(', '))}</div>`:''}`;
}
function findOrMakeCust(name,phone,addr){
 if(!name)return null;
 let c=db.customers.find(x=>x.name===name&&(!phone||!x.phone||x.phone===phone));
 if(!c){c={id:'c'+uid(),name,phone,addr};db.customers.push(c)}
 else{if(phone&&!c.phone)c.phone=phone;if(addr&&!c.addr)c.addr=addr}
 return c;
}
function makeOrder(d,items){

 const o={id:'o'+uid(),no:nextNo(),date:d.date||ymd(new Date()),custId:c?c.id:'',custName:d.custName||'',custPhone:d.custPhone||'',custAddr:d.custAddr||'',dist:distOk(d.dist)||detectDist(d.custAddr),
  items:items.map(i=>{const p=getP(i.pid);return{pid:i.pid,name:p.name,unit:p.unit,qty:i.qty,price:i.price,cost:p.cost}}),
  discount:d.discount||0,delivery:d.delivery||0,paid:Math.min(d.paid||0,Infinity),status:d.status||'new',note:d.note||'',method:d.method||'',ref:d.ref||'',trk:{}};

}

 const L=db.products.filter(p=>(F.pcat==='all'||(p.cat||'other')===F.pcat)&&(!q||(p.name+' '+(p.group||'')).toLowerCase().includes(q)));
 $$('#schips .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===F.pcat));
 $('#plist').innerHTML=L.length?L.map(p=>{
  const isLow=p.stock<=p.low,mg=p.price>0?(p.price-p.cost)/p.price*100:0;
  const pct=Math.min(100,Math.max(4,p.stock/Math.max(p.low*3,p.stock,1)*100));
  return `<div class="pc"><div class="pc-h">${thumbHTML(p)}<div style="min-width:0"><b>${esc(p.name)}</b><div class="sm muted">প্রতি ${esc(p.unit)}${p.size?' · '+esc(p.size):''}</div></div></div>

  <div class="meter ${isLow?'low':''}"><i style="width:${pct}%"></i></div>
  <div class="pc-s"><span>স্টক: <b>${bn(p.stock)} ${esc(p.unit)}</b></span>${isLow?'<span class="badge b-red">কম স্টক</span>':'<span class="badge b-ok">পর্যাপ্ত</span>'}</div>

/* ---------- নতুন পণ্য: সাইজ ও দাম অটো ---------- */
const PREMX={100:1.25,250:1.1,500:1.04,1000:1,2000:.98,5000:.96},PACKX={100:15,250:22,500:32,1000:45,2000:70,5000:120};
const PFX={spice:.6,tea:.6,sweet:.5,grain:.5,herbal:.6},SZALL=[100,250,500,1000,2000,5000];
const SZDEF={honey:[100,250,500,1000],ghee:[100,250,500,1000],dates:[250,500,1000],oil:[250,500,1000,2000],vinegar:[250,500,1000],nuts:[100,250,500,1000],spice:[100,250,500],tea:[100,250,500,1000],sweet:[500,1000,2000],grain:[250,500,1000],hair:[100,250,500],herbal:[100,250,500],other:[100,250,500,1000]};
const UNITC={honey:'জার',ghee:'জার',oil:'বোতল',vinegar:'বোতল',hair:'বোতল',herbal:'প্যাক'};
const rndP=x=>x>400?Math.round(x/10)*10:Math.round(x/5)*5;
const szLbl=(cat,sz)=>LIQ.includes(cat)?(sz>=1000?bn(sz/1000,1)+' লিটার':bn(sz,0)+' মিলি'):(sz>=1000?bn(sz/1000,1)+' কেজি':bn(sz,0)+' গ্রাম');
const autoVar=(cat,sz,sell,buy)=>({price:rndP(sell*sz/1000*PREMX[sz]),cost:Math.round(buy*sz/1000+PACKX[sz]*(PFX[cat]||1))});
function apRows(cat){
 const def=SZDEF[cat]||SZDEF.other;
 return SZALL.map(sz=>`<div class="aprow"><label class="chk"><input type="checkbox" class="ap_c" data-sz="${sz}" ${def.includes(sz)?'checked':''}> <b>${szLbl(cat,sz)}</b></label><span class="apv">বিক্রয় <b id="ap_s${sz}">—</b></span><span class="apv">ক্রয় <b id="ap_b${sz}">—</b></span><input class="apst" type="number" min="0" step="any" id="ap_t${sz}" placeholder="স্টক"></div>`).join('');
}
function apCalc(){
 const cat=val('ap_cat'),sell=num('ap_sell'),buy=num('ap_buy')||sell*.78;
 SZALL.forEach(sz=>{const v=autoVar(cat,sz,sell,buy),a=$('#ap_s'+sz),b=$('#ap_b'+sz);if(a)a.textContent=sell>0?tk(v.price):'—';if(b)b.textContent=sell>0?tk(v.cost):'—'});
}
function apCat(){
 const cat=val('ap_cat'),r=$('#ap_rows');if(r)r.innerHTML=apRows(cat);
 const l=$('#ap_l1');if(l)l.textContent=LIQ.includes(cat)?'১ লিটারের':'১ কেজির';
 const u=$('#ap_unit');if(u)u.value=UNITC[cat]||'প্যাক';
 apCalc();
}

/* ---------- কাস্টমার ফলো-আপ (৪০ দিনে মেসেজ, ৪৫ দিনে কল রিমাইন্ডার) ---------- */
const FU_DEF=`আসসালামু আলাইকুম {নাম}, 🌿
{দোকান}-এর পক্ষ থেকে আন্তরিক শুভেচ্ছা।

আপনি সর্বশেষ {তারিখ} তারিখে আমাদের কাছ থেকে {পণ্য} নিয়েছিলেন। আশা করি পণ্যটি আপনার ও পরিবারের ভালো লেগেছে। 🍯

আমাদের খাঁটি মধু, খেজুর, ঘি, সরিষার তেল, মসলা ও অন্যান্য পণ্য এখনও পাওয়া যাচ্ছে। নতুন অর্ডার বা কোনো পরামর্শের জন্য এই মেসেজেই জানাতে পারেন, অথবা কল করুন: {ফোন}
🛒 ক্যাটালগ: {লিংক}

আপনার পাশে থাকতে পেরে আমরা আনন্দিত। ধন্যবাদ। 🤝
— {দোকান} (খাঁটি পণ্য, বিশ্বাসের স্বাদ)`;
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const fuD=()=>[Math.max(1,+((db.shop||{}).fu1)||40),Math.max(1,+((db.shop||{}).fu2)||45)];
const linkOf=v=>{v=String(v||'').trim();if(!v)return '';if(!/^https?:\/\//i.test(v))v='https://'+v;try{const u=new URL(v);return /^https?:$/.test(u.protocol)&&u.hostname.includes('.')?u.href:''}catch(e){return ''}};
function mmURL(v){
 v=String(v||'').trim();if(!v)return '';let h=v;
 if(/^https?:\/\//i.test(v)||/facebook\.com|fb\.com|m\.me/i.test(v)){try{const u=new URL(/^https?:/i.test(v)?v:'https://'+v);h=u.pathname.indexOf('profile.php')>=0?(u.searchParams.get('id')||''):(u.pathname.split('/').filter(Boolean)[0]||'')}catch(e){h=''}}
 h=h.replace(/^@/,'');return /^[\w.\-]{3,80}$/.test(h)?'https://m.me/'+encodeURIComponent(h):'';
}
function fuInfo(c){
 if(!c)return null;
 const os=db.orders.filter(o=>o.custId===c.id&&o.status!=='cancelled'&&o.date).sort((a,b)=>b.date.localeCompare(a.date));
 if(!os.length)return null;
 const [D1,D2]=fuD(),t=ymd(new Date()),last=os[0].date,days=daysBetween(last,t),st=(db.fu||{})[c.id],cur=st&&st.d===last?st:{};
 return{c,os,last,days,cur,D1,D2,needWa:days>=D1&&!cur.wa,needCall:days>=D2&&!cur.call,snoozed:cur.sn===t};
}
const fuList=()=>db.customers.map(fuInfo).filter(f=>f&&(f.needWa||f.needCall)).sort((a,b)=>b.days-a.days);
function fuSet(id,patch){const x=fuInfo(getC(id));if(!x)return;db.fu=db.fu||{};const cur=(db.fu[id]&&db.fu[id].d===x.last)?db.fu[id]:{d:x.last};db.fu[id]=Object.assign(cur,patch);save()}
function fuBought(f){const m={};f.os.forEach(o=>o.items.forEach(i=>{const k=stripOrg(i.name);m[k]=(m[k]||0)+(+i.qty||0)}));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>esc(e[0])+' ×'+bn(e[1],0))}
function fuMsg(f){
 const s=db.shop,link=linkOf(s.fulink);
 let t=(s.fumsg&&s.fumsg.trim())||FU_DEF;
 if(!link)t=t.split('\n').filter(l=>l.indexOf('{লিংক}')<0).join('\n');
 const names=[...new Set(f.os[0].items.map(i=>stripOrg(i.name)))],pn=names.slice(0,3).join(', ')+(names.length>3?' ইত্যাদি':'');
 return t.replace(/\{নাম\}/g,f.c.name||'গ্রাহক').replace(/\{দোকান\}/g,s.name||'PureBite').replace(/\{পণ্য\}/g,pn||'আমাদের পণ্য').replace(/\{তারিখ\}/g,fmtDate(f.last,1)).replace(/\{দিন\}/g,bn(f.days,0)).replace(/\{ফোন\}/g,s.phone||'').replace(/\{লিংক\}/g,link);
}
function fuTag(c){const f=fuInfo(c);return f&&f.days>=f.D1?` · <span class="due">⏰ ${bn(f.days,0)} দিন কেনেননি</span>`:''}
function fuLine(c){const f=fuInfo(c);return f?`<div class="sm" style="margin-bottom:10px">🕒 সর্বশেষ কেনা: ${fmtDate(f.last,1)} (${bn(f.days,0)} দিন আগে)</div>`:''}
function fuCard(f,force){
 const c=f.c,ph=c.phone,call=f.needCall,items=fuBought(f);
 return `<div class="fucard${call?' call':''}${f.snoozed?' dim':''}"><div class="fuh"><b>${esc(c.name)}</b><span class="badge ${call?'b-red':'b-warn'}">${bn(f.days,0)} দিন আগে কিনেছেন</span></div>
 <div class="sm muted">${ph?'📞 '+esc(ph)+' · ':''}সর্বশেষ কেনা: ${fmtDate(f.last,1)}${c.addr?' · 📍 '+esc(c.addr):''}</div>
 <div class="fup"><span>🛍️ আগে যা যা নিয়েছেন:</span> ${items.join(' · ')}</div>
 ${call?`<div class="fucall">📞 এই কাস্টমারকে <b>কল</b> দিয়ে খুঁজ-খবর নিন — পণ্য কেমন লেগেছে, নতুন কিছু লাগবে কিনা জিজ্ঞাসা করুন।</div>`:''}
 <div class="fuact">
 ${ph?`<a class="btn sm${call?'':' ghost'}" href="tel:${esc(ph)}" style="text-decoration:none">📞 কল করুন</a>`:'<span class="sm muted">ফোন নম্বর নেই</span>'}
 ${call?`<button class="btn ghost sm" data-act="fuCalled" data-id="${c.id}">✓ কল করেছি</button>`:''}
 ${ph&&(f.needWa||force)?`<button class="btn wa sm" data-act="fuWA" data-id="${c.id}">💬 WhatsApp মেসেজ</button>`:(f.cur.wa?'<span class="badge b-ok">✓ মেসেজ পাঠানো হয়েছে</span>':'')}
 <button class="btn ghost sm" data-act="fuCopy" data-id="${c.id}">📋 মেসেজ কপি</button>
 ${mmURL(c.fb)?`<button class="btn ghost sm" data-act="fuMM" data-id="${c.id}">Messenger</button>`:''}
 ${(f.needWa||f.needCall)&&!f.snoozed?`<button class="btn ghost sm" data-act="fuSnooze" data-id="${c.id}">⏰ কাল মনে করাও</button>`:''}
 </div></div>`;
}
const FUM={only:null};
function showFollowUp(manual,onlyId){
 FUM.only=onlyId||null;
 const L=onlyId?[fuInfo(getC(onlyId))].filter(Boolean):fuList();
 const [D1,D2]=fuD(),nc=L.filter(f=>f.needCall).length,nw=L.filter(f=>f.needWa).length;
 if(!L.length){if(manual&&!onlyId){closeModal();toast('এখন কোনো ফলো-আপ বাকি নেই ✓')}else if(onlyId){toast('এই কাস্টমারের এখনও কোনো অর্ডার নেই')}return}
 const banner=onlyId?'':`<div class="fubanner">${nc?`📞 <b>${bn(nc,0)} জন</b> কাস্টমারকে <b>কল</b> দিয়ে খুঁজ-খবর নেওয়ার সময় হয়েছে (${bn(D2,0)} দিন পার)`:''}${nc&&nw?'<br>':''}${nw?`💬 <b>${bn(nw,0)} জন</b> কাস্টমারকে ধন্যবাদ-মেসেজ পাঠানোর সময় হয়েছে (${bn(D1,0)} দিন পার)`:''}</div>`;
 openModal('🔔 কাস্টমার ফলো-আপ',banner+L.map(f=>fuCard(f,!!onlyId)).join('')+`<p class="muted sm" style="margin-top:10px">💡 "WhatsApp মেসেজ" চাপলে সাজানো মেসেজসহ WhatsApp খুলবে — আপনি শুধু "সেন্ড" চাপবেন। মেসেজ বদলাতে সেটিংস → ফলো-আপ।</p>`,`<button class="btn" data-act="close">ঠিক আছে</button>`);
}
function fuRefresh(){showFollowUp(true,FUM.only)}
let FUT=0;
function autoFollow(){
 if(CM||PUBMODE||!db||dlg().open)return;
 const lk=$('#lock');if(lk&&getComputedStyle(lk).display!=='none')return;
 FUT=Date.now();
 if(fuList().some(f=>!f.snoozed))showFollowUp(false);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&BOOTED&&Date.now()-FUT>6*36e5)autoFollow()});
function followCard(){
 const L=fuList();if(!L.length)return '';
 return `<div class="card" style="margin-bottom:16px"><h3>🔔 ফলো-আপ দরকার (${bn(L.length,0)} জন)</h3>${L.slice(0,3).map(f=>`<div class="row"><div class="grow"><b>${esc(f.c.name)}</b><div class="sm muted">${bn(f.days,0)} দিন আগে কিনেছেন</div></div><span class="badge ${f.needCall?'b-red':'b-warn'}">${f.needCall?'📞 কল করুন':'💬 মেসেজ'}</span></div>`).join('')}<button class="btn sm" style="margin-top:10px" data-act="fuOpen">সব দেখুন ও মেসেজ পাঠান</button></div>`;
}

const HQ=[
{q:'মধু কেন জমে যায়? সেটা কি ভেজাল?',a:'মধুতে গ্লুকোজ ও ফ্রুক্টোজ থাকে। গ্লুকোজ বেশি থাকলে (যেমন সরিষা ফুলের মধু) ঠান্ডায় ধীরে ধীরে দানা বেঁধে জমে যায় — এটা প্রাকৃতিক প্রক্রিয়া, জমলেই ভেজাল নয়। জমে গেলে জারটি ৪০°C-এর নিচের হালকা গরম পানিতে কিছুক্ষণ রাখলে আবার তরল হয়।'},

{q:'খাঁটি মধু কি ঘরে বসে চেনা যায়?',a:'পানিতে ফোঁটা ফেলা বা আগুনে ধরার মতো ঘরোয়া পরীক্ষা পুরোপুরি নির্ভরযোগ্য নয়। সবচেয়ে নিশ্চিত উপায় ল্যাব পরীক্ষা (আর্দ্রতা, HMF, ডায়াস্টেজ ইত্যাদি) আর বিশ্বস্ত উৎস থেকে কেনা। সংগ্রহের স্থান ও সময় জেনে কিনুন — পণ্যের "বিস্তারিত" দেখুন।'},

{q:'গাওয়া ঘি শীতে জমে দানা বাঁধে কেন?',a:'ঘিতে নানা ধরনের চর্বি-অণু আছে; ঠান্ডায় এগুলো আলাদা হয়ে জমে দানাদার হয় — খাঁটি ঘিতে এটা স্বাভাবিক। হালকা গরমে নেড়ে নিলে আবার মসৃণ হয়। গাওয়া ঘির ঘ্রাণ মিষ্টি-দুধেল হয়।'},

{q:"ঘি কীভাবে রাখলে বেশিদিন ভালো থাকে?",a:"সবসময় শুকনো চামচ ব্যবহার করুন — সামান্য পানি বা আর্দ্রতা ঘি নষ্ট করে। কাচের জারে ঢাকনা শক্ত করে এঁটে ঠান্ডা, অন্ধকার জায়গায় রাখুন। সঠিকভাবে রাখলে ঘি কয়েক মাস ভালো থাকে। তীব্র টকটক গন্ধ বা অস্বাভাবিক রং হলে আর খাবেন না।"},
{q:"ভিনেগার কি সরাসরি খাওয়া যায়?",a:"না। ভিনেগার অ্যাসিডিক, তাই সরাসরি খেলে দাঁতের এনামেল ও গলার ক্ষতি হতে পারে। সালাদ, আচার বা রান্নায় ব্যবহার করুন, কিংবা এক গ্লাস পানিতে এক-দুই চা-চামচ মিশিয়ে নিন। প্রাকৃতিক ভিনেগারের তলায় ঘোলা 'মা' (mother) জমতে পারে — এটি স্বাভাবিক। কোনো শারীরিক সমস্যা থাকলে চিকিৎসকের পরামর্শ নিন।"},
{q:"দিনে কতটুকু বাদাম খাওয়া ভালো?",a:"বাদামে পুষ্টি আছে, তবে ক্যালরিও বেশি। সাধারণভাবে দিনে এক মুঠো (প্রায় ২৫–৩০ গ্রাম) যথেষ্ট। লবণ ও চিনি ছাড়া সাধারণ বাদাম বেছে নিন। কারও বাদামে অ্যালার্জি থাকলে একেবারেই এড়িয়ে চলুন। বাদাম বায়ুরোধী কৌটায় ঠান্ডা জায়গায় রাখলে তেল-গন্ধ হতে দেরি হয়।"},
{q:"গুঁড়া মসলা (হলুদ, মরিচ, ধনিয়া, জিরা) কীভাবে ভালো রাখবেন?",a:"গুঁড়া মসলার সবচেয়ে বড় শত্রু আর্দ্রতা, আলো ও বাতাস। শুকনো, বায়ুরোধী কৌটায় চুলা থেকে দূরে রাখুন এবং শুকনো চামচ ব্যবহার করুন। সম্ভব হলে অল্প অল্প করে কিনুন — তাজা গুঁড়ায় রং ও ঘ্রাণ বেশি থাকে। সরাসরি রোদে শুকানো ছাড়া মসলা ভেজা অবস্থায় রাখবেন না।"},
{q:"ওটস কীভাবে খেতে হয়?",a:"রোলড ওটস দুধ বা পানিতে ৫–৭ মিনিট জ্বাল দিলেই নরম পরিজ তৈরি হয়। রাতে দুধ বা দইয়ে ভিজিয়ে রেখে সকালে ঠান্ডা অবস্থায়ও (ওভারনাইট ওটস) খাওয়া যায়। ফল, বাদাম বা সামান্য মধু মিশিয়ে নিন। প্যাকেটজাত মিষ্টি ওটসের চেয়ে সাধারণ ওটস বেছে নেওয়া ভালো।"},
{q:"আখের গুড় কি চিনির চেয়ে ভালো?",a:"গুড়ে সামান্য আয়রন, পটাশিয়ামের মতো খনিজ থাকে এবং এটি কম প্রক্রিয়াজাত। তবে ক্যালরি ও শর্করা চিনির প্রায় কাছাকাছি, তাই পরিমিত খাওয়াই ভালো। ডায়াবেটিসের রোগীরা গুড়কেও চিনির মতোই হিসাব করুন। গুড় আর্দ্রতা টানে, তাই ঢাকনা আঁটা পাত্রে রাখুন।"},
{q:"খাঁটি নারকেল তেল শীতে জমে যায় কেন?",a:"নারকেল তেলে স্যাচুরেটেড ফ্যাট বেশি, তাই প্রায় ২৪–২৫°C-এর নিচে এটি স্বাভাবিকভাবেই জমে সাদা হয়ে যায় এবং গরমে আবার তরল হয়। জমে যাওয়া মানে ভেজাল নয়, বরং সাধারণ বৈশিষ্ট্য। জমলে জারটি সামান্য গরম পানিতে কিছুক্ষণ রাখলেই তরল হবে।"},
];
const HQS={i:0,t:null};
function hqSlide(i){const e=$('#hq');if(!e)return;const x=HQ[i];e.innerHTML=`<div class="hqq"><span class="hqn">${bn(i+1,0)}/${bn(HQ.length,0)}</span>❓ ${esc(x.q)}</div><div class="hqa">${esc(x.a)}</div>`}
function startHQ(){
 clearInterval(HQS.t);
 HQS.t=setInterval(()=>{
  const e=$('#hq');if(!e){clearInterval(HQS.t);return}
  if(document.hidden||dlg().open)return;
  HQS.i=(HQS.i+1)%HQ.length;e.classList.add('out');
  setTimeout(()=>{hqSlide(HQS.i);e.classList.remove('out')},260);
 },6000);
}
function initHQ(){
 const h=$('#ptitle');if(!h||$('#hq'))return;
 const d=document.createElement('div');d.id='hq';d.className='hq';d.setAttribute('data-act','hqOpen');d.setAttribute('role','button');d.setAttribute('aria-label','প্রশ্ন-উত্তর');
 h.insertAdjacentElement('afterend',d);hqSlide(0);startHQ();
}
function hqModal(i){
 const n=HQ.length;i=((i%n)+n)%n;HQS.i=i;const x=HQ[i];
 openModal('❓ জানা-অজানা ('+bn(i+1,0)+'/'+bn(n,0)+')',`<h3 style="margin-bottom:8px">${esc(x.q)}</h3><p style="line-height:1.85">${esc(x.a)}</p><div class="sect" style="margin-top:16px">আরও প্রশ্ন</div><div class="hql">${HQ.map((y,k)=>`<button class="${k===i?'on':''}" data-act="hqGo" data-i="${k}">${bn(k+1,0)}। ${esc(y.q)}</button>`).join('')}</div><p class="muted sm" style="margin-top:12px">ℹ️ এগুলো সাধারণ তথ্য, চিকিৎসা পরামর্শ নয়।</p>`,`<button class="btn ghost" data-act="hqGo" data-i="${i-1}">‹ আগের</button><button class="btn" data-act="hqGo" data-i="${i+1}">পরের ›</button>`);
}

/* ---------- CALCULATOR ---------- */
function pCalc(){
 return `<div class="cols2">
 <div class="card"><h3>📦 বাল্ক থেকে প্যাক — দাম ও লাভ</h3><p class="muted sm" style="margin-bottom:12px">বড় পরিমাণে কিনে ছোট প্যাকে বিক্রি করলে প্যাকপ্রতি খরচ, দাম ও লাভ বের করুন। (নিচের সংখ্যাগুলো উদাহরণ, নিজের সংখ্যা বসান)</p>
 <div class="grid2">
  <label class="f">বাল্ক ক্রয়মূল্য (৳)<input type="number" id="a_cost" value="6500" oninput="calcA()"></label>
  <label class="f">বাল্ক পরিমাণ<div class="inl"><input type="number" step="any" id="a_qty" value="10" oninput="calcA()"><select id="a_unit" onchange="calcA()"><option value="kg">কেজি</option><option value="l">লিটার</option></select></div></label>
  <label class="f">অপচয় / ঘাটতি (%)<input type="number" step="any" id="a_waste" value="2" oninput="calcA()"></label>
  <label class="f">প্যাক সাইজ<div class="inl"><input type="number" id="a_pack" value="250" oninput="calcA()"><span class="suf" id="a_psuf">গ্রাম</span></div></label>
  <label class="f">প্যাকেজিং খরচ / প্যাক (৳)<input type="number" step="any" id="a_pkg" value="25" oninput="calcA()"></label>
  <label class="f">লেবেল ও অন্যান্য / প্যাক (৳)<input type="number" step="any" id="a_oth" value="10" oninput="calcA()"></label>
  <label class="f">কাঙ্ক্ষিত মুনাফা (%)<input type="number" step="any" id="a_m" value="25" oninput="calcA()"></label>
  <label class="f">আপনার ঠিক করা দাম (ঐচ্ছিক)<input type="number" id="a_price" placeholder="খালি রাখলে প্রস্তাবিত দাম" oninput="calcA()"></label>
 </div><div id="a_out"></div></div>
 <div class="card"><h3>💹 দাম ↔ লাভের হিসাব</h3><p class="muted sm" style="margin-bottom:12px">একটি পণ্যের একক প্রতি খরচ থেকে বিক্রয়মূল্য ও লাভ দেখুন, ছাড় দিলে লাভ কত কমবে তাও।</p>
 <label class="f" style="margin-bottom:12px">পণ্য থেকে নিন (ঐচ্ছিক)<select id="b_prod" onchange="bPref()"><option value="">— নিজে লিখব —</option>${prodOptions('')}</select></label>
 <div class="grid2">
  <label class="f">ক্রয়মূল্য / একক (৳)<input type="number" step="any" id="b_cost" value="650" oninput="calcB()"></label>
  <label class="f">অন্যান্য খরচ / একক (৳)<input type="number" step="any" id="b_extra" value="30" oninput="calcB()"></label>
  <label class="f">কাঙ্ক্ষিত মুনাফা (%)<input type="number" step="any" id="b_m" value="20" oninput="calcB()"></label>
  <label class="f">আপনার দাম (ঐচ্ছিক)<input type="number" step="any" id="b_price" placeholder="যেমন ৮৫০" oninput="calcB()"></label>
  <label class="f">বিক্রির পরিমাণ<input type="number" step="any" id="b_qty" value="1" oninput="calcB()"></label>

function calcA(){
 const cost=num('a_cost'),q=num('a_qty'),w=Math.min(num('a_waste'),90),pk=num('a_pack'),pkg=num('a_pkg'),oth=num('a_oth'),m=Math.min(num('a_m'),95),own=num('a_price');
 const u=$('#a_unit').value;$('#a_psuf').textContent=u==='kg'?'গ্রাম':'মিলি';
 const packs=pk>0?Math.floor(q*1000*(1-w/100)/pk):0;
 const out=$('#a_out');
 if(!packs||!cost){out.innerHTML='<div class="empty">হিসাবের জন্য ক্রয়মূল্য, পরিমাণ ও প্যাক সাইজ দিন</div>';return}
 const uc=cost/packs+pkg+oth,sug=Math.ceil(uc/(1-m/100)/5)*5,price=own>0?own:sug,pr=price-uc,mg=price>0?pr/price*100:0;
 out.innerHTML=`<div class="res">
  <div class="tile"><small>মোট প্যাক পাবেন</small><b>${bn(packs,0)}টি</b></div>
  <div class="tile"><small>প্যাকপ্রতি মোট খরচ</small><b>${tk(uc)}</b></div>
  <div class="tile hl"><small>${own>0?'আপনার দাম':'প্রস্তাবিত বিক্রয়মূল্য'}</small><b>${tk(price)}</b></div>
  <div class="tile ${pr<0?'neg':''}"><small>প্যাকপ্রতি লাভ</small><b>${tk(pr)}</b></div>
  <div class="tile ${pr<0?'neg':''}"><small>সব প্যাক বিক্রিতে মোট লাভ</small><b>${tk(pr*packs)}</b></div>
  <div class="tile ${mg<0?'neg':''}"><small>মুনাফার হার</small><b>${bn(mg,1)}%</b></div></div>
  <p class="muted sm" style="margin-top:10px">ব্রেক-ইভেন দাম (লাভ-ক্ষতি নেই): <b>${tk(Math.ceil(uc))}</b></p>`;
}
function bPref(){const p=getP($('#b_prod').value);if(p){$('#b_cost').value=p.cost;$('#b_price').value=p.price;calcB()}}
function calcB(){
 const cost=num('b_cost'),ex=num('b_extra'),m=Math.min(num('b_m'),95),own=num('b_price'),q=num('b_qty')||1;
 const uc=cost+ex;const out=$('#b_out');
 if(!uc){out.innerHTML='<div class="empty">ক্রয়মূল্য দিন</div>';return}
 const sug=Math.ceil(uc/(1-m/100)/5)*5,base=own>0?own:sug,pr=base-uc,mg=base>0?pr/base*100:0,mk=uc>0?pr/uc*100:0;
 const rows=[0,5,10,15,20].map(d=>{const p=base*(1-d/100),pf=p-uc,g=p>0?pf/p*100:0;return `<tr><td>${d?bn(d,0)+'% ছাড়':'ছাড় ছাড়া'}</td><td class="r">${tk(p)}</td><td class="r ${pf<0?'neg':''}">${tk(pf)}</td><td class="r ${pf<0?'neg':''}">${bn(g,1)}%</td></tr>`}).join('');
 out.innerHTML=`<div class="res">
  <div class="tile"><small>একক প্রতি মোট খরচ</small><b>${tk(uc)}</b></div>
  <div class="tile hl"><small>${bn(m,0)}% মুনাফায় দাম</small><b>${tk(sug)}</b></div>
  <div class="tile ${pr<0?'neg':''}"><small>${own>0?'আপনার দামে':'প্রস্তাবিত দামে'} লাভ/একক</small><b>${tk(pr)}</b></div>
  <div class="tile ${mg<0?'neg':''}"><small>মার্জিন | মার্কআপ</small><b>${bn(mg,1)}% | ${bn(mk,1)}%</b></div>
  <div class="tile" style="grid-column:1/-1"><small>${bn(q)} একক বিক্রিতে মোট লাভ</small><b>${tk(pr*q)}</b></div></div>
  <div class="sect">ছাড় দিলে কী হবে? (${tk(base)} ভিত্তি)</div>
  <table class="tbl"><thead><tr><th>ছাড়</th><th class="r">দাম</th><th class="r">লাভ</th><th class="r">মার্জিন</th></tr></thead><tbody>${rows}</tbody></table>`;
}

const PAY=()=>CM?{bkash:(CM.pm||{}).k,nagad:(CM.pm||{}).n,bank:(CM.pm||{}).b,acc:(CM.pm||{}).a}:{bkash:db.shop.bkash,nagad:db.shop.nagad,bank:db.shop.bank,acc:db.shop.acc};
const payLabel=m=>({COD:'ক্যাশ অন ডেলিভারি',bkash:'বিকাশ',nagad:'নগদ (Nagad)',bank:'ব্যাংক ট্রান্সফার',cash:'হাতে হাতে টাকা'}[m]||'');
function payOpts(sel){return [['COD','ক্যাশ অন ডেলিভারি (COD)'],['bkash','বিকাশ (পার্সোনাল)'],['nagad','নগদ (পার্সোনাল)'],['bank','ব্যাংক ট্রান্সফার'],['cash','হাতে হাতে টাকা']].map(x=>`<option value="${x[0]}" ${x[0]===sel?'selected':''}>${x[1]}</option>`).join('')}
function payLines(P){const L=['• ক্যাশ অন ডেলিভারি (COD)'];if(P.bkash)L.push('• বিকাশ (পার্সোনাল): '+P.bkash);if(P.nagad)L.push('• নগদ (পার্সোনাল): '+P.nagad);if(P.acc)L.push('• '+(P.bank||'ব্যাংক')+', A/c: '+P.acc);return L}
function thumbHTML(p,sz){const has=db.photos&&db.photos[p.id];return `<span class="thumb${has?' ph':''}"${sz?` style="width:${sz}px;height:${sz}px"`:''}><img src="${pImg(p)}" alt=""></span>`}
function catalogG(prods){
 const m=new Map();
 prods.filter(p=>p.price>0).forEach(p=>{const g=p.group||p.name,k=(p.cat||'other')+'|'+g;if(!m.has(k))m.set(k,{g,c:p.cat||'other',v:p.v||0,u:p.unit,z:[]});m.get(k).z.push([p.size||'',p.price,p.stock>0&&!p.st?1:0,p.st==='sold'?1:p.st==='na'?2:0])});
 return [...m.values()];
}

/* ---------- অর্ডার নোটিফিকেশন (ঐচ্ছিক ওয়েবহুক) ---------- */
function hookURL(){const u=String((CM?CM.hook:(db&&db.shop&&db.shop.hook))||'').trim();try{const x=new URL(u);return x.protocol==='https:'?x.href:''}catch(e){return ''}}
function cspHook(h){try{const x=new URL(String((db.shop||{}).hook||'').trim());if(x.protocol==='https:')return h.replace("connect-src 'none'","connect-src "+x.origin)}catch(e){}return h}

function socialURL(v,k){
 v=String(v||'').trim();if(!v)return '';
 if(!/^https?:\/\//i.test(v)){
  if(/\s/.test(v))return '';
  if(v.includes('.')||v.includes('/'))v='https://'+v.replace(/^\/+/,'');
  else v=(k==='fb'?'https://facebook.com/':'https://instagram.com/')+v.replace(/^@/,'');
 }
 try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return ''}
}

function startCats(){
 clearInterval(CAT.t);const tr=$('#cattrack');if(!tr)return;
 tr.addEventListener('pointerdown',()=>{CAT.p=Date.now()});
 CAT.t=setInterval(()=>{
  const t=$('#cattrack');if(!t){clearInterval(CAT.t);return}
